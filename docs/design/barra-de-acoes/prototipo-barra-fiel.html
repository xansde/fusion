<title>Barra de ações: protótipo fiel</title>
<style>
/* ===== tokens reais (packages/client/src/styles/base.css, linhas 13-120), mesmos nomes ===== */
:root{
  --fusion-bg:#0e0e12;--fusion-surface:#18181f;--fusion-surface-alt:#1f1f2a;--fusion-border:#2e2e3d;
  --fusion-text:#e8e8f0;--fusion-text-muted:#8888a0;--fusion-text-subtle:#55556a;
  --fusion-accent:#7c5cfc;--fusion-accent-hover:#9b7ffe;--fusion-accent-dim:rgba(124,92,252,.15);
  --fusion-success:#3ddc84;--fusion-warning:#ffc857;--fusion-danger:#ff5c5c;
  --fusion-success-dim:rgba(61,220,132,.14);--fusion-warning-dim:rgba(255,200,87,.14);--fusion-danger-dim:rgba(255,92,92,.14);
  --fusion-on-accent:#fff;--fusion-shadow-modal:0 24px 64px rgba(0,0,0,.55);
  --fusion-sidebar-width:300px;--fusion-sidebar-rail-width:44px;--fusion-header-height:48px;
  --fusion-condition-benefit:var(--fusion-success);--fusion-condition-harm:var(--fusion-danger);--fusion-condition-special:var(--fusion-accent);
  --fusion-radius-sm:4px;--fusion-radius:8px;--fusion-radius-lg:12px;--fusion-radius-pill:999px;
  --fusion-prof-u:var(--fusion-text-subtle);--fusion-prof-t:var(--fusion-accent);--fusion-prof-e:var(--fusion-success);--fusion-prof-m:var(--fusion-warning);--fusion-prof-l:var(--fusion-danger);
  --fusion-font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fusion-font-mono:ui-monospace,"Cascadia Code","Source Code Pro",Menlo,Consolas,monospace;
  --fusion-transition:150ms ease;
  --drawer-w:344px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--fusion-bg);color:var(--fusion-text);font-family:var(--fusion-font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--fusion-surface)}::-webkit-scrollbar-thumb{background:var(--fusion-border);border-radius:3px}

/* ===== chrome do protótipo (fora da tela) ===== */
.pt-top{flex:none;border-bottom:1px solid var(--fusion-border);background:var(--fusion-bg);padding:6px 14px 5px}
.pt-top__row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pt-top h1{font-size:13px;font-weight:700;white-space:nowrap}
.pt-sw{display:flex;gap:5px;flex-wrap:wrap}
.pt-sw button{font-size:12px;padding:3px 11px;border-radius:var(--fusion-radius-pill);border:1px solid var(--fusion-border);background:transparent;color:var(--fusion-text-muted);cursor:pointer}
.pt-sw button:hover{color:var(--fusion-text)}
.pt-sw button.on{border-color:var(--fusion-accent);background:var(--fusion-accent-dim);color:var(--fusion-accent-hover)}
.pt-top__foot{font-size:11px;color:var(--fusion-text-muted);margin-top:3px}
.stage{flex:1;min-height:0;position:relative}
.app{position:absolute;inset:0;overflow:hidden;background:var(--fusion-bg)}

/* ===== tela do app: cabeçalho (TableScreen.svelte) ===== */
.canvas-host{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;background:#000}
.table-header{position:absolute;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:.75rem;height:var(--fusion-header-height);padding:0 1rem;background:rgba(24,24,31,.85);backdrop-filter:blur(6px);border-bottom:1px solid var(--fusion-border)}
.table-header__world{display:flex;align-items:center;gap:.4rem;overflow:hidden}
.table-header__world-icon{color:var(--fusion-accent);font-size:1rem}
.table-header__world-name{font-size:.9375rem;font-weight:600;white-space:nowrap}
.active-scene-badge{display:flex;align-items:center;gap:.35rem;padding:.2rem .55rem;background:var(--fusion-accent-dim);border:1px solid rgba(124,92,252,.35);border-radius:var(--fusion-radius-sm)}
.badge__icon{color:var(--fusion-accent);font-size:.85rem;line-height:1}
.badge__name{font-size:.8rem;font-weight:500;white-space:nowrap}
.table-header__spacer{flex:1}
.table-header__conn{display:flex;align-items:center;gap:.35rem}
.indicator{width:8px;height:8px;border-radius:50%;background:var(--fusion-success);box-shadow:0 0 0 2px rgba(61,220,132,.25)}
.table-header__conn-label{color:var(--fusion-text-muted);font-size:.75rem}
.table-header__rtt{color:var(--fusion-text-subtle);font-family:var(--fusion-font-mono);font-size:.7rem}
.table-header__user{display:flex;align-items:center;gap:.45rem;padding:.2rem .6rem;background:var(--fusion-surface-alt);border:1px solid var(--fusion-border);border-radius:var(--fusion-radius-sm)}
.user-swatch{width:10px;height:10px;border-radius:50%}
.table-header__user-name{font-size:.8125rem;font-weight:500;white-space:nowrap}
.table-header__user-role{color:var(--fusion-text-subtle);font-size:.7rem}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--fusion-border);border-radius:var(--fusion-radius-sm);background:transparent;color:var(--fusion-text-muted);font-size:.8125rem;font-weight:500;padding:.3rem .75rem;cursor:pointer}

/* ===== gaveta (Sidebar / SidebarRail / SidebarDrawer) ===== */
.fusion-sidebar{position:absolute;top:var(--fusion-header-height);right:0;bottom:0;display:flex;flex-direction:row;z-index:90;pointer-events:none}
.sidebar-rail{display:flex;flex-direction:column;flex:0 0 auto;width:var(--fusion-sidebar-rail-width);height:100%;padding:6px 0;gap:6px}
.sidebar-rail__group{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sidebar-rail__group--gm{margin-top:14px;position:relative}
.sidebar-rail__group--footer{margin-top:auto;position:relative}
.sidebar-rail__group--gm::before,.sidebar-rail__group--footer::before{content:"";position:absolute;top:-8px;right:6px;width:28px;height:1px;background:var(--fusion-border)}
.sidebar-rail__button{display:flex;align-items:center;justify-content:center;width:40px;height:44px;padding:0;border:1px solid var(--fusion-border);border-right:0;border-radius:var(--fusion-radius) 0 0 var(--fusion-radius);background:var(--fusion-surface-alt);color:var(--fusion-text-muted);pointer-events:auto}
.sidebar-rail__button--active{width:44px;background:var(--fusion-surface);border-color:var(--fusion-accent);color:var(--fusion-accent-hover);box-shadow:1px 0 0 0 var(--fusion-surface)}
.sidebar-rail__button svg{width:20px;height:20px;display:block}
.sidebar-drawer{position:relative;flex:0 0 var(--fusion-sidebar-width);width:var(--fusion-sidebar-width);height:100%;overflow:hidden;background:var(--fusion-surface);border-left:1px solid var(--fusion-accent);pointer-events:auto}
/* conteúdo do painel = recortes do print real (fiel); o miolo vazio é a superfície do painel */
.dr-top,.dr-bot{position:absolute;left:0;right:0;background-image:var(--shot);background-repeat:no-repeat}
.dr-top{top:0}.dr-bot{bottom:0}
.app[data-skin=pl] .dr-top{height:112px;background-position:-1141px -48px}
.app[data-skin=pl] .dr-bot{height:134px;background-position:-1141px -1166px}
.app[data-skin=gm] .dr-top{height:254px;background-position:-1141px -48px}
.app[data-skin=gm] .dr-bot{height:38px;background-position:-1141px -1262px}

/* ===== tokens no canvas ===== */
.tk{position:absolute;display:flex;align-items:center;justify-content:center;width:calc(var(--s)*100px);height:calc(var(--s)*100px);border-radius:14%;background:#4a90d9;border:2px solid #e8eb66;color:#fff;font-weight:700;font-size:calc(var(--s)*38px);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tk--npc{background:#3498db}
.tk--hostile{border-color:#dc282b}
.tk--sel{outline:2px solid #fff;outline-offset:3px}
.tk__lb{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;font-size:9px;font-weight:500;color:#fff;white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000}
.tk__mk{position:absolute;top:-9px;left:50%;width:14px;height:14px;margin-left:-7px;background:#e9c039;transform:rotate(45deg);border:1px solid rgba(255,255,255,.55)}
.aim-dim{position:absolute;inset:var(--fusion-header-height) 0 0 0;background:rgba(0,0,0,.42);z-index:70;cursor:crosshair}
.aim-hint{position:absolute;top:60px;left:calc((100% - var(--drawer-w))/2);transform:translateX(-50%);z-index:95;padding:6px 14px;background:var(--fusion-surface-alt);border:1px solid var(--fusion-accent);border-radius:var(--fusion-radius-sm);font-size:.8125rem;box-shadow:var(--fusion-shadow-modal);white-space:nowrap}
.aim-hint b{color:var(--fusion-accent-hover)}
.aim-cross{position:absolute;z-index:71;width:34px;height:34px;color:#fff;pointer-events:none;filter:drop-shadow(0 0 3px #000)}

/* ===== notas de design (fora da barra) ===== */
.notes{position:absolute;left:12px;top:60px;z-index:85;width:300px;background:rgba(24,24,31,.94);border:1px dashed rgba(255,200,87,.55);border-radius:var(--fusion-radius)}
.notes__h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:6px 10px;background:transparent;border:0;color:var(--fusion-warning);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.notes ul{list-style:none;padding:0 10px 8px}
.notes li{font-size:11.5px;line-height:1.4;color:var(--fusion-text);padding:3px 0 3px 12px;position:relative}
.notes li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--fusion-warning)}
.notes.is-closed ul,.notes.is-closed .notes__b{display:none}
.notes__b{margin:0 10px 10px;padding:4px 10px;border:1px solid var(--fusion-warning);border-radius:var(--fusion-radius-sm);background:var(--fusion-warning-dim);color:var(--fusion-warning);font-size:11px;font-weight:600;cursor:pointer}

/* ===== a barra ===== */
.abar{position:absolute;bottom:14px;left:calc((100% - var(--drawer-w))/2);transform:translateX(-50%);z-index:80;width:min(780px,calc(100% - var(--drawer-w) - 24px));background:rgba(24,24,31,.94);backdrop-filter:blur(6px);border:1px solid var(--fusion-border);border-radius:var(--fusion-radius-lg);box-shadow:var(--fusion-shadow-modal);font-family:var(--fusion-font)}
.ab-state{display:grid;grid-template-columns:auto minmax(150px,1fr) minmax(130px,1fr) auto;column-gap:14px;align-items:center;padding:8px 10px;min-height:56px}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.actor-portrait{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;flex:none;color:#fff;font-weight:700;font-size:17px;line-height:1;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12)}
.who__id{display:flex;flex-direction:column;min-width:0;max-width:150px}
.who__name{font-size:.8125rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who__cls{font-size:11px;color:var(--fusion-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seal-gm{display:inline-block;margin-left:6px;padding:0 5px;border-radius:var(--fusion-radius-sm);background:var(--fusion-accent-dim);color:var(--fusion-accent-hover);font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;vertical-align:1px}
.hp{display:flex;align-items:center;gap:6px}
.hp__lb{font-size:10px;font-weight:700;color:var(--fusion-text-muted);letter-spacing:.04em}
.hp__track{display:block;flex:1;height:.375rem;border-radius:var(--fusion-radius-pill);background:var(--fusion-surface);overflow:hidden;display:flex}
.hp__fill{display:block;height:100%}
.hp__tmp{display:block;height:100%;background:var(--fusion-accent)}
.hp__txt{font-family:var(--fusion-font-mono);font-size:.6875rem;color:var(--fusion-text-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hp__txt b{color:var(--fusion-text);font-weight:600}
.hp__tmpt{color:var(--fusion-accent-hover)}

function lookup(ch,id){for(const t of ['golpes','magias','acoes','itens','reacoes','testes']){for(const g of (ch[t]||[]))for(const s of g.s)if(s.id===id)return s;}return null;}
function strikeVal(s,sc){const st=s.st;if(!st)return null;const p=st.noMap?0:pen(sc.map,st.ag);return {p,v:st.b+p,base:st.b};}
function slotHTML(s,i,fav,sc){
  const sv=strikeVal(s,sc);const val=sv&&!s.mp?fmt(sv.v):(sv&&s.mp?fmt(sv.v):s.v);
  const cls='slot'+(s.why?' is-off':'')+(s.on?' is-on':'')+(s.img?' has-img':'');
  const seal=s.r?'<i class="slot__seal slot__seal--r">'+s.r+'</i>':s.rk?'<i class="slot__seal slot__seal--'+s.rk+'">'+s.rk.toUpperCase()+'</i>':s.mp?'<i class="slot__seal slot__seal--map">MAP</i>':s.q?'<i class="slot__seal">'+s.q+'</i>':'';
  const KEYS=['1','2','3','4','5','6','7','8','9','0',MS,'='];
  return '<button class="'+cls+'" data-id="'+s.id+'" aria-label="'+s.n.replace(/"/g,'')+'"'+(s.why?' aria-disabled="true"':'')+'>'+
    (s.c!==undefined&&s.c!==''?'<i class="slot__c">'+GLY[s.c]+'</i>':'')+seal+
    (s.img?'<span class="slot__img"><img alt="" src="'+s.img+'"></span>':s.tx?'<span class="slot__tx">'+s.tx+'</span>':'<span class="slot__ic">'+svg(s.ic)+'</span>')+
    (fav?'<i class="slot__k">'+KEYS[i]+'</i>':'')+(val?'<i class="slot__v">'+val+'</i>':'')+'</button>';
}
function slotsHTML(sc,ch){
  if(tab==='fav'){return '<div class="fav">'+ch.fav.map((id,i)=>{const s=lookup(ch,id);return s?slotHTML(s,i,true,sc):'';}).join('')+'</div>';}

function showTip(el){
  const sc=SCREENS[cur],ch=CHARS[sc.who],s=lookup(ch,el.dataset.id);if(!s)return;
  const l=layer();l.querySelectorAll('.tip').forEach(t=>t.remove());
  const d=document.createElement('div');d.className='tip';d.innerHTML=tipHTML(s,sc);l.appendChild(d);
  const p=pos(el,272,0),bt=$('#abar').getBoundingClientRect(),aa=app.getBoundingClientRect();d.style.left=p.l+'px';d.style.bottom=(aa.bottom-bt.top+6)+'px';
}
function hideTip(){if(pinned)return;const l=layer();if(l)l.querySelectorAll('.tip').forEach(t=>t.remove());}
function preview(el){
  const t=$('#turn');if(!t)return;const sc=SCREENS[cur],ch=CHARS[sc.who],s=el&&lookup(ch,el.dataset.id);
  if(s&&s.st&&!s.mp&&(sc.turn.k==='mine'||sc.turn.k==='npc')){const p2=pen(sc.map+1,s.st.ag);t.classList.add('is-pv');t.querySelector('.pv').innerHTML='→ depois: <b>'+fmt(s.st.b+p2)+'</b> (MAP '+fmt(p2)+')';}
  else if(s&&s.st&&!s.mp){t.classList.remove('is-pv');}
  else {t.classList.remove('is-pv');}
}
function iconItems(s){return '<div class="ctx__sep"></div><button class="ctx__i" data-act="seticon" data-id="'+s.id+'"><span>Trocar ícone…</span><span>imagem</span></button>'+(s.img?'<button class="ctx__i" data-act="reseticon" data-id="'+s.id+'"><span>Restaurar ícone padrão</span><span></span></button>':'')+'<div class="ctx__sep"></div>';}
function openCtx(el,cx,cy){
  const sc=SCREENS[cur],ch=CHARS[sc.who],s=lookup(ch,el.dataset.id);if(!s)return;
  clearLayer();const l=layer();el.classList.add('is-hot');ctxId=s.id;
  let items='';
  if(s.st&&!s.st.noMap){const ag=s.st.ag,b=s.st.b;items+='<div class="ctx__h">Variantes</div>'+[0,1,2].map(m=>{const p=pen(m,ag);return '<button class="ctx__i"><span>'+(m+1)+'º ataque</span><span>'+fmt(b+p)+(p?' (MAP '+fmt(p)+')':'')+'</span></button>';}).join('')+'<div class="ctx__sep"></div>';}
  else if(s.vs&&Array.isArray(s.vs)){items+='<div class="ctx__h">Perícia</div>'+s.vs.map(v=>{const q=v.split('|');return '<button class="ctx__i"><span>'+q[0]+'</span><span>'+q[1]+'</span></button>';}).join('')+'<div class="ctx__sep"></div>';}
  const isFav=ch.fav.includes(s.id);
  items+='<button class="ctx__i"><span>'+(isFav?'Desafixar dos favoritos':'Fixar nos favoritos')+'</span><span></span></button>'+iconItems(s)+'<button class="ctx__i"><span>Ver detalhes</span><span>Alt</span></button><button class="ctx__i"><span>Abrir na ficha</span><span></span></button>';
  const d=document.createElement('div');d.className='ctx';d.innerHTML='<div class="ctx__t">'+s.n+'</div>'+items;l.appendChild(d);
  const a=app.getBoundingClientRect(),r=el.getBoundingClientRect();let L=(cx!==undefined?cx-a.left:r.left-a.left+r.width/2-110);L=Math.max(8,Math.min(a.width-344-232,L));
  const bt=$('#abar').getBoundingClientRect();d.style.left=L+'px';d.style.bottom=(a.bottom-bt.top+6)+'px';
}
function openPop(el){
  const sc=SCREENS[cur],ch=CHARS[sc.who],s=lookup(ch,el.dataset.id);if(!s||!s.vars)return;
  clearLayer();const l=layer();el.classList.add('is-hot');
  const d=document.createElement('div');d.className='pop';d.innerHTML='<div class="ctx__h">'+s.n+' · escolha o custo</div>'+s.vars.map(v=>'<button class="pop__o"><span>'+GLY[v[0]]+'</span><span>'+v[1]+'<small>'+v[2]+'</small></span></button>').join('');
  l.appendChild(d);const a=app.getBoundingClientRect(),r=el.getBoundingClientRect(),bt=$('#abar').getBoundingClientRect();let L=r.left-a.left+r.width/2-130;L=Math.max(8,Math.min(a.width-344-280,L));d.style.left=L+'px';d.style.bottom=(a.bottom-bt.top+6)+'px';
}
function toast(msg){
  const l=layer();l.querySelectorAll('.toast').forEach(t=>t.remove());const bar=$('#abar'),a=app.getBoundingClientRect(),b=bar.getBoundingClientRect();
  const d=document.createElement('div');d.className='toast';d.textContent=msg;d.style.left=(b.left-a.left+b.width/2)+'px';d.style.bottom=(a.bottom-b.top+10)+'px';l.appendChild(d);setTimeout(()=>d.remove(),1800);
}
function chipTip(el){
  const k=el.dataset.cond,c=COND[k],l=layer();clearLayer();el.classList.add('is-open');
  const d=document.createElement('div');d.className='tip tip--chip';d.innerHTML='<div class="tip__chip-h">'+c.n+'</div><div class="tip__chip-fx">'+c.fx+'</div>';l.appendChild(d);
  const p=pos(el,236,0);d.style.left=p.l+'px';d.style.bottom=p.bottom+'px';
}

/* ===================== eventos ===================== */
app.addEventListener('mouseover',e=>{const sl=e.target.closest('.slot');if(sl===hovEl)return;hovEl=sl;
  if(sl){if(pinned){pinned=false;}if(!$('#layer .ctx')&&!$('#layer .pop')){showTip(sl);}preview(sl);}else{hideTip();preview(null);}});
app.addEventListener('contextmenu',e=>{if(e.target.closest('.abar')){e.preventDefault();const sl=e.target.closest('.slot');if(sl){openCtx(sl,e.clientX,e.clientY);}}});
app.addEventListener('click',e=>{
  const t=e.target;
  const tabBtn=t.closest('[data-tab]');
  if(tabBtn){tab=tabBtn.dataset.tab;clearLayer();const sc=SCREENS[cur];$('#abar').innerHTML=barHTML(sc,CHARS[sc.who]);return;}
  const act=t.closest('[data-act]');
  if(act){const a=act.dataset.act;
    if(a==='collapse'){collapsed=true;$('#abar').classList.add('is-collapsed');clearLayer();return;}
    if(a==='expand'){collapsed=false;$('#abar').classList.remove('is-collapsed');return;}
    if(a==='notes'){$('#notes').classList.toggle('is-closed');return;}
    if(a==='aim'){aim=!aim;syncAim();return;}
    if(a==='seticon'||a==='reseticon'){const sc=SCREENS[cur],ch=CHARS[sc.who],s=lookup(ch,act.dataset.id);if(s){if(a==='seticon'){s.img=SAMPLES[sampleIdx++%SAMPLES.length];toast('Ícone trocado (simulado: no app abre o seletor de imagens do acervo)');}else{delete s.img;toast('Ícone padrão restaurado');}}clearLayer();$('#abar').innerHTML=barHTML(sc,ch);return;}
    if(a==='end'){toast('Turno encerrado (simulado)');return;}}
  const chip=t.closest('[data-cond]');
  if(chip){const was=chip.classList.contains('is-open');clearLayer();if(!was)chipTip(chip);return;}
  const it=t.closest('.ctx__i,.pop__o');if(it){clearLayer();toast('→ card no chat (simulado)');return;}
  const sl=t.closest('.slot');
  if(sl){const sc=SCREENS[cur],s=lookup(CHARS[sc.who],sl.dataset.id);if(s&&s.why){return;}if(s&&s.vars){openPop(sl);return;}clearLayer();toast('→ card no chat (simulado)');return;}
  if(!t.closest('.ctx,.pop,.tip'))clearLayer();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){clearLayer();if(aim){aim=false;syncAim();}}});

/* ===================== seletor de telas ===================== */
const sw=document.getElementById('sw');
Object.keys(SCREENS).forEach(k=>{const b=document.createElement('button');b.dataset.s=k;b.textContent=SCREENS[k].lb;b.onclick=()=>render(k);sw.appendChild(b);});
render((location.hash||'#t1').slice(1) in SCREENS?(location.hash||'#t1').slice(1):'t1');
</script>
</body>
