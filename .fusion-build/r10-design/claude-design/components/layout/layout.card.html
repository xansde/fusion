<script type="text/babel">
  const { Panel, Modal, Button, SearchBox, Chip, ResultRow } = window.FusionVTTDesignSystem_1daa5f;
  function Demo() {
    const [open, setOpen] = React.useState(false);
    return (
      <>
        <span className="lbl">Panel (title + actions)</span>
        <Panel title="Grimório" actions={<Button variant="primary" size="sm">+ Adicionar magia</Button>}>
          <div style={{fontSize:13, color:"var(--fusion-text-muted)"}}>Graxa · Golpe Certeiro · Tentáculos Sombrios</div>
        </Panel>
        <div>
          <Button variant="secondary" onClick={() => setOpen(true)}>Abrir Modal</Button>
        </div>
        {open && (
          <Modal
            title="Adicionar magia — Magus (Arcana)"
            onClose={() => setOpen(false)}
            footerNote="Dados mecânicos ORC — prosa não incluída (clean-room)"
            footer={<>
              <Button variant="secondary" onClick={() => setOpen(false)}>Cancelar</Button>
              <Button variant="primary" onClick={() => setOpen(false)}>Adicionar ao grimório</Button>
            </>}
          >
            <SearchBox />
            <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
              <Chip active>1</Chip><Chip>2</Chip><Chip fixed>Tradição: Arcana</Chip>
            </div>
            <div style={{border:"1px solid var(--fusion-border)", borderRadius:8, padding:4}}>
              <ResultRow rank={1} actionCost="2A" name="Rajada de Força" traits={["Evocation","Force"]} source="Player Core" selected />
              <ResultRow rank={1} actionCost="1A" name="Graxa" traits={["Conjuration"]} source="Player Core" />
            </div>
          </Modal>
        )}
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
