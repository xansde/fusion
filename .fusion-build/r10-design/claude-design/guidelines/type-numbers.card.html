<link rel="stylesheet" href="../styles.css">
<style>

  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fusion-text-subtle); }
  .val { font-family: var(--fusion-font-mono); font-weight: 700; color: var(--fusion-text); }
</style>

  <div class="item"><span class="lbl">Ataque</span><span class="val" style="font-size:24px">+8</span></div>
  <div class="item"><span class="lbl">Fort / Ref / Von</span><span class="val" style="font-size:18px">+8 · +8 · +7</span></div>

</div>
