<!-- @dsCard group="Brand" viewport="700x180" name="Proficiency (TEML)" subtitle="Pathfinder 2e ranks — U grey · T violet · E green · M amber · L red" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--fusion-bg); font-family: var(--fusion-font); color: var(--fusion-text); }
  .wrap { padding: 26px; display: flex; gap: 26px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .badge { width: 32px; height: 32px; border-radius: var(--fusion-radius-sm); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; border: 1px solid transparent; }
  .cap { font-size: 11px; color: var(--fusion-text-muted); }
  .u { background: var(--fusion-prof-u-bg); color: var(--fusion-prof-u); border-color: var(--fusion-prof-u-border); }
  .t { background: var(--fusion-prof-t-bg); color: var(--fusion-accent-hover); border-color: var(--fusion-prof-t-border); }
  .e { background: var(--fusion-prof-e-bg); color: var(--fusion-prof-e); border-color: var(--fusion-prof-e-border); }
  .m { background: var(--fusion-prof-m-bg); color: var(--fusion-prof-m); border-color: var(--fusion-prof-m-border); }
  .l { background: var(--fusion-prof-l-bg); color: var(--fusion-prof-l); border-color: var(--fusion-prof-l-border); }
</style>
<div class="wrap">
  <div class="item"><span class="badge u">U</span><span class="cap">Destreinado</span></div>
  <div class="item"><span class="badge t">T</span><span class="cap">Treinado</span></div>
  <div class="item"><span class="badge e">E</span><span class="cap">Expert</span></div>
  <div class="item"><span class="badge m">M</span><span class="cap">Mestre</span></div>
  <div class="item"><span class="badge l">L</span><span class="cap">Lendário</span></div>
</div>
