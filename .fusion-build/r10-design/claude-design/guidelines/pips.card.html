<!-- @dsCard group="Brand" viewport="700x160" name="Pips — Foco & Heroísmo" subtitle="Filled = spent-available · empty = unfilled · hatched = locked (above max)" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--fusion-bg); font-family: var(--fusion-font); color: var(--fusion-text); }
  .wrap { padding: 26px; display: flex; gap: 42px; align-items: center; }
  .grp { display: flex; flex-direction: column; gap: 8px; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fusion-text-subtle); }
  .dots { display: flex; gap: 6px; }
  .pip { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--fusion-border); background: transparent; }
  .pip.filled { background: var(--fusion-accent); border-color: var(--fusion-accent); }
  .pip.locked { background: repeating-linear-gradient(45deg, var(--fusion-surface-alt), var(--fusion-surface-alt) 2px, transparent 2px, transparent 4px); opacity: 0.4; }
  .legend { font-size: 11px; color: var(--fusion-text-muted); }
</style>
<div class="wrap">
  <div class="grp">
    <span class="lbl">Pontos de Heroísmo · 1/3</span>
    <div class="dots"><span class="pip filled"></span><span class="pip"></span><span class="pip"></span></div>
  </div>
  <div class="grp">
    <span class="lbl">Pontos de Foco · 1 de máx 1</span>
    <div class="dots"><span class="pip filled"></span><span class="pip locked"></span><span class="pip locked"></span></div>
  </div>
  <div class="legend">Preenchido · Vazio · Bloqueado (acima do máximo)</div>
</div>
