name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # F4 (DEC-SEP-09): fusion-systems-2e is a git submodule pinned by
          # tag at external/fusion-systems-2e/ — the workspace can't resolve
          # @fusion/system-pf2e, @fusion/sheets-pf2e etc. without it checked
          # out for real.
          submodules: true
          # fusion-systems-2e is a PRIVATE repo — the default GITHUB_TOKEN is
          # an installation token scoped only to THIS repo (`fusion`), so it
          # cannot clone a second private repo even under the same owner
          # (found running this for real: "remote: Repository not found").
          # FUSION_SYSTEMS_2E_TOKEN is a PAT (same account, xansde) with repo
          # access to fusion-systems-2e — actions/checkout uses whatever
          # `token` it's given for submodule fetching too, as long as the
          # submodule is on the same host (github.com).
          token: ${{ secrets.FUSION_SYSTEMS_2E_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Lint boundaries
        run: pnpm lint:boundaries

      # pregen-parity.test.ts (issue #48) used to run here against the
      # gitignored `vendor/` clone of Paizo's pregen sheets (sparse
      # checkout, ~12 MB — Paizo content must not be committed, see
      # CLAUDE.md). F4 (DEC-SEP-09): that test moved with the ficha to
      # sheets/pf2e in the fusion-systems-2e submodule
      # (external/fusion-systems-2e/sheets/pf2e/src/lib/sheets/pf2e/
      # __tests__/pregen-parity.test.ts). sheets/pf2e now has its own
      # vitest.config.ts (satellite PR #43, 24/08/2026), wired into
      # vitest.workspace.ts, so `pnpm test` below reaches it — the test
      # itself self-skips at runtime when tools/importer-pf2e/vendor/ isn't
      # present (it isn't, here — same as before F4).
      #
      # tools/{importer-pf2e,translate-packs} also moved to the satellite —
      # "Test tools (node:test)" ran them here before F4; they now run in
      # fusion-systems-2e's own CI (scripts/setup-core.sh + ci.yml there).
      - name: Test
        run: pnpm test

      - name: Coverage (shared ≥80%)
        run: pnpm --filter @fusion/shared run test:coverage
