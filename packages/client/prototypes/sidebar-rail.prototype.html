<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>PROTOTYPE — Sidebar rail (3 variantes)</title>
<!--
  PROTOTYPE — throwaway. Pergunta: "como a barra lateral direita deve ficar com
  botões verticais só-ícone, visíveis mesmo recolhida, + aba de Configurações/Mods do GM?"
  Três variantes trocáveis via ?variant=A|B|C e pela barra flutuante inferior (← →).
  Não é código de produção; não importar nada daqui sem reescrever.
-->
<style>
  :root{
    --bg:#0e0e12;--surface:#18181f;--surface-alt:#1f1f2a;--border:#2e2e3d;
    --text:#e8e8f0;--muted:#8888a0;--subtle:#55556a;
    --accent:#7c5cfc;--accent-hover:#9b7ffe;--accent-dim:rgba(124,92,252,.15);
    --danger:#ff5c5c;--radius-sm:4px;--radius:8px;--radius-lg:12px;
    --font:system-ui,-apple-system,"Segoe UI",sans-serif;
    --header:48px;--panel-w:300px;--rail-w:44px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden}

  /* ---------- App shell (mock) ---------- */
  .header{height:var(--header);display:flex;align-items:center;gap:.75rem;padding:0 .75rem;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:200}
  .header .bolt{color:#f5a623}
  .header .world{font-weight:600}
  .header .pill{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent-hover);border-radius:var(--radius-sm);padding:.15rem .5rem;font-size:.8rem;font-weight:600}
  .header .spacer{flex:1}
  .header .status{color:var(--muted);font-size:.8rem;display:flex;align-items:center;gap:.35rem}
  .header .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84}
  .header .gm{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.15rem .5rem;font-size:.8rem}
  .header .gm b{color:var(--danger)}
  .header .btn{background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:.2rem .6rem;font:inherit;font-size:.8rem}
  .stage{position:absolute;top:var(--header);left:0;right:0;bottom:0;background:#0b0b0f;display:grid;place-items:center}
  .stage .art{width:44vh;height:44vh;border-radius:6px;background:radial-gradient(circle at 50% 45%,#2f6bd6 0%,#1a3f8f 55%,#132c68 100%);display:grid;place-items:center;box-shadow:0 0 0 1px #21407f}
  .stage .art .house{width:60%;height:60%;background:#fff;clip-path:polygon(50% 0,100% 40%,88% 40%,88% 100%,12% 100%,12% 40%,0 40%);display:grid;place-items:center}
  .stage .art .star{font-size:9vh;color:#e5b83b;margin-top:22%}

  /* ---------- Shared bits ---------- */
  .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
  .tabbtn{position:relative;display:grid;place-items:center;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;transition:color .12s,background .12s}
  .tabbtn:hover{color:var(--text)}
  .tabbtn.is-active{color:var(--accent-hover)}
  .tabbtn .badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center;line-height:1}
  .tabbtn .badge.combat{background:rgba(255,215,0,.18);border:1px solid #ffd700;color:#ffd700;font-size:.6rem}
  .tabbtn .tip{position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#0b0b0f;border:1px solid var(--border);color:var(--text);padding:.25rem .5rem;border-radius:var(--radius-sm);font-size:.75rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:5}
  .tabbtn:hover .tip{opacity:1}
  .tabbtn .tip .kbd{color:var(--subtle);margin-left:.4rem;font-family:ui-monospace,monospace;font-size:.7rem}
  .divider{height:1px;background:var(--border);margin:6px 8px}
  .grow{flex:1}

  /* panel content mock */
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:.6rem .8rem;border-bottom:1px solid var(--border);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .panel-head .close{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1}
  .panel-body{flex:1;overflow:auto;padding:.75rem .8rem;color:var(--muted);font-size:.85rem}
  .empty{text-align:center;padding:1.5rem 0 .75rem;color:var(--muted)}
  .row{display:flex;align-items:center;gap:.5rem;padding:.4rem .5rem;border-radius:var(--radius-sm)}
  .row:hover{background:var(--surface-alt)}
  .row .name{color:var(--text)}
  .row .sub{color:var(--subtle);font-size:.75rem;margin-left:auto}
  .btnp{background:var(--accent);color:#fff;border:0;border-radius:var(--radius-sm);padding:.35rem .7rem;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
  .btns{background:var(--surface-alt);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.35rem .7rem;font:inherit;font-size:.8rem;cursor:pointer}
  .actions{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
  .msg{padding:.4rem .5rem;border-left:2px solid var(--border);margin-bottom:.5rem}
  .msg b{color:var(--text)}
  .mods-empty{border:1px dashed var(--border);border-radius:var(--radius);padding:1rem;text-align:center;color:var(--subtle)}
  .mods-empty .btnp{margin-top:.6rem}
  .setting{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border)}
  .setting .name{color:var(--text)}
  .toggle{width:32px;height:18px;border-radius:999px;background:var(--border);position:relative}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted)}
  .toggle.on{background:var(--accent)}.toggle.on::after{left:16px;background:#fff}
  .gm-tag{font-size:.6rem;color:var(--danger);border:1px solid var(--danger);border-radius:3px;padding:0 3px;margin-left:.4rem;letter-spacing:.05em}
  .sec-title{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:.2rem 0 .5rem}

  /* ========== VARIANTE A — Trilho fixo na borda (activity bar) ========== */
  .A .sidebar{position:absolute;top:var(--header);right:0;bottom:0;display:flex;z-index:90}
  .A .rail{width:var(--rail-w);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:stretch;padding:6px 0}
  .A .rail .tabbtn{height:40px;margin:2px 4px;border-radius:var(--radius-sm)}
  .A .rail .tabbtn.is-active{background:var(--accent-dim)}
  .A .rail .tabbtn.is-active::before{content:"";position:absolute;left:-4px;top:8px;bottom:8px;width:2px;background:var(--accent);border-radius:2px}
  .A .panel{width:var(--panel-w);background:var(--surface);border-left:1px solid var(--border);display:none;flex-direction:column}
  .A.is-open .panel{display:flex}

  /* ========== VARIANTE B — Dock flutuante + painel-cartão ========== */
  .B .sidebar{position:absolute;top:var(--header);right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px;z-index:90;pointer-events:none}
  .B .sidebar>*{pointer-events:auto}
  .B .dock{display:flex;flex-direction:column;gap:2px;background:rgba(24,24,31,.92);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:999px;padding:6px 4px;box-shadow:0 8px 30px rgba(0,0,0,.55)}
  .B .dock .tabbtn{width:38px;height:38px;border-radius:50%}
  .B .dock .tabbtn.is-active{background:var(--accent);color:#fff}
  .B .dock .sep{height:1px;background:var(--border);margin:4px 8px}
  .B .panel{width:var(--panel-w);max-height:min(78vh,720px);align-self:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);display:none;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.6);overflow:hidden}
  .B.is-open .panel{display:flex}
  .B .panel-head{background:var(--surface-alt)}

  /* ========== VARIANTE C — Abas físicas grudadas ao painel (gaveta) ========== */
  .C .sidebar{position:absolute;top:var(--header);right:0;bottom:0;display:flex;z-index:90}
  .C .tabs{width:var(--rail-w);display:flex;flex-direction:column;padding-top:10px;gap:3px;align-items:flex-end}
  .C .tabs .tabbtn{width:40px;height:44px;border:1px solid var(--border);border-right:0;border-radius:var(--radius) 0 0 var(--radius);background:var(--surface-alt);color:var(--muted)}
  .C .tabs .tabbtn.is-active{background:var(--surface);color:var(--accent-hover);width:44px;border-color:var(--accent);z-index:2}
  .C.is-open .tabs .tabbtn.is-active{box-shadow:1px 0 0 0 var(--surface)}
  .C .tabs .tabbtn.is-active .icon{width:22px;height:22px}
  .C .tabs .chev{width:40px;height:26px;border-radius:var(--radius-sm) 0 0 var(--radius-sm);margin-bottom:6px;font-size:.8rem;background:none;border:1px solid var(--border);border-right:0;color:var(--subtle)}
  .C .tabs .grp{margin-top:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .C .tabs .grp .tabbtn{border-color:rgba(255,92,92,.35)}
  .C .panel{width:var(--panel-w);background:var(--surface);border-left:1px solid var(--accent);display:none;flex-direction:column}
  .C.is-open .panel{display:flex}
  .C .panel .panel-head{border-bottom-color:var(--accent-dim)}

  /* ---------- Floating switcher (não faz parte do design) ---------- */
  .switcher{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:.5rem;background:#fff;color:#111;border-radius:999px;padding:.35rem .5rem .35rem .75rem;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:.85rem;font-weight:600}
  .switcher button{border:0;background:#111;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:1rem}
  .switcher .lbl{min-width:260px;text-align:center}
  .switcher .lbl small{display:block;font-weight:400;color:#555;font-size:.72rem}
</style>
</head>
<body>

<div class="header">
  <span class="bolt">⚡</span><span class="world">teste_xande</span><span class="pill">🗺 aha</span>
  <span class="spacer"></span>
  <span class="status"><span class="dot"></span>Conectado <sup>2ms</sup></span>
  <span class="gm"><b>●</b> Gamemaster · <span style="color:var(--muted)">Mestre</span></span>
  <button class="btn">Sair</button>
</div>
<div class="stage"><div class="art"><div class="house"><div class="star">★</div></div></div></div>

<div id="root"></div>

<div class="switcher" id="switcher">
  <button id="prev" title="Anterior (←)">‹</button>
  <span class="lbl" id="lbl"></span>
  <button id="next" title="Próxima (→)">›</button>
</div>

<script>
/* ---------- dados mock ---------- */
const ICONS = {
  scenes:  '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>',
  combat:  '<svg class="icon" viewBox="0 0 24 24"><path d="M4 4l11 11M20 4L9 15"/><path d="M14 16l2 2M10 16l-2 2M17 13l3 3-2 2-3-3M7 13l-3 3 2 2 3-3"/></svg>',
  chat:    '<svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  actors:  '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  compendium:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>',
  settings:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>',
};
const TABS = [
  {id:'chat',      label:'Chat',          key:'1', badge:'3'},
  {id:'combat',    label:'Combate',       key:'2', badge:'⚔', badgeCls:'combat'},
  {id:'actors',    label:'Atores',        key:'3'},
  {id:'compendium',label:'Compêndio',     key:'4'},
  {id:'scenes',    label:'Cenas',         key:'5', gm:true},
  {id:'settings',  label:'Configurações', key:'6', gm:true},
];
const CONTENT = {
  scenes: `<div class="panel-body">
      <div class="row"><span style="color:#3ddc84">●</span><span class="name">Fortaleza (mapa)</span><span class="sub">ativa</span></div>
      <div class="row"><span style="color:var(--subtle)">○</span><span class="name">Sala do trono</span><span class="sub">▶ ✎ 🗑</span></div>
      <div class="row"><span style="color:var(--subtle)">○</span><span class="name">Caverna dos goblins</span><span class="sub">▶ ✎ 🗑</span></div>
      <div class="actions" style="margin-top:.8rem"><button class="btnp">Nova cena</button></div></div>`,
  combat: `<div class="panel-body"><p class="empty">Nenhum combate ativo.</p>
      <div class="actions"><button class="btnp">Criar Combate</button><button class="btns">Adicionar tokens</button></div></div>`,
  chat: `<div class="panel-body">
      <div class="msg"><b>Gamemaster</b> · <span style="font-size:.75rem">21:04</span><br>Vocês entram na sala do trono…</div>
      <div class="msg"><b>Fofurinha</b> · <span style="font-size:.75rem">21:05</span><br>Rolo Percepção — <b>1d20+7 = 19</b></div>
      <div class="msg"><b>Tobias</b> · <span style="font-size:.75rem">21:05</span><br>eu saco a espada</div>
      <div style="margin-top:.6rem;border:1px solid var(--border);border-radius:var(--radius-sm);padding:.4rem .5rem;color:var(--subtle)">Digite uma mensagem ou /r 1d20…</div></div>`,
  actors: `<div class="panel-body">
      <div class="row"><span>🧝</span><span class="name">Fofurinha</span><span class="sub">Druida 5</span></div>
      <div class="row"><span>🧔</span><span class="name">Tobias</span><span class="sub">Guerreiro 5</span></div>
      <div class="row"><span>👹</span><span class="name">Goblin Guerreiro</span><span class="sub">NPC</span></div>
      <div class="actions" style="margin-top:.8rem"><button class="btnp">Novo ator</button><button class="btns">Importar</button></div></div>`,
  compendium: `<div class="panel-body">
      <div style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:.4rem .5rem;color:var(--subtle);margin-bottom:.6rem">🔍 Buscar no compêndio…</div>
      <div class="row"><span class="name">Talentos</span><span class="sub">1.812</span></div>
      <div class="row"><span class="name">Magias</span><span class="sub">1.024</span></div>
      <div class="row"><span class="name">Equipamentos</span><span class="sub">2.310</span></div>
      <div class="row"><span class="name">Bestiário</span><span class="sub">492</span></div></div>`,
  settings: `<div class="panel-body">
      <div class="sec-title">Mods</div>
      <div class="mods-empty">Nenhum mod instalado neste mundo.<br><button class="btnp">Gerenciar mods</button></div>
      <div class="sec-title" style="margin-top:1.2rem">Mundo</div>
      <div class="setting"><span class="name">Rolagens secretas do GM</span><span class="toggle on"></span></div>
      <div class="setting"><span class="name">Iniciativa automática</span><span class="toggle"></span></div>
      <div class="setting"><span class="name">Idioma</span><span style="color:var(--muted)">pt-BR</span></div></div>`,
};
const TITLE = {scenes:'Cenas',combat:'Rastreador de combate',chat:'Chat',actors:'Atores',compendium:'Compêndio',settings:'Configurações & Mods'};

/* ---------- estado ---------- */
const params = new URLSearchParams(location.search);
const VARIANTS = ['A','B','C'];
const NAMES = {A:'Trilho fixo na borda (activity bar)',B:'Dock flutuante + painel-cartão',C:'Abas físicas à esquerda da gaveta (movem juntas)'};
let variant = VARIANTS.includes(params.get('variant')) ? params.get('variant') : 'A';
let active = 'combat', open = true;
const isGm = true;

function tabButton(t){
  const badge = t.badge && (active!==t.id || !open) ? `<span class="badge ${t.badgeCls||''}">${t.badge}</span>` : '';
  return `<button class="tabbtn ${active===t.id&&open?'is-active':''}" data-tab="${t.id}" aria-label="${t.label}">
    ${ICONS[t.id]}${badge}<span class="tip">${t.label}${t.gm?'<span class="gm-tag">GM</span>':''}<span class="kbd">Alt+${t.key}</span></span></button>`;
}
function panel(){
  const gm = TABS.find(t=>t.id===active).gm ? '<span class="gm-tag">GM</span>' : '';
  return `<div class="panel"><div class="panel-head"><span>${TITLE[active]}${gm}</span><button class="close" data-close title="Recolher">✕</button></div>${CONTENT[active]}</div>`;
}
const players = TABS.filter(t=>!t.gm), gms = TABS.filter(t=>t.gm && isGm);

function render(){
  const root = document.getElementById('root');
  let html='';
  if(variant==='A'){
    html = `<div class="A ${open?'is-open':''}"><aside class="sidebar">${panel()}
      <nav class="rail">${players.map(tabButton).join('')}<div class="divider"></div>${gms.filter(t=>t.id!=='settings').map(tabButton).join('')}
      <div class="grow"></div>${gms.filter(t=>t.id==='settings').map(tabButton).join('')}</nav></aside></div>`;
  } else if(variant==='B'){
    html = `<div class="B ${open?'is-open':''}"><aside class="sidebar">${panel()}
      <nav class="dock">${players.map(tabButton).join('')}<div class="sep"></div>${gms.map(tabButton).join('')}</nav></aside></div>`;
  } else {
    html = `<div class="C ${open?'is-open':''}"><aside class="sidebar">
      <nav class="tabs"><button class="tabbtn chev" data-toggle title="${open?'Recolher':'Expandir'}">${open?'›':'‹'}</button>
      ${players.map(tabButton).join('')}
      <div class="grp">${gms.map(tabButton).join('')}</div></nav>${panel()}</aside></div>`;
  }
  root.innerHTML = html;
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const id=b.dataset.tab; if(open&&active===id){open=false;} else {active=id;open=true;} render();});
  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{open=false;render();});
  root.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{open=!open;render();});
  document.getElementById('lbl').innerHTML = `${variant} — ${NAMES[variant]}<small>clique no ícone ativo recolhe · Alt+1..6 troca aba · ← → troca variante</small>`;
  const u=new URL(location); u.searchParams.set('variant',variant); history.replaceState(null,'',u);
}
function cycle(d){variant=VARIANTS[(VARIANTS.indexOf(variant)+d+3)%3];render();}
document.getElementById('prev').onclick=()=>cycle(-1);
document.getElementById('next').onclick=()=>cycle(1);
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable) return;
  if(e.key==='ArrowLeft')cycle(-1); if(e.key==='ArrowRight')cycle(1);
  if(e.altKey&&/^[1-6]$/.test(e.key)){const t=TABS[+e.key-1]; if(t){active=t.id;open=true;render();e.preventDefault();}}
});
render();
</script>
</body>
</html>
