<title>PROTOTYPE — Sidebar rail (3 variantes; C aprovada)</title>
<!--
  PROTOTYPE — throwaway. Pergunta original: "como a barra lateral direita deve ficar
  com botões verticais só-ícone, visíveis mesmo recolhida?"
  Três variantes trocáveis via ?variant=A|B|C e pela barra inferior (← →).

  ATUALIZADO ao estado decidido pela spec 36 (a variante C foi a aprovada), para não
  contradizer as specs vigentes — as três variantes seguem hoje o mesmo conjunto de
  abas e os mesmos gestos:
   · sete abas em três blocos: Chat/Contatos/Combate/Compêndio, grupo GM (NPCs/Cenas)
     e Configurações ancorada no RODAPÉ (DEC-GAV-01 emendada por DEC-GAV-09);
   · recolher = clicar no ícone da aba ativa; sem chevron e sem X (DEC-GAV-03);
   · sem atalhos de teclado (DEC-GAV-05);
   · badge aparece mesmo na aba ativa e aberta (REQ-GAV-021).

  LINGUAGEM VISUAL (22/10/2026): trilho só com ícones SVG (Lucide, mesmo traço do set do
  app), alvos de 44x44, badge sem brilho, tooltip como camada flutuante (visível também no
  foco de teclado), tokens --fusion-* nos dois temas.

  O painel de cada aba é assunto da spec-filha: Configurações → 37 e
  settings-tab.prototype.html; Chat → 38 e chat-tab.prototype.html.
  Não é código de produção; não importar nada daqui sem reescrever.
-->

:root {
  color-scheme: dark;

  /* Surfaces: warm charcoal, three flat steps. */
  --fusion-bg: #141311;
  --fusion-surface: #1c1b18;
  --fusion-surface-alt: #25231f;
  --fusion-input-bg: #11100e;
  --fusion-border: #3b3830;
  --fusion-border-strong: #575245;

  /* Text: off-white, never #fff. Muted and subtle stay AA on every surface. */
  --fusion-text: #ebe5d6;
  --fusion-text-muted: #b8b09e;
  --fusion-text-subtle: #9a927f;

  /* The one accent — brass. Interactive and "selected" only, never decoration. */
  --fusion-accent: #d6a24a;
  --fusion-accent-hover: #e4b765;
  --fusion-accent-dim: rgba(214, 162, 74, 0.16);
  --fusion-on-accent: #1a1408;

  /* Semantic */
  --fusion-success: #7cc395;
  --fusion-warning: #e8925a;
  --fusion-danger: #ec7468;
  --fusion-info: #7fb2dc;
  --fusion-magic: #b9a0ea;

  /* Semantic washes — subtle tinted fills for badges / states */
  --fusion-success-dim: rgba(124, 195, 149, 0.15);
  --fusion-warning-dim: rgba(232, 146, 90, 0.15);
  --fusion-danger-dim: rgba(236, 116, 104, 0.15);
  --fusion-info-dim: rgba(127, 178, 220, 0.15);
  --fusion-magic-dim: rgba(185, 160, 234, 0.15);

  /* Chat system card (A022, spec 38, DEC-ACH-02/03 + REQ-ACH-025): a card's left border is
     this fixed blue regardless of sender, so "this is a system card" reads apart from
     "this is <someone>'s message". Not derived from the accent/semantic tones on purpose —
     those already carry meaning in chat (crit, fumble, blind). */
  --fusion-chat-sys: #6fa6cc;

  /* Focus ring: its own colour, never the accent, so focus never reads as "selected". */
  --fusion-focus: #9ccaff;

  /* Elevation: one soft shadow, for floating windows, popovers and menus only. */
  --fusion-shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.45);
  --fusion-shadow-popover: 0 6px 18px rgba(0, 0, 0, 0.35);

  /* Proficiency (TEML — Destreinado, Treinado, Expert, Mestre, Lendário). */
  --fusion-prof-u: var(--fusion-text-subtle);
  --fusion-prof-t: var(--fusion-info);
  --fusion-prof-e: var(--fusion-success);
  --fusion-prof-m: var(--fusion-accent);
  --fusion-prof-l: var(--fusion-magic);

  --fusion-prof-u-bg: rgba(154, 146, 127, 0.14);
  --fusion-prof-t-bg: var(--fusion-info-dim);
  --fusion-prof-e-bg: var(--fusion-success-dim);
  --fusion-prof-m-bg: var(--fusion-accent-dim);
  --fusion-prof-l-bg: var(--fusion-magic-dim);

  --fusion-prof-u-border: var(--fusion-border);
  --fusion-prof-t-border: rgba(127, 178, 220, 0.45);
  --fusion-prof-e-border: rgba(124, 195, 149, 0.45);
  --fusion-prof-m-border: rgba(214, 162, 74, 0.45);
  --fusion-prof-l-border: rgba(185, 160, 234, 0.45);

  /* Typography. rem sizes (the reader's browser zoom wins); nothing below xs. */
  --fusion-font:
    "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
    sans-serif;
  --fusion-font-mono:
    "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas,
    monospace;
  --fusion-text-xs: 0.8125rem; /* 13px — captions, badges: the floor */
  --fusion-text-sm: 0.875rem; /* 14px — dense lists, secondary text */
  --fusion-text-base: 0.9375rem; /* 15px — body */
  --fusion-text-md: 1rem; /* 16px — reading text (journal, descriptions) */
  --fusion-text-lg: 1.125rem; /* 18px — section titles */
  --fusion-text-xl: 1.375rem; /* 22px — window / sheet titles */
  --fusion-text-2xl: 1.75rem; /* 28px — the big number of a stat or a roll */
  --fusion-leading: 1.5;
  --fusion-leading-tight: 1.25;
  --fusion-tracking: 0.012em;
  --fusion-word-spacing: 0.06em;
  --fusion-weight-regular: 400;
  --fusion-weight-medium: 500;
  --fusion-weight-bold: 700;
  /* Readable line length for prose. */
  --fusion-measure: 68ch;

  /* Spacing (4px grid) */
  --fusion-space-1: 4px;
  --fusion-space-2: 8px;
  --fusion-space-3: 12px;
  --fusion-space-4: 16px;
  --fusion-space-5: 20px;
  --fusion-space-6: 24px;
  --fusion-space-8: 32px;

  /* Radii: small and few. Pills only for counters. */
  --fusion-radius-sm: 3px;
  --fusion-radius: 6px;
  --fusion-radius-lg: 8px;
  --fusion-radius-pill: 999px;

  /* Touch target floor (mouse and finger). */
  --fusion-target: 40px;

  /* Motion */
  --fusion-transition: 150ms ease;

  /* Layout.
     The side drawer is one fixed width for every tab (REQ-GAV-012, DEC-GAV-04):
     300px of panel plus a 44px rail, and no user resize — a tab that needs more
     room opens a floating window instead of stretching the drawer. */
  --fusion-sidebar-width: 300px;
  --fusion-sidebar-rail-width: 44px;
  --fusion-header-height: 48px;

  /* Layer scale (spec 11 REQ-UIF-008; spec 53 §2.7 — BAR-F1-03).
     The z-index of the shell's layers, declared in one place so nobody hard-codes a number:

       canvas
       < scene notice               60  literal in ScenePrepareNotice.svelte
       < action bar                 70  --fusion-z-actionbar
       < side drawer                90  literal in Sidebar.svelte
       < header                    100  literal in TableScreen.svelte
       < floating windows         101+  counted up by the window manager, inside the host
       < window host               200  --fusion-z-windows
       < tooltip, popover          400  --fusion-z-tooltip
       < context menu              410  --fusion-z-menu

     Tooltip, popover and menu are portaled to <body> (lib/ui/floatingLayer.ts), so these
     numbers are compared with the window host's own: the host is a stacking context at
     200, and a layer rendered *inside* a window could never rise above it.
     They also clear the in-page modals that still use literals (token dialogs 200/201, file
     picker 300/301), so a tooltip or menu opened from inside one stays visible. REQ-UIF-008
     wants modals above menus and tooltips; that is for the day modals get tokens of their own
     (above 410) — a native <dialog> is already above everything, in the top layer. */
  --fusion-z-actionbar: 70;
  --fusion-z-windows: 200;
  --fusion-z-tooltip: 400;
  --fusion-z-menu: 410;

  /* Combat turn head (spec 40, DEC-CBA-02 / REQ-CBA-021).
     The head of the turn is one fixed height for every participant — a new condition, a
     long name or a health bar must never move the advance control, which is anchored to
     the footer strip below (RNF-CBA-03). Mirrored in TS by TURN_HEAD_HEIGHT_REM /
     TURN_HEAD_FOOTER_HEIGHT_REM in lib/combat/turnHead.svelte.ts. */
  --fusion-combat-turn-head-height: 6.5rem;
  --fusion-combat-turn-head-footer-height: 2.25rem;

  /* Condition tone (DEC-CTT-11, REQ-SYS-043 / REQ-CTT-031).
     The colour of a condition chip says what the condition does to whoever carries it,
     never how grave it is: green helps, red hinders, purple is a situation (detection,
     attitude, control). Aliases rather than raw colours so the combat tab (REQ-CBA-050)
     and the contacts tab paint the same three tones. The `-dim` fills are the emphasis of
     a critical condition (REQ-CTT-032) — emphasis on the tone it already has, never a
     fourth colour. */
  --fusion-condition-benefit: var(--fusion-success);
  --fusion-condition-harm: var(--fusion-danger);
  --fusion-condition-special: var(--fusion-magic);
  --fusion-condition-benefit-dim: var(--fusion-success-dim);
  --fusion-condition-harm-dim: var(--fusion-danger-dim);
  --fusion-condition-special-dim: var(--fusion-magic-dim);

  /* The "no ar" head of the Cenas tab is one fixed height for every state
     (REQ-CEN-010/013): a long scene name, a missing background image or the
     environment row must never move the controls the GM presses all session. */
  --fusion-scene-head-height: 132px;

  /* Aliases for components written against names nobody had declared (they silently fell
     back to hard-coded colours and ignored the theme). New code uses the names above. */
  --fusion-radius-md: var(--fusion-radius);
  --fusion-surface-raised: var(--fusion-surface-alt);
  --fusion-text-on-accent: var(--fusion-on-accent);
  --fusion-accent-contrast: var(--fusion-on-accent);
  --fusion-accent-soft: var(--fusion-accent-dim);
  --fusion-warn: var(--fusion-warning);
  --fusion-color-accent: var(--fusion-accent);
  --fusion-color-accent-hover: var(--fusion-accent-hover);
  --fusion-color-on-accent: var(--fusion-on-accent);
  --fusion-color-border: var(--fusion-border);
  --fusion-color-focus: var(--fusion-focus);
  --fusion-color-hero: var(--fusion-accent);
  --fusion-color-info: var(--fusion-info);
  --fusion-color-magic: var(--fusion-magic);
  --fusion-color-success: var(--fusion-success);
  --fusion-color-warning: var(--fusion-warning);
  --fusion-color-input-bg: var(--fusion-input-bg);
  --fusion-color-surface: var(--fusion-surface);
  --fusion-color-surface-raised: var(--fusion-surface-alt);
  --fusion-color-text: var(--fusion-text);
  --fusion-color-text-primary: var(--fusion-text);
  --fusion-color-text-secondary: var(--fusion-text-muted);
  --fusion-color-text-muted: var(--fusion-text-muted);
  --fusion-color-text-subtle: var(--fusion-text-subtle);
}

  .A .panel{width:var(--panel-w);background:var(--fusion-surface);border-left:1px solid var(--fusion-border);display:none;flex-direction:column}
  .A.is-open .panel{display:flex}

  /* ========== VARIANTE B — Dock flutuante + painel (camadas flutuantes) ========== */
  .B .sidebar{position:absolute;top:var(--fusion-header-height);right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:var(--fusion-space-3);z-index:90;pointer-events:none}
  .B .sidebar>*{pointer-events:auto}
  .B .dock{display:flex;flex-direction:column;gap:2px;background:var(--fusion-surface-alt);border:1px solid var(--fusion-border-strong);border-radius:var(--fusion-radius-lg);padding:6px 4px;box-shadow:var(--fusion-shadow-popover)}
  .B .dock .tabbtn{width:44px;height:44px;border-radius:var(--fusion-radius)}
  .B .dock .tabbtn.is-active{background:var(--fusion-accent);color:var(--fusion-on-accent)}
  .B .dock .sep{height:1px;background:var(--fusion-border);margin:4px 8px}
  .B .panel{width:var(--panel-w);max-height:min(78vh,720px);align-self:center;background:var(--fusion-surface);border:1px solid var(--fusion-border-strong);border-radius:var(--fusion-radius-lg);display:none;flex-direction:column;box-shadow:var(--fusion-shadow-modal);overflow:hidden}
  .B.is-open .panel{display:flex}
  .B .panel-head{background:var(--fusion-surface-alt)}

  /* ========== VARIANTE C — Abas físicas grudadas ao painel (gaveta) ========== */
  .C .sidebar{position:absolute;top:var(--fusion-header-height);right:0;bottom:0;display:flex;z-index:90}
  .C .tabs{width:var(--rail-w);display:flex;flex-direction:column;padding-top:10px;gap:3px;align-items:flex-end}
  .C .tabs .tabbtn{width:var(--rail-w);height:44px;border:1px solid var(--fusion-border);border-right:0;border-radius:var(--fusion-radius) 0 0 var(--fusion-radius);background:var(--fusion-surface-alt);color:var(--fusion-text-muted)}
  .C .tabs .tabbtn:hover{color:var(--fusion-text)}
  .C .tabs .tabbtn.is-active{background:var(--fusion-surface);color:var(--fusion-accent);border-color:var(--fusion-accent);z-index:2;font-size:22px}
  .C.is-open .tabs .tabbtn.is-active{margin-right:-1px;width:calc(var(--rail-w) + 1px);border-right:1px solid var(--fusion-surface)}
  .C .tabs .grp{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .C .tabs .grp.gm{margin-top:14px;position:relative}
  .C .tabs .grp.gm::before{content:"";position:absolute;top:-8px;right:6px;width:28px;height:1px;background:var(--fusion-border)}
  .C .tabs .grp.gm .tabbtn{border-color:var(--fusion-danger-dim)}
  .C .tabs .grp.gm .tabbtn.is-active{border-color:var(--fusion-accent)}
  .C .tabs .foot{margin-top:auto;margin-bottom:10px;position:relative;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .C .tabs .foot::before{content:"";position:absolute;top:-8px;right:6px;width:28px;height:1px;background:var(--fusion-border)}
  .C .panel{width:var(--panel-w);background:var(--fusion-surface);border-left:1px solid var(--fusion-accent);display:none;flex-direction:column}
  .C.is-open .panel{display:flex}
  .C .panel .panel-head{border-bottom-color:var(--fusion-accent-dim)}

  /* ---------- Switcher (não faz parte do design) ---------- */
  .switcher{position:fixed;left:50%;bottom:var(--fusion-space-4);transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:var(--fusion-space-2);background:var(--fusion-surface-alt);color:var(--fusion-text);border:1px solid var(--fusion-border-strong);border-radius:var(--fusion-radius-lg);padding:var(--fusion-space-1) var(--fusion-space-2);box-shadow:var(--fusion-shadow-popover);font-size:var(--fusion-text-sm);font-weight:var(--fusion-weight-bold)}
  .switcher button{display:grid;place-items:center;border:1px solid var(--fusion-border);background:var(--fusion-surface);color:var(--fusion-text);min-width:var(--fusion-target);min-height:var(--fusion-target);border-radius:var(--fusion-radius);cursor:pointer;font-size:20px;padding:0}
  .switcher .lbl{min-width:260px;text-align:center}
  .switcher .lbl small{display:block;font-weight:var(--fusion-weight-regular);color:var(--fusion-text-muted);font-size:var(--fusion-text-xs)}
</style>
</head>

<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Alternar tema">Tema: escuro</button>
<script>
  (function () {
    var b = document.getElementById("theme-toggle");
    function paint() { b.textContent = "Tema: " + (document.documentElement.dataset.theme === "light" ? "claro" : "escuro"); }
    b.addEventListener("click", function () {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      paint();
    });
    paint();
  })();
</script>

<div class="header">
  <span class="bolt"><svg class="svg-i" aria-hidden="true"><use href="#i-zap"/></svg></span><span class="world">teste_xande</span><span class="pill"><svg class="svg-i" aria-hidden="true"><use href="#i-map"/></svg>aha</span>
  <span class="spacer"></span>
  <span class="status"><span class="dot"></span>Conectado <span>2ms</span></span>
  <span class="gm"><span class="dot"></span>Gamemaster · <span class="role">Mestre</span></span>
  <button class="btn">Sair</button>
</div>
<div class="stage"><div class="art"><div class="house"><div class="star"><svg class="svg-i" aria-hidden="true"><use href="#i-star"/></svg></div></div></div></div>

<div id="root"></div>

<div class="switcher" id="switcher">
  <button id="prev" title="Variante anterior (seta esquerda)" aria-label="Variante anterior"><svg class="svg-i" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
  <span class="lbl" id="lbl"></span>
  <button id="next" title="Próxima variante (seta direita)" aria-label="Próxima variante"><svg class="svg-i" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
</div>

<script>
/* ---------- dados mock ---------- */
const ic = (n) => `<svg class="svg-i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const ICONS = {
  scenes:     ic('image'),
  combat:     ic('swords'),
  chat:       ic('message-square'),
  actors:     ic('users'),
  compendium: ic('library'),
  npcs:       ic('ghost'),
  settings:   ic('settings'),
};
const TABS = [
  {id:'chat',      label:'Chat',          badge:'3'},
  {id:'actors',    label:'Contatos'},
  {id:'combat',    label:'Combate',       badge:ic('swords'), badgeCls:'combat', badgeLabel:'combate em andamento'},
  {id:'compendium',label:'Compêndio'},
  {id:'npcs',      label:'NPCs',          gm:true},
  {id:'scenes',    label:'Cenas',         gm:true},
  {id:'settings',  label:'Configurações', foot:true},   /* DEC-GAV-09: grupo "all", no rodapé */
];
const act = (icon, label, cls='') => `<button class="iconbtn ${cls}" title="${label}" aria-label="${label}">${ic(icon)}</button>`;
const sceneActs = `<span class="row-actions">${act('play','Ativar cena')}${act('square-pen','Editar cena')}${act('trash','Apagar cena','danger')}</span>`;
const CONTENT = {
  scenes: `<div class="panel-body">
      <div class="row"><span class="st-on"></span><span class="name">Fortaleza (mapa)</span><span class="sub">ativa</span></div>
      <div class="row"><span class="st-off"></span><span class="name">Sala do trono</span>${sceneActs}</div>
      <div class="row"><span class="st-off"></span><span class="name">Caverna dos goblins</span>${sceneActs}</div>
      <div class="actions"><button class="btnp">Nova cena</button></div></div>`,
  combat: `<div class="panel-body"><p class="empty">Nenhum combate ativo.</p>
      <div class="actions"><button class="btnp">Criar combate</button><button class="btns">Adicionar tokens</button></div></div>`,
  chat: `<div class="panel-body">
      <div class="msg"><b>Gamemaster</b> · <span class="time">21:04</span><br>Vocês entram na sala do trono…</div>
      <div class="msg"><b>Fofurinha</b> · <span class="time">21:05</span><br>Rolo Percepção — <b>1d20+7 = 19</b></div>
      <div class="msg"><b>Tobias</b> · <span class="time">21:05</span><br>eu saco a espada</div>
      <div class="field">Digite uma mensagem ou /r 1d20…</div></div>`,
  actors: `<div class="panel-body">
      <div class="row"><span class="lead">${ic('user')}</span><span class="name">Fofurinha</span><span class="sub">Druida 5</span></div>
      <div class="row"><span class="lead">${ic('user')}</span><span class="name">Tobias</span><span class="sub">Guerreiro 5</span></div></div>`,
  npcs: `<div class="panel-body">
      <div class="row"><span class="lead">${ic('skull')}</span><span class="name">Goblin Guerreiro</span><span class="sub">NPC</span></div>
      <div class="row"><span class="lead">${ic('paw-print')}</span><span class="name">Lobo atroz</span><span class="sub">NPC</span></div>
      <div class="actions"><button class="btnp">Novo NPC</button><button class="btns">Importar</button></div></div>`,
  compendium: `<div class="panel-body">
      <div class="field top">${ic('search')}<span>Buscar no compêndio…</span></div>
      <div class="row"><span class="name">Talentos</span><span class="sub">1.812</span></div>
      <div class="row"><span class="name">Magias</span><span class="sub">1.024</span></div>
      <div class="row"><span class="name">Equipamentos</span><span class="sub">2.310</span></div>
      <div class="row"><span class="name">Bestiário</span><span class="sub">492</span></div></div>`,
  /* conteúdo real da aba: spec 37 + settings-tab.prototype.html (índice e seção) */
  settings: `<div class="panel-body">
      <div class="row"><span class="name">Minhas preferências</span><span class="go">${ic('chevron-right')}</span></div>
      <div class="row"><span class="name">Mundo</span><span class="go">${ic('chevron-right')}</span></div>
      <div class="row"><span class="name">Permissões</span><span class="go">${ic('chevron-right')}</span></div>
      <div class="row"><span class="name">Usuários</span><span class="go">${ic('chevron-right')}</span></div>
      <div class="row"><span class="name">Mods</span><span class="go">${ic('chevron-right')}</span></div></div>`,
};
const TITLE = {scenes:'Cenas',combat:'Rastreador de combate',chat:'Chat',actors:'Contatos',npcs:'NPCs',compendium:'Compêndio',settings:'Configurações'};

/* ---------- estado ---------- */
const params = new URLSearchParams(location.search);
const VARIANTS = ['A','B','C'];
const NAMES = {A:'Trilho fixo na borda (activity bar)',B:'Dock flutuante + painel',C:'Abas físicas à esquerda da gaveta (movem juntas)'};
let variant = VARIANTS.includes(params.get('variant')) ? params.get('variant') : 'A';
let active = 'combat', open = true;
const isGm = true;

function tabButton(t){
  /* REQ-GAV-021: o badge aparece sempre que existir — inclusive na aba ativa e aberta */
  const badge = t.badge ? `<span class="badge ${t.badgeCls||''}" ${t.badgeLabel?`role="img" aria-label="${t.badgeLabel}"`:''}>${t.badge}</span>` : '';
  return `<button class="tabbtn ${active===t.id&&open?'is-active':''}" data-tab="${t.id}" aria-label="${t.label}" title="${t.label}">
    ${ICONS[t.id]}${badge}<span class="tip" aria-hidden="true">${t.label}${t.gm?'<span class="gm-tag">GM</span>':''}</span></button>`;
}
function panel(){
  const gm = TABS.find(t=>t.id===active).gm ? '<span class="gm-tag">GM</span>' : '';
  /* DEC-GAV-03: sem X — recolher é clicar no ícone da aba ativa */
  return `<div class="panel"><div class="panel-head"><span>${TITLE[active]}${gm}</span></div>${CONTENT[active]}</div>`;
}
const players = TABS.filter(t=>!t.gm && !t.foot),
      gms     = TABS.filter(t=>t.gm && isGm),
      foot    = TABS.filter(t=>t.foot);

function render(){
  const root = document.getElementById('root');
  let html='';
  if(variant==='A'){
    html = `<div class="A ${open?'is-open':''}"><aside class="sidebar">${panel()}
      <nav class="rail">${players.map(tabButton).join('')}<div class="divider"></div>${gms.map(tabButton).join('')}
      <div class="grow"></div><div class="divider"></div>${foot.map(tabButton).join('')}</nav></aside></div>`;
  } else if(variant==='B'){
    html = `<div class="B ${open?'is-open':''}"><aside class="sidebar">${panel()}
      <nav class="dock">${players.map(tabButton).join('')}<div class="sep"></div>${gms.map(tabButton).join('')}<div class="sep"></div>${foot.map(tabButton).join('')}</nav></aside></div>`;
  } else {
    html = `<div class="C ${open?'is-open':''}"><aside class="sidebar">
      <nav class="tabs"><div class="grp">${players.map(tabButton).join('')}</div>
      <div class="grp gm">${gms.map(tabButton).join('')}</div>
      <div class="foot">${foot.map(tabButton).join('')}</div></nav>${panel()}</aside></div>`;
  }
  root.innerHTML = html;
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const id=b.dataset.tab; if(open&&active===id){open=false;} else {active=id;open=true;} render(); const nb=root.querySelector('[data-tab="'+id+'"]'); if(nb) nb.focus();});
  document.getElementById('lbl').innerHTML = `${variant} — ${NAMES[variant]}<small>clique no ícone ativo recolhe (único gesto) · setas esquerda e direita trocam a variante</small>`;
  const u=new URL(location); u.searchParams.set('variant',variant); history.replaceState(null,'',u);
}
function cycle(d){variant=VARIANTS[(VARIANTS.indexOf(variant)+d+3)%3];render();}
document.getElementById('prev').onclick=()=>cycle(-1);
document.getElementById('next').onclick=()=>cycle(1);
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable) return;
  if(e.key==='ArrowLeft')cycle(-1); if(e.key==='ArrowRight')cycle(1);
  /* DEC-GAV-05: sem atalhos de aba — o Alt+N do protótipo original ficou de fora */
});
render();
</script>
</body>
</html>
