<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>PROTOTYPE — Aba Configurações (versão final da spec 37)</title>
<!--
  PROTOTYPE — throwaway. Estado FINAL da aba Configurações depois do grill de
  2026-08-15. Não é mais um comparador de variantes: é a tela decidida, para
  validação. A spec correspondente é specs/37-configuracoes.md.

  CHASSI (spec 36): variante C aprovada — abas físicas à esquerda da gaveta,
  movendo junto; sem chevron e sem ✕ (recolher = clicar no ícone ativo,
  DEC-GAV-03); sem atalhos (DEC-GAV-05); 300px + 44px (DEC-GAV-04).
  Configurações no grupo "all", ancorada no RODAPÉ do trilho (DEC-GAV-09).

  A ABA (spec 37):
   · índice → seção, com "‹" para voltar, SEM ícones (DEC-CFG-04);
   · nada abre janela flutuante; tudo em uma coluna (REQ-CFG-013);
   · jogador vê UMA entrada: Minhas preferências (DEC-CFG-05);
   · Minhas preferências é 100% local, sem idioma e sem tema (DEC-CFG-06);
   · Mundo renderiza só o que o sistema declarou (DEC-CFG-07) — troque o sistema
     no rodapé para ver o estado vazio;
   · arquétipo livre e multiclasse por nível são settings de MUNDO (DEC-CFG-08),
     e desligar pede confirmação com a contagem (DEC-CFG-09);
   · permissões: uma linha por permissão, nunca matriz (REQ-CFG-040);
   · Mods só para o GM, e existe mesmo vazia (DEC-CFG-01/REQ-CFG-060);
   · nenhum papel "Assistente" — extinto pela issue #133.

  Não é código de produção; não importar nada daqui sem reescrever.
-->
<style>
  :root{
    --bg:#0e0e12;--surface:#18181f;--surface-alt:#1f1f2a;--border:#2e2e3d;
    --text:#e8e8f0;--muted:#8888a0;--subtle:#55556a;
    --accent:#7c5cfc;--accent-hover:#9b7ffe;--accent-dim:rgba(124,92,252,.15);
    --danger:#ff5c5c;--warn:#e5b83b;--ok:#3ddc84;
    --radius-sm:4px;--radius:8px;--radius-lg:12px;
    --font:system-ui,-apple-system,"Segoe UI",sans-serif;
    --header:48px;--panel-w:300px;--rail-w:44px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden}

  /* ---------- App shell (mock) ---------- */
  .header{height:var(--header);display:flex;align-items:center;gap:.75rem;padding:0 .75rem;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:200}
  .header .bolt{color:#f5a623}
  .header .world{font-weight:600}
  .header .pill{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent-hover);border-radius:var(--radius-sm);padding:.15rem .5rem;font-size:.8rem;font-weight:600}
  .header .spacer{flex:1}
  .header .status{color:var(--muted);font-size:.8rem;display:flex;align-items:center;gap:.35rem}
  .header .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .header .who{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.15rem .5rem;font-size:.8rem}
  .header .who b{color:var(--danger)}
  .header .who.player b{color:var(--ok)}
  .header .btn{background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:.2rem .6rem;font:inherit;font-size:.8rem}
  .stage{position:absolute;top:var(--header);left:0;right:0;bottom:0;background:#0b0b0f;display:grid;place-items:center}
  .stage .art{width:44vh;height:44vh;border-radius:6px;background:radial-gradient(circle at 50% 45%,#2f6bd6 0%,#1a3f8f 55%,#132c68 100%);display:grid;place-items:center;box-shadow:0 0 0 1px #21407f}
  .stage .art .house{width:60%;height:60%;background:#fff;clip-path:polygon(50% 0,100% 40%,88% 40%,88% 100%,12% 100%,12% 40%,0 40%);display:grid;place-items:center}
  .stage .art .star{font-size:9vh;color:#e5b83b;margin-top:22%}

  /* ---------- Chassi C (spec 36) ---------- */
  .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
  .tabbtn{position:relative;display:grid;place-items:center;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;transition:color .12s,background .12s}
  .tabbtn:hover{color:var(--text)}
  .tabbtn .badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center;line-height:1}
  .tabbtn .badge.combat{background:rgba(255,215,0,.18);border:1px solid #ffd700;color:#ffd700;font-size:.6rem}
  .tabbtn .tip{position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#0b0b0f;border:1px solid var(--border);color:var(--text);padding:.25rem .5rem;border-radius:var(--radius-sm);font-size:.75rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:5}
  .tabbtn:hover .tip{opacity:1}
  .sidebar{position:absolute;top:var(--header);right:0;bottom:0;display:flex;z-index:90}
  .tabs{width:var(--rail-w);display:flex;flex-direction:column;padding:10px 0;gap:3px;align-items:flex-end}
  .tabs .tabbtn{width:40px;height:44px;border:1px solid var(--border);border-right:0;border-radius:var(--radius) 0 0 var(--radius);background:var(--surface-alt);color:var(--muted)}
  .tabs .tabbtn.is-active{background:var(--surface);color:var(--accent-hover);width:44px;border-color:var(--accent);z-index:2}
  .is-open .tabs .tabbtn.is-active{box-shadow:1px 0 0 0 var(--surface)}
  .tabs .tabbtn.is-active .icon{width:22px;height:22px}
  .tabs .grp{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .tabs .grp.gm{margin-top:14px;position:relative}
  .tabs .grp.gm::before{content:"";position:absolute;top:-8px;right:6px;width:28px;height:1px;background:var(--border)}
  .tabs .grp.gm .tabbtn{border-color:rgba(255,92,92,.35)}
  .tabs .foot{margin-top:auto;position:relative;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .tabs .foot::before{content:"";position:absolute;top:-8px;right:6px;width:28px;height:1px;background:var(--border)}
  .panel{width:var(--panel-w);background:var(--surface);border-left:1px solid var(--accent);display:none;flex-direction:column}
  .is-open .panel{display:flex}
  .panel-head{display:flex;align-items:center;gap:.4rem;padding:.6rem .8rem;border-bottom:1px solid var(--accent-dim);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .panel-head .back{background:none;border:0;color:var(--accent-hover);cursor:pointer;font-size:1.05rem;line-height:1;padding:0 .15rem 0 0}
  .panel-body{flex:1;overflow:auto;padding:.75rem .8rem;color:var(--muted);font-size:.85rem}
  .panel-body::-webkit-scrollbar{width:8px}
  .panel-body::-webkit-scrollbar-thumb{background:var(--surface-alt);border-radius:99px}

  /* ---------- Conteúdo mock das outras abas ---------- */
  .row{display:flex;align-items:center;gap:.5rem;padding:.4rem .5rem;border-radius:var(--radius-sm)}
  .row:hover{background:var(--surface-alt)}
  .row .name{color:var(--text)}
  .row .sub{color:var(--subtle);font-size:.75rem;margin-left:auto}
  .empty{text-align:center;padding:1.5rem 0 .75rem;color:var(--muted)}
  .msg{padding:.4rem .5rem;border-left:2px solid var(--border);margin-bottom:.5rem}
  .msg b{color:var(--text)}
  .btnp{background:var(--accent);color:#fff;border:0;border-radius:var(--radius-sm);padding:.35rem .7rem;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
  .btns{background:var(--surface-alt);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.35rem .7rem;font:inherit;font-size:.8rem;cursor:pointer}
  .btnd{background:var(--danger);color:#fff;border:0;border-radius:var(--radius-sm);padding:.35rem .7rem;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
  .btnp[disabled]{opacity:.45;cursor:not-allowed}
  .actions{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}

  /* ---------- Índice (REQ-CFG-003/004: sem ícones) ---------- */
  .idx{display:flex;align-items:center;gap:.6rem;width:100%;background:none;border:0;border-bottom:1px solid rgba(46,46,61,.55);color:var(--text);font:inherit;padding:.65rem .1rem;cursor:pointer;text-align:left}
  .idx:hover{background:var(--surface-alt)}
  .idx .txt{flex:1}
  .idx .txt small{display:block;color:var(--subtle);font-size:.72rem;font-weight:400;margin-top:.15rem;line-height:1.35}
  .idx .go{color:var(--subtle)}

  /* ---------- Controles ---------- */
  .sec-hint{color:var(--subtle);font-size:.75rem;line-height:1.45;margin:0 0 .7rem}
  .set{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid rgba(46,46,61,.55)}
  .set:last-child{border-bottom:0}
  .set .lbl{color:var(--text);flex:1;min-width:0}
  .set .lbl small{display:block;color:var(--subtle);font-size:.72rem;font-weight:400;margin-top:.1rem;line-height:1.35}
  .set .ctl{flex:0 0 auto;display:flex;align-items:center;gap:.35rem}
  .toggle{width:32px;height:18px;border-radius:999px;background:var(--border);position:relative;border:0;cursor:pointer;padding:0;flex:0 0 auto}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:left .12s}
  .toggle.on{background:var(--accent)}.toggle.on::after{left:16px;background:#fff}
  select{background:var(--surface-alt);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:.25rem .4rem;font:inherit;font-size:.8rem}
  input[type=range]{width:104px;accent-color:var(--accent)}
  .chip{font-size:.6rem;letter-spacing:.04em;border-radius:3px;padding:.05rem .3rem;border:1px solid;white-space:nowrap;margin-left:.3rem}
  .chip.sys{color:#5cc8ff;border-color:#2f7fa8}
  .chip.mod{color:var(--accent-hover);border-color:var(--accent)}
  .vazio{border:1px dashed var(--border);border-radius:var(--radius);padding:1rem .9rem;text-align:center;color:var(--subtle);font-size:.8rem;line-height:1.5}
  .vazio .btnp{margin-top:.7rem}

  /* confirmação inline — nunca janela (REQ-CFG-013) */
  .confirm{border:1px solid var(--danger);border-radius:var(--radius);padding:.6rem;margin:.5rem 0;background:rgba(255,92,92,.07);color:var(--text);font-size:.8rem;line-height:1.45}
  .confirm .acts{display:flex;gap:.4rem;margin-top:.6rem}

  /* usuários */
  .user{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid rgba(46,46,61,.55)}
  .user:last-child{border-bottom:0}
  .ava{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#0b0b0f;flex:0 0 auto}
  .user .info{flex:1;min-width:0}
  .user .info b{color:var(--text);font-weight:600;display:block;font-size:.85rem}
  .user .info span{color:var(--subtle);font-size:.72rem}
  .user .on{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:.25rem}
  .user .off{width:7px;height:7px;border-radius:50%;background:var(--subtle);display:inline-block;margin-right:.25rem}
  .user .acts{display:flex;gap:.1rem}
  .iconbtn{background:none;border:0;color:var(--subtle);cursor:pointer;font-size:.85rem;padding:.15rem .2rem;border-radius:var(--radius-sm)}
  .iconbtn:hover{color:var(--text);background:var(--surface-alt)}
  .mod{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid rgba(46,46,61,.55)}
  .mod:last-child{border-bottom:0}
  .mod .info{flex:1;min-width:0}
  .mod .info b{color:var(--text);font-weight:600;display:block;font-size:.85rem}
  .mod .info span{color:var(--subtle);font-size:.72rem}

  /* ---------- Switcher (não faz parte do design) ---------- */
  .switcher{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:.4rem;background:#fff;color:#111;border-radius:999px;padding:.35rem .5rem;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:.8rem;font-weight:600}
  .switcher button{border:0;background:#111;color:#fff;height:28px;padding:0 .7rem;border-radius:999px;cursor:pointer;font-size:.76rem;font-weight:600}
  .switcher .lbl{padding:0 .5rem;color:#555;font-weight:400;font-size:.72rem;max-width:230px}
</style>
</head>
<body>

<div class="header">
  <span class="bolt">⚡</span><span class="world">teste_xande</span><span class="pill">🗺 aha</span>
  <span class="spacer"></span>
  <span class="status"><span class="dot"></span>Conectado <sup>2ms</sup></span>
  <span class="who" id="who"></span>
  <button class="btn">Sair</button>
</div>
<div class="stage"><div class="art"><div class="house"><div class="star">★</div></div></div></div>

<div id="root"></div>

<div class="switcher">
  <button id="role">papel</button>
  <button id="sys">sistema</button>
  <button id="mods">mods</button>
  <span class="lbl" id="lbl"></span>
</div>

<script>
/* ================= chassi ================= */
const ICONS = {
  chat:      '<svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  contacts:  '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  combat:    '<svg class="icon" viewBox="0 0 24 24"><path d="M4 4l11 11M20 4L9 15"/><path d="M14 16l2 2M10 16l-2 2M17 13l3 3-2 2-3-3M7 13l-3 3 2 2 3-3"/></svg>',
  compendium:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>',
  npcs:      '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7z"/><circle cx="12" cy="11" r="2.2"/></svg>',
  scenes:    '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>',
  settings:  '<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>',
};
const TABS = [
  {id:'chat',      label:'Chat',          group:'all', badge:'3'},
  {id:'contacts',  label:'Contatos',      group:'all'},
  {id:'combat',    label:'Combate',       group:'all', badge:'⚔', badgeCls:'combat'},
  {id:'compendium',label:'Compêndio',     group:'all'},
  {id:'npcs',      label:'NPCs',          group:'gm'},
  {id:'scenes',    label:'Cenas',         group:'gm'},
  {id:'settings',  label:'Configurações', group:'all', foot:true},   /* DEC-GAV-09 */
];
const TITLE = {chat:'Chat',contacts:'Contatos',combat:'Combate',compendium:'Compêndio',npcs:'NPCs',scenes:'Cenas',settings:'Configurações'};
const OTHER = {
  chat: `<div class="msg"><b>Gamemaster</b> · <span style="font-size:.75rem">21:04</span><br>Vocês entram na sala do trono…</div>
    <div class="msg"><b>Fofurinha</b> · <span style="font-size:.75rem">21:05</span><br>Rolo Percepção — <b>1d20+7 = 19</b></div>`,
  contacts: `<div class="row"><span>🧝</span><span class="name">Fofurinha</span><span class="sub">Druida 5</span></div>
    <div class="row"><span>🧔</span><span class="name">Tobias</span><span class="sub">Guerreiro 5</span></div>`,
  combat: `<p class="empty">Nenhum combate ativo.</p><div class="actions"><button class="btnp">Criar combate</button></div>`,
  compendium: `<div class="row"><span class="name">Talentos</span><span class="sub">1.812</span></div>
    <div class="row"><span class="name">Magias</span><span class="sub">1.024</span></div>`,
  npcs: `<div class="row"><span>👹</span><span class="name">Goblin Guerreiro</span><span class="sub">NPC</span></div>`,
  scenes: `<div class="row"><span style="color:var(--ok)">●</span><span class="name">Fortaleza</span><span class="sub">ativa</span></div>`,
};

/* ================= estado mock ================= */
const params = new URLSearchParams(location.search);
let role   = params.get('role')==='player' ? 'player' : 'gm';
let system = params.get('sys')==='etmos' ? 'etmos' : 'pf2e';
let modsOn = params.get('mods')==='1';
let active='settings', open=true, sec=null, confirming=null;

/* settings de mundo DECLARADAS pelo sistema (REQ-SYS-047) — a aba não as conhece */
const DECLARED = {
  pf2e:[
    {key:'pf2e.variantRules.freeArchetype', label:'Arquétipo livre', hint:'Um talento de arquétipo extra em todo nível par', on:true,  affected:3},
    {key:'pf2e.variantRules.classLevels',   label:'Multiclasse por nível', hint:'Divide os níveis entre classes, sem dedicação', on:false, affected:1},
  ],
  etmos:[],
};
const PERMS = [
  {n:'Criar tokens',            r:'Jogador'},
  {n:'Usar a régua',            r:'Jogador'},
  {n:'Enviar arquivo',          r:'Mestre'},
  {n:'Criar macros',            r:'Jogador'},
  {n:'Ver nome de todo token',  r:'Mestre'},
];
const USERS = [
  {n:'Gamemaster', r:'Mestre',  c:'#ff5c5c', on:true,  me:true},
  {n:'Fofurinha',  r:'Jogador', c:'#7c5cfc', on:true},
  {n:'Tobias',     r:'Jogador', c:'#3ddc84', on:false},
];
const MODS = [
  {name:'Canvas de mesa',     desc:'Tokens, grid, régua, ping', on:true,  v:'1.0'},
  {name:'Visão e iluminação', desc:'Paredes, fog, luzes',       on:true,  v:'1.0'},
  {name:'Minimapa tático',    desc:'Miniatura da cena ativa',   on:false, v:'0.3'},
  {name:'Mapa de região',     desc:'Mapa do mundo com pinos',   on:true,  v:'0.6'},
];

/* ================= seções ================= */
function secPrefs(){
  const mod = modsOn ? `<div class="set"><span class="lbl">Zoom com a roda do mouse<span class="chip mod">mod Canvas</span><small>Some quando o mod é desligado</small></span><span class="ctl"><button class="toggle on"></button></span></div>` : '';
  return `<p class="sec-hint">Ficam só neste aparelho — nada é enviado ao servidor.</p>
  <div class="set"><span class="lbl">Música<small>canal <code>music</code></small></span><span class="ctl"><input type="range" value="45"></span></div>
  <div class="set"><span class="lbl">Ambiente<small>canal <code>environment</code></small></span><span class="ctl"><input type="range" value="60"></span></div>
  <div class="set"><span class="lbl">Interface<small>canal <code>interface</code> — rolagens, chat</small></span><span class="ctl"><input type="range" value="80"></span></div>
  <div class="set"><span class="lbl">Som ao receber mensagem</span><span class="ctl"><button class="toggle on"></button></span></div>
  <div class="set"><span class="lbl">Avisar quando for meu turno</span><span class="ctl"><button class="toggle on"></button></span></div>
  ${mod}`;
}
function secWorld(){
  const list = DECLARED[system];
  if(!list.length){
    return `<div class="vazio">O sistema ativo (<b>${system==='etmos'?'Etmos':'PF2e'}</b>) não tem regras configuráveis.</div>`;
  }
  return `<p class="sec-hint">Valem para todos nesta mesa. Vêm declaradas pelo sistema — a aba não conhece nenhuma delas.</p>
  ${list.map((s,i)=>{
    const conf = confirming===i ? `<div class="confirm"><b>${s.affected} personagem${s.affected>1?'s têm':' tem'} escolhas que dependem de "${s.label}".</b><br>Desligar deixa essas escolhas ilegítimas até alguém refazer a build.<div class="acts"><button class="btnd" data-confirm="${i}">Desligar mesmo assim</button><button class="btns" data-cancel="1">Cancelar</button></div></div>` : '';
    return `<div class="set"><span class="lbl">${s.label}<span class="chip sys">PF2e</span><small>${s.hint}</small></span>
      <span class="ctl"><button class="toggle ${s.on?'on':''}" data-world="${i}"></button></span></div>${conf}`;
  }).join('')}`;
}
function secPerms(){
  return `<p class="sec-hint">Papel mínimo para cada ação. Uma linha por permissão — nunca uma matriz.</p>
  ${PERMS.map(p=>`<div class="set"><span class="lbl">${p.n}</span><span class="ctl"><select><option ${p.r==='Jogador'?'selected':''}>Jogador</option><option ${p.r==='Mestre'?'selected':''}>Mestre</option></select></span></div>`).join('')}`;
}
function secUsers(){
  return `${USERS.map(u=>`<div class="user"><span class="ava" style="background:${u.c}">${u.n[0]}</span>
    <span class="info"><b>${u.n}${u.me?' · você':''}</b><span><span class="${u.on?'on':'off'}"></span>${u.r}</span></span>
    <span class="acts"><button class="iconbtn" title="Editar">✎</button><button class="iconbtn" title="Resetar senha">🔑</button>${u.on&&!u.me?'<button class="iconbtn" title="Desconectar">⏏</button>':''}</span></div>`).join('')}
  <div class="actions" style="margin-top:.8rem"><button class="btnp">Novo usuário</button></div>`;
}
function secMods(){
  if(!modsOn){
    return `<div class="vazio">Nenhum mod instalado neste mundo.<br>Mods acrescentam painéis, camadas e regras opcionais.
      <br><button class="btnp" disabled title="Carga dinâmica é [V2] — REQ-ESC-012">Instalar mod (V2)</button></div>`;
  }
  return `<p class="sec-hint">Ligar ou desligar vale para este mundo.</p>
  ${MODS.map(m=>`<div class="mod"><span class="info"><b>${m.name}</b><span>${m.desc} · v${m.v}</span></span><button class="toggle ${m.on?'on':''}"></button></div>`).join('')}
  <div class="actions" style="margin-top:.8rem"><button class="btnp" disabled>Instalar mod (V2)</button></div>`;
}

function sections(){
  const all=[
    {id:'prefs', title:'Minhas preferências', hint:'Som e avisos, só neste aparelho', body:secPrefs},
    {id:'world', title:'Mundo',              hint:'Regras que valem para a mesa',    body:secWorld, gm:true},
    {id:'perms', title:'Permissões',         hint:'O que cada papel pode fazer',     body:secPerms, gm:true},
    {id:'users', title:'Usuários',           hint:'Contas da mesa',                  body:secUsers, gm:true},
    {id:'mods',  title:'Mods',               hint: modsOn?'4 instalados':'nenhum instalado', body:secMods, gm:true},
  ];
  return all.filter(s=>!s.gm || role==='gm');
}

/* ================= render ================= */
function tabButton(t){
  const badge = t.badge && (active!==t.id || !open) ? `<span class="badge ${t.badgeCls||''}">${t.badge}</span>` : '';
  return `<button class="tabbtn ${active===t.id&&open?'is-active':''}" data-tab="${t.id}" aria-label="${t.label}">
    ${ICONS[t.id]}${badge}<span class="tip">${t.label}</span></button>`;
}
function settingsBody(){
  const secs=sections();
  const cur=secs.find(s=>s.id===sec);
  if(!cur) return `<div class="panel-body">${secs.map(s=>`<button class="idx" data-sec="${s.id}"><span class="txt">${s.title}<small>${s.hint}</small></span><span class="go">›</span></button>`).join('')}</div>`;
  return `<div class="panel-body">${cur.body()}</div>`;
}
function render(){
  const isGm = role==='gm';
  if(!isGm && ['npcs','scenes'].includes(active)) active='chat';
  if(!isGm && ['world','perms','users','mods'].includes(sec)) sec=null;
  const all=TABS.filter(t=>t.group==='all'&&!t.foot), gms=TABS.filter(t=>t.group==='gm'&&isGm), foot=TABS.filter(t=>t.foot);
  const secs=sections(), cur=secs.find(s=>s.id===sec);
  const head = (active==='settings'&&cur)
    ? `<div class="panel-head"><button class="back" data-back title="Voltar">‹</button><span>${cur.title}</span></div>`
    : `<div class="panel-head"><span>${TITLE[active]}</span></div>`;
  const bodyHtml = active==='settings' ? settingsBody() : `<div class="panel-body">${OTHER[active]}</div>`;

  document.getElementById('root').innerHTML=`
    <div class="${open?'is-open':''}"><aside class="sidebar">
      <nav class="tabs">
        <div class="grp">${all.map(tabButton).join('')}</div>
        ${gms.length?`<div class="grp gm">${gms.map(tabButton).join('')}</div>`:''}
        <div class="foot">${foot.map(tabButton).join('')}</div>
      </nav>
      <div class="panel">${head}${bodyHtml}</div>
    </aside></div>`;

  const who=document.getElementById('who');
  who.className = isGm?'who':'who player';
  who.innerHTML = isGm ? '<b>●</b> Gamemaster · <span style="color:var(--muted)">Mestre</span>'
                       : '<b>●</b> Fofurinha · <span style="color:var(--muted)">Jogador</span>';

  const root=document.getElementById('root');
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.tab;
    if(open&&active===id){open=false;} else {active=id;open=true;}
    if(id!=='settings') sec=null;
    confirming=null; render();
  });
  root.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{sec=b.dataset.sec;confirming=null;render();});
  root.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{sec=null;confirming=null;render();});
  root.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.world, s=DECLARED[system][i];
    if(s.on){ confirming=i; }      /* desligar pede confirmação (DEC-CFG-09) */
    else { s.on=true; confirming=null; }   /* ligar aplica na hora */
    render();
  });
  root.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>{DECLARED[system][+b.dataset.confirm].on=false;confirming=null;render();});
  root.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{confirming=null;render();});
  root.querySelectorAll('.toggle:not([data-world])').forEach(b=>b.onclick=()=>b.classList.toggle('on'));

  document.getElementById('role').textContent = isGm?'ver como jogador':'ver como GM';
  document.getElementById('sys').textContent  = system==='pf2e'?'sistema: PF2e':'sistema: Etmos';
  document.getElementById('mods').textContent = modsOn?'mods: instalados':'mods: nenhum';
  document.getElementById('lbl').textContent  = isGm
    ? 'GM: 5 seções · troque o sistema para ver o estado vazio de Mundo'
    : 'Jogador: uma entrada só, e nada de mods';

  const u=new URL(location);
  u.searchParams.set('role',role); u.searchParams.set('sys',system); u.searchParams.set('mods',modsOn?'1':'0');
  history.replaceState(null,'',u);
}
document.getElementById('role').onclick=()=>{role=role==='gm'?'player':'gm';sec=null;confirming=null;render();};
document.getElementById('sys').onclick =()=>{system=system==='pf2e'?'etmos':'pf2e';confirming=null;render();};
document.getElementById('mods').onclick=()=>{modsOn=!modsOn;render();};
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  if(e.key==='p'||e.key==='P'){role=role==='gm'?'player':'gm';sec=null;confirming=null;render();}
  if(e.key==='s'||e.key==='S'){system=system==='pf2e'?'etmos':'pf2e';confirming=null;render();}
  if(e.key==='m'||e.key==='M'){modsOn=!modsOn;render();}
});
render();
</script>
</body>
</html>
