<!-- Atualizado para a linguagem visual de 22/10/2026 (lane ui-gaveta). Fonte dos tokens: packages/client/src/styles/base.css. -->
<!--
  PROTOTYPE — descartável. Rodada 1 do grill da aba Cenas. Não é código de
  produção; não importar nada daqui.

  ----------------------------------------------------------------------------
  ESTA ABA É A PORTA DE ENTRADA DO MESTRE
  ----------------------------------------------------------------------------
  DEC-GAV-02: no primeiro acesso, o jogador abre em Chat e o Mestre abre em
  CENAS. É a primeira coisa que ele vê ao entrar no mundo — e a única aba com
  esse privilégio. Isso deveria mandar no desenho, e é o que a variante C
  leva a sério.

  Como no Compêndio, o ponto de partida não é tela em branco:
  `ScenesSidebar.svelte` já existe (lista de nomes, ponto da ativa, ações de ativar/preparar/editar/apagar,
  "+ New"), o servidor tem CRUD e a ativação tem handler dedicado.

  ----------------------------------------------------------------------------
  O QUE JÁ ESTÁ DECIDIDO — E ONDE (tratei como não-negociável)
  ----------------------------------------------------------------------------
   · ABA DO GRUPO GM (DEC-GAV-01). O jogador não tem este ícone. Troque o
     papel no alternador: a aba SOME do trilho.
   · ATIVAR É GLOBAL, INSTANTÂNEO E TEM UM ESCRITOR SÓ. `world:activeScene`
     (GM-only) escreve `settings['_meta:activeScene']` e faz broadcast para
     todo mundo; `doc:update {active}` é BLOQUEADO no servidor
     (migration 008_scene_active). Não existe "olhar sem levar a mesa junto".
     Hoje isso vive num comentário de migration — a spec-filha tem que
     promover a decisão a normativa.
   · MAPA DE REGIÃO NÃO É CENA (DEC-MREG-08, spec 34): `RegionMap` é
     documento, mora no painel Mapa do Hub, e nunca entra nesta lista.
   · `thumb` EXISTE NO SCHEMA E NINGUÉM GERA (assets/routes.ts: "thumbnail
     generation is TODO post-MVP"). Toda miniatura aqui é mentira de
     protótipo — ligue "miniatura: não gerada" e veja o que sobra.
   · `folder` E `sort` EXISTEM no SceneDocument e a UI nunca usou.
   · O QUE NÃO CABE EM 300px JÁ TEM DIÁLOGO: `SceneCreateDialog`,
     `ScenePerceptionDialog`, `SceneDeleteConfirm`. Viram janelas flutuantes
     (DEC-GAV-04 + REQ-UIF-009), não telas dentro da gaveta.

  ----------------------------------------------------------------------------
  AS TRÊS VARIANTES
  ----------------------------------------------------------------------------
  A · LISTA    — o painel de hoje, feito direito: nome, ponto da ativa, ações no
                 hover, busca que aparece quando a lista cresce, agrupamento
                 por pasta (que o schema já tem). Sem imagem nenhuma.
                 Aposta: cena se reconhece pelo NOME, e miniatura é uma
                 promessa que o projeto ainda não pode cumprir.
                 Custo: nada na linha diz o que a cena É. Numa campanha de
                 28 cenas, "Corredor 3" e "Corredor 4" são a mesma coisa.

  B · GALERIA  — cartões de miniatura em duas colunas, nome sobreposto,
                 moldura na ativa. Aposta: mapa é imagem; o Mestre reconhece
                 pelo desenho antes de ler.
                 Custo: COMPRA uma pipeline de thumbnail que não existe
                 (Q2), e em 300px cada cartão tem ~137px — ligue "miniatura:
                 não gerada" para ver a galeria virar uma grade de retângulos
                 cinza com texto cortado.

  C · MESA     — o topo é fixo: "No ar" — a cena que a mesa inteira está
                 vendo, com os controles que o Mestre aperta durante o jogo
                 (escuridão, luz global, resetar névoa) e quantos jogadores
                 estão nela. Embaixo, o acervo para preparar e trocar.
                 Aposta: se esta é a porta de entrada do Mestre, ela tem que
                 responder "o que está no ar agora" antes de "quais cenas
                 existem".
                 Custo: dá ao painel uma cabeça de altura fixa (como a aba
                 Combate) e encosta na spec 07 — escuridão e névoa são
                 controles de cena ou da barra do canvas?

  ----------------------------------------------------------------------------
  O QUE O PROTÓTIPO PÕE NA MESA DE PROPÓSITO
  ----------------------------------------------------------------------------
   Q1 — ATIVAR MOVE A MESA INTEIRA, SEM VOLTA. É a pergunta central. Clicar em Pôr no ar
        teleporta todo mundo na hora — inclusive no meio de um combate na
        outra cena. Três saídas possíveis, e o protótipo mostra a terceira:
          (a) nada muda: clicou, foi;
          (b) confirmação sempre ("levar 3 jogadores para Cripta?");
          (c) VER diferente de ATIVAR: o Mestre abre a cena para preparar sem levar
              ninguém, e "pôr no ar" é um segundo gesto, explícito.
        (c) é o modelo do Foundry, exige `sceneId` por usuário na presença
        (REQ-USR-032/033, previsto e NÃO implementado) e muda o servidor.
        Aqui ele está desenhado como "modo preparo" — experimente Preparar numa
        cena que não está no ar.

   Q2 — MINIATURA. `thumb` está no schema desde sempre e nada preenche. A
        variante B só se sustenta se alguém renderizar a cena e salvar o PNG.
        É trabalho de canvas, não de UI. Vale o custo, ou lista ganha?

   Q3 — PASTAS. `folder` e `sort` existem no documento. Entram no MVP (como
        na variante A) ou a lista fica plana e a busca resolve?

   Q4 — ORDEM. Alfabética, ou `sort` manual arrastando? Cena nova entra onde
        — topo ou fim? (Hoje: nem uma coisa nem outra, vem na ordem do banco.)

   Q5 — EXCLUIR A CENA QUE ESTÁ No ar. Recusar, como o combate recusa? Ou
        aceitar e cair no `NoSceneOverlay` que já existe? Aqui está recusado.

   Q6 — BADGE. Proposta: NENHUM. Cena não tem "não visto". Só faria sentido
        se a Q1 fechar em (c) — aí o ponto marcaria "você está preparando
        uma cena diferente da que está no ar".

   Q7 — O MESTRE VAI PROCURAR O MAPA DE REGIÃO AQUI. Ele é documento, não
        cena (DEC-MREG-08), e mora no Hub. Uma linha morta no rodapé
        apontando para lá resolve, ou é poluição?

   Q8 — DUPLICAR NÃO EXISTE. `sceneController` tem create/update/activate/
        delete/list. Duplicar uma cena preparada (mesmo grid, mesmo fundo) é
        o pedido mais óbvio de quem prepara sessão. Entra?

   Q9 — QUANTOS JOGADORES ESTÃO AQUI. O painel mostra "3 na cena" — mas
        `userPresenceUpdate` com `sceneId` está previsto na 05 e NÃO
        implementado. Enquanto ativar for global, o número é sempre "todos":
        ou o dado é inútil, ou ele é a prova de que a Q1 precisa de (c).
-->

:root {
  color-scheme: dark;

  /* Surfaces: warm charcoal, three flat steps. */
  --fusion-bg: #141311;
  --fusion-surface: #1c1b18;
  --fusion-surface-alt: #25231f;
  --fusion-input-bg: #11100e;
  --fusion-border: #3b3830;
  --fusion-border-strong: #575245;

  /* Text: off-white, never #fff. Muted and subtle stay AA on every surface. */
  --fusion-text: #ebe5d6;
  --fusion-text-muted: #b8b09e;
  --fusion-text-subtle: #9a927f;

  /* The one accent — brass. Interactive and "selected" only, never decoration. */
  --fusion-accent: #d6a24a;
  --fusion-accent-hover: #e4b765;
  --fusion-accent-dim: rgba(214, 162, 74, 0.16);
  --fusion-on-accent: #1a1408;

  /* Semantic */
  --fusion-success: #7cc395;
  --fusion-warning: #e8925a;
  --fusion-danger: #ec7468;
  --fusion-info: #7fb2dc;
  --fusion-magic: #b9a0ea;

  /* Semantic washes — subtle tinted fills for badges / states */
  --fusion-success-dim: rgba(124, 195, 149, 0.15);
  --fusion-warning-dim: rgba(232, 146, 90, 0.15);
  --fusion-danger-dim: rgba(236, 116, 104, 0.15);
  --fusion-info-dim: rgba(127, 178, 220, 0.15);
  --fusion-magic-dim: rgba(185, 160, 234, 0.15);

  /* Chat system card (A022, spec 38, DEC-ACH-02/03 + REQ-ACH-025): a card's left border is
     this fixed blue regardless of sender, so "this is a system card" reads apart from
     "this is <someone>'s message". Not derived from the accent/semantic tones on purpose —
     those already carry meaning in chat (crit, fumble, blind). */
  --fusion-chat-sys: #6fa6cc;

  /* Focus ring: its own colour, never the accent, so focus never reads as "selected". */
  --fusion-focus: #9ccaff;

  /* Elevation: one soft shadow, for floating windows, popovers and menus only. */
  --fusion-shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.45);
  --fusion-shadow-popover: 0 6px 18px rgba(0, 0, 0, 0.35);

  /* Proficiency (TEML — Destreinado, Treinado, Expert, Mestre, Lendário). */
  --fusion-prof-u: var(--fusion-text-subtle);
  --fusion-prof-t: var(--fusion-info);
  --fusion-prof-e: var(--fusion-success);
  --fusion-prof-m: var(--fusion-accent);
  --fusion-prof-l: var(--fusion-magic);

  --fusion-prof-u-bg: rgba(154, 146, 127, 0.14);
  --fusion-prof-t-bg: var(--fusion-info-dim);
  --fusion-prof-e-bg: var(--fusion-success-dim);
  --fusion-prof-m-bg: var(--fusion-accent-dim);
  --fusion-prof-l-bg: var(--fusion-magic-dim);

  --fusion-prof-u-border: var(--fusion-border);
  --fusion-prof-t-border: rgba(127, 178, 220, 0.45);
  --fusion-prof-e-border: rgba(124, 195, 149, 0.45);
  --fusion-prof-m-border: rgba(214, 162, 74, 0.45);
  --fusion-prof-l-border: rgba(185, 160, 234, 0.45);

  /* Typography. rem sizes (the reader's browser zoom wins); nothing below xs. */
  --fusion-font:
    "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
    sans-serif;
  --fusion-font-mono:
    "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas,
    monospace;
  --fusion-text-xs: 0.8125rem; /* 13px — captions, badges: the floor */
  --fusion-text-sm: 0.875rem; /* 14px — dense lists, secondary text */
  --fusion-text-base: 0.9375rem; /* 15px — body */
  --fusion-text-md: 1rem; /* 16px — reading text (journal, descriptions) */
  --fusion-text-lg: 1.125rem; /* 18px — section titles */
  --fusion-text-xl: 1.375rem; /* 22px — window / sheet titles */
  --fusion-text-2xl: 1.75rem; /* 28px — the big number of a stat or a roll */
  --fusion-leading: 1.5;
  --fusion-leading-tight: 1.25;
  --fusion-tracking: 0.012em;
  --fusion-word-spacing: 0.06em;
  --fusion-weight-regular: 400;
  --fusion-weight-medium: 500;
  --fusion-weight-bold: 700;
  /* Readable line length for prose. */
  --fusion-measure: 68ch;

  /* Spacing (4px grid) */
  --fusion-space-1: 4px;
  --fusion-space-2: 8px;
  --fusion-space-3: 12px;
  --fusion-space-4: 16px;
  --fusion-space-5: 20px;
  --fusion-space-6: 24px;
  --fusion-space-8: 32px;

  /* Radii: small and few. Pills only for counters. */
  --fusion-radius-sm: 3px;
  --fusion-radius: 6px;
  --fusion-radius-lg: 8px;
  --fusion-radius-pill: 999px;

  /* Touch target floor (mouse and finger). */
  --fusion-target: 40px;

  /* Motion */
  --fusion-transition: 150ms ease;

  /* Layout.
     The side drawer is one fixed width for every tab (REQ-GAV-012, DEC-GAV-04):
     300px of panel plus a 44px rail, and no user resize — a tab that needs more
     room opens a floating window instead of stretching the drawer. */
  --fusion-sidebar-width: 300px;
  --fusion-sidebar-rail-width: 44px;
  --fusion-header-height: 48px;

  /* Layer scale (spec 11 REQ-UIF-008; spec 53 §2.7 — BAR-F1-03).
     The z-index of the shell's layers, declared in one place so nobody hard-codes a number:

       canvas
       < scene notice               60  literal in ScenePrepareNotice.svelte
       < action bar                 70  --fusion-z-actionbar
       < side drawer                90  literal in Sidebar.svelte
       < header                    100  literal in TableScreen.svelte
       < floating windows         101+  counted up by the window manager, inside the host
       < window host               200  --fusion-z-windows
       < tooltip, popover          400  --fusion-z-tooltip
       < context menu              410  --fusion-z-menu

     Tooltip, popover and menu are portaled to <body> (lib/ui/floatingLayer.ts), so these
     numbers are compared with the window host's own: the host is a stacking context at
     200, and a layer rendered *inside* a window could never rise above it.
     They also clear the in-page modals that still use literals (token dialogs 200/201, file
     picker 300/301), so a tooltip or menu opened from inside one stays visible. REQ-UIF-008
     wants modals above menus and tooltips; that is for the day modals get tokens of their own
     (above 410) — a native <dialog> is already above everything, in the top layer. */
  --fusion-z-actionbar: 70;
  --fusion-z-windows: 200;
  --fusion-z-tooltip: 400;
  --fusion-z-menu: 410;

  /* Combat turn head (spec 40, DEC-CBA-02 / REQ-CBA-021).
     The head of the turn is one fixed height for every participant — a new condition, a
     long name or a health bar must never move the advance control, which is anchored to
     the footer strip below (RNF-CBA-03). Mirrored in TS by TURN_HEAD_HEIGHT_REM /
     TURN_HEAD_FOOTER_HEIGHT_REM in lib/combat/turnHead.svelte.ts. */
  --fusion-combat-turn-head-height: 6.5rem;
  --fusion-combat-turn-head-footer-height: 2.25rem;

  /* Condition tone (DEC-CTT-11, REQ-SYS-043 / REQ-CTT-031).
     The colour of a condition chip says what the condition does to whoever carries it,
     never how grave it is: green helps, red hinders, purple is a situation (detection,
     attitude, control). Aliases rather than raw colours so the combat tab (REQ-CBA-050)
     and the contacts tab paint the same three tones. The `-dim` fills are the emphasis of
     a critical condition (REQ-CTT-032) — emphasis on the tone it already has, never a
     fourth colour. */
  --fusion-condition-benefit: var(--fusion-success);
  --fusion-condition-harm: var(--fusion-danger);
  --fusion-condition-special: var(--fusion-magic);
  --fusion-condition-benefit-dim: var(--fusion-success-dim);
  --fusion-condition-harm-dim: var(--fusion-danger-dim);
  --fusion-condition-special-dim: var(--fusion-magic-dim);

  /* The "no ar" head of the Cenas tab is one fixed height for every state
     (REQ-CEN-010/013): a long scene name, a missing background image or the
     environment row must never move the controls the GM presses all session. */
  --fusion-scene-head-height: 132px;

  /* Aliases for components written against names nobody had declared (they silently fell
     back to hard-coded colours and ignored the theme). New code uses the names above. */
  --fusion-radius-md: var(--fusion-radius);
  --fusion-surface-raised: var(--fusion-surface-alt);
  --fusion-text-on-accent: var(--fusion-on-accent);
  --fusion-accent-contrast: var(--fusion-on-accent);
  --fusion-accent-soft: var(--fusion-accent-dim);
  --fusion-warn: var(--fusion-warning);
  --fusion-color-accent: var(--fusion-accent);
  --fusion-color-accent-hover: var(--fusion-accent-hover);
  --fusion-color-on-accent: var(--fusion-on-accent);
  --fusion-color-border: var(--fusion-border);
  --fusion-color-focus: var(--fusion-focus);
  --fusion-color-hero: var(--fusion-accent);
  --fusion-color-info: var(--fusion-info);
  --fusion-color-magic: var(--fusion-magic);
  --fusion-color-success: var(--fusion-success);
  --fusion-color-warning: var(--fusion-warning);
  --fusion-color-input-bg: var(--fusion-input-bg);
  --fusion-color-surface: var(--fusion-surface);
  --fusion-color-surface-raised: var(--fusion-surface-alt);
  --fusion-color-text: var(--fusion-text);
  --fusion-color-text-primary: var(--fusion-text);
  --fusion-color-text-secondary: var(--fusion-text-muted);
  --fusion-color-text-muted: var(--fusion-text-muted);
  --fusion-color-text-subtle: var(--fusion-text-subtle);
}

.b{min-height:var(--fusion-target);background:var(--fusion-surface-alt);color:var(--fusion-text);border:1px solid var(--fusion-border-strong);border-radius:var(--fusion-radius-sm);padding:0 var(--fusion-space-3);font-size:var(--fusion-text-sm);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:var(--fusion-space-1)}

.srch{display:flex;align-items:center;gap:var(--fusion-space-2);padding:var(--fusion-space-2);border-bottom:1px solid var(--fusion-border);flex-shrink:0}

.counter{font-size:var(--fusion-text-xs);color:var(--fusion-text-subtle);padding:var(--fusion-space-2) var(--fusion-space-3) var(--fusion-space-1);display:flex;align-items:center;gap:var(--fusion-space-1)}
.counter .grow{flex:1}
.secl{width:100%;min-height:var(--fusion-target);background:none;border:0;border-bottom:1px solid var(--fusion-border);text-align:left;font-size:var(--fusion-text-sm);font-weight:var(--fusion-weight-bold);color:var(--fusion-text-muted);padding:0 var(--fusion-space-3);display:flex;align-items:center;gap:var(--fusion-space-2);cursor:pointer}

/* ---------- Cabeça "No ar" (variante C) ---------- */
.live{min-height:var(--fusion-scene-head-height);display:flex;flex-direction:column;padding:var(--fusion-space-3);border-bottom:1px solid var(--fusion-border);flex-shrink:0}

.tog{display:inline-flex;align-items:center;gap:var(--fusion-space-1);min-height:var(--fusion-target);font-size:var(--fusion-text-sm);color:var(--fusion-text-muted);background:var(--fusion-surface-alt);border:1px solid var(--fusion-border);border-radius:var(--fusion-radius-sm);padding:0 var(--fusion-space-2);cursor:pointer}

.who-here{display:inline-flex;align-items:center;gap:var(--fusion-space-1)}
.wip{font-size:var(--fusion-text-xs);color:var(--fusion-warning);border:1px solid var(--fusion-warning);border-radius:var(--fusion-radius-sm);padding:0 4px}

/* ---------- Linha de cena (variante A / C) ---------- */
.sc{display:grid;grid-template-columns:var(--fusion-target) 8px 32px 1fr;column-gap:var(--fusion-space-2);align-items:center;padding:var(--fusion-space-1) var(--fusion-space-3) var(--fusion-space-1) 0;border-left:3px solid transparent;border-bottom:1px solid var(--fusion-border);cursor:pointer}

.sc .grip{display:grid;place-items:center;align-self:stretch;min-height:var(--fusion-target);color:var(--fusion-text-subtle);cursor:grab;font-size:var(--fusion-text-lg)}
.sc .dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--fusion-text-subtle);flex-shrink:0}

.sc.prep .dot{background:var(--fusion-warning);border-color:var(--fusion-warning)}

.sc .nm{font-size:var(--fusion-text-base);color:var(--fusion-text);overflow-wrap:anywhere;line-height:var(--fusion-leading-tight)}
.sc .nm mark{background:var(--fusion-accent-dim);color:var(--fusion-text);border-radius:2px}
.sc .sub{font-size:var(--fusion-text-xs);color:var(--fusion-text-subtle);display:flex;align-items:center;gap:var(--fusion-space-1);flex-wrap:wrap;margin-top:2px}
.sc .actw{grid-column:1/-1;display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--fusion-transition)}
.sc:hover .actw,.sc:focus-within .actw,.sc.sel .actw{grid-template-rows:1fr}
.sc .acts{min-height:0;overflow:hidden;display:flex;padding-left:var(--fusion-space-1)}
@media (hover:none){.sc .actw{grid-template-rows:1fr}}
.tagn{font-size:var(--fusion-text-xs);border:1px solid var(--fusion-border);border-radius:var(--fusion-radius-sm);padding:0 4px;color:var(--fusion-text-subtle);white-space:nowrap}
.tagn.night{color:var(--fusion-magic);border-color:var(--fusion-magic)}

.tagn.air{color:var(--fusion-success);border-color:var(--fusion-success)}

/* ---------- Galeria (variante B) ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--fusion-space-2);padding:var(--fusion-space-2)}

.card .cap{padding:var(--fusion-space-2);font-size:var(--fusion-text-sm);line-height:var(--fusion-leading-tight);overflow-wrap:anywhere;background:var(--fusion-surface-alt);border-top:1px solid var(--fusion-border)}
.card .flag{position:absolute;bottom:var(--fusion-space-1);left:var(--fusion-space-1);z-index:2;font-size:var(--fusion-text-xs);font-weight:var(--fusion-weight-bold);border-radius:var(--fusion-radius-sm);padding:0 6px;background:var(--fusion-success);color:var(--fusion-on-accent)}

.card .acts{position:absolute;top:0;right:0;z-index:2;display:flex;opacity:0;transition:opacity var(--fusion-transition);background:var(--fusion-surface);border-bottom-left-radius:var(--fusion-radius-sm)}
.card:hover .acts,.card:focus-within .acts{opacity:1}

/* ---------- Estados / avisos ---------- */
.empty{text-align:center;padding:var(--fusion-space-6) var(--fusion-space-4) var(--fusion-space-3);color:var(--fusion-text-muted);font-size:var(--fusion-text-sm)}

.foot-note b{color:var(--fusion-text-muted)}
.noaccess{padding:var(--fusion-space-6) var(--fusion-space-4);color:var(--fusion-text-muted);font-size:var(--fusion-text-sm);text-align:center}

.win{position:fixed;z-index:var(--fusion-z-windows);background:var(--fusion-surface);border:1px solid var(--fusion-border-strong);border-radius:var(--fusion-radius);box-shadow:var(--fusion-shadow-modal);width:440px;max-width:calc(100vw - 16px);max-height:76vh;display:flex;flex-direction:column;overflow:hidden}

.win .foot{display:flex;gap:var(--fusion-space-2);padding:var(--fusion-space-2) var(--fusion-space-3);border-top:1px solid var(--fusion-border);background:var(--fusion-surface-alt);align-items:center;flex-wrap:wrap}

.switcher{position:fixed;left:472px;right:360px;bottom:var(--fusion-space-4);z-index:150;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:var(--fusion-space-2);background:var(--fusion-surface);border:1px solid var(--fusion-border-strong);border-radius:var(--fusion-radius-lg);padding:var(--fusion-space-2);box-shadow:var(--fusion-shadow-popover);font-size:var(--fusion-text-sm)}

</style>

<script>
  (function () {
    var b = document.getElementById("theme-toggle");
    function paint() { b.textContent = "Tema: " + (document.documentElement.dataset.theme === "light" ? "claro" : "escuro"); }
    b.addEventListener("click", function () {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      paint();
    });
    paint();
  })();
</script>

<div class="header">
  <span class="bolt"><svg class="svg-i" aria-hidden="true"><use href="#i-zap"/></svg></span><span class="world">teste_xande</span><span class="pill" id="hpill"></span>
  <span class="spacer"></span>
  <span class="status"><span class="dotc"></span>Conectado <span class="num">2 ms</span></span>
  <span class="who" id="who"></span>
  <button class="btn" type="button">Sair</button>
</div>

<div class="stage" id="stage"></div>

<div id="root"></div>
<div id="float"></div>

<div class="switcher">
  <button id="variant" class="var" type="button">variante</button>
  <button id="role" type="button">papel</button>
  <button id="big" class="alt" type="button">acervo</button>
  <button id="thumb" class="alt" type="button">miniatura</button>
  <button id="state" type="button">estado</button>
</div>
<div class="legend" id="legend"></div>

<script>
/* ===================== chassi (spec 36) ===================== */
/* Ícone Lucide via symbol definido no topo do body (nós copiados de packages/shared/src/ui/icons.ts). */
function I(name, px){
  return '<svg class="svg-i" aria-hidden="true"'+(px?' style="width:'+px+'px;height:'+px+'px"':'')+'><use href="#i-'+name+'"/></svg>';
}
const TABICON = {chat:'message-square', contacts:'users', combat:'swords', compendium:'book-open', npcs:'shield', scenes:'image', settings:'settings'};
const TABS = [
  {id:'chat',label:'Chat',group:'all'},
  {id:'contacts',label:'Contatos',group:'all'},
  {id:'combat',label:'Combate',group:'all'},
  {id:'compendium',label:'Compêndio',group:'all'},
  {id:'npcs',label:'NPCs',group:'gm'},
  {id:'scenes',label:'Cenas',group:'gm'},
  {id:'settings',label:'Configurações',group:'all',foot:true},
];
const TITLE = {chat:'Chat',contacts:'Contatos',combat:'Combate',compendium:'Compêndio',npcs:'NPCs',scenes:'Cenas',settings:'Configurações'};
const OTHER = {
  chat:'<div class="empty">o painel do Chat é a spec 38</div>',
  contacts:'<div class="empty">o painel de Contatos é a spec 39</div>',
  combat:'<div class="empty">o painel de Combate é a spec 40</div>',
  compendium:'<div class="empty">o painel do Compêndio é a spec-filha irmã desta</div>',
  npcs:'<div class="empty">o diretório de NPCs é a spec 42 (em grill)</div>',
  settings:'<div class="empty">o painel de Configurações é a spec 37</div>',
};

/* ===================== cenas mock =====================
   `g` = fundo chapado (token) que finge a miniatura — sem gradiente.
   `pasta` existe no schema (folder/sort) e a UI nunca usou (Q3).       */
const G = {
  keep:'var(--fusion-info-dim)',
  crypt:'var(--fusion-magic-dim)',
  forest:'var(--fusion-success-dim)',
  town:'var(--fusion-warning-dim)',
  cave:'var(--fusion-surface-alt)',
  sea:'var(--fusion-info-dim)',
};
const BASE = [
  {id:'s1', nm:'Fortaleza de Pedra Alta', f:'Ato 1', g:G.keep,   w:70,h:50, grid:100, night:false, fog:true,  notes:'jogo hoje'},
  {id:'s2', nm:'Cripta dos Sete',         f:'Ato 1', g:G.crypt,  w:40,h:40, grid:100, night:true,  fog:true},
  {id:'s3', nm:'Estrada da Floresta',     f:'Ato 1', g:G.forest, w:60,h:40, grid:100, night:false, fog:false},
  {id:'s4', nm:'Vila de Beirapedra',      f:'Ato 1', g:G.town,   w:50,h:50, grid:100, night:false, fog:false},
  {id:'s5', nm:'Caverna do Eco',          f:'Ato 2', g:G.cave,   w:35,h:35, grid:100, night:true,  fog:true},
  {id:'s6', nm:'Porto de Maré Baixa',     f:'Ato 2', g:G.sea,    w:80,h:45, grid:100, night:false, fog:false},
];
/* campanha longa: o paredão que a lista plana não segura (Q3/Q4) */
const EXTRA = [];
(function(){
  const packs = [
    ['Ato 2', G.cave, ['Corredor 1','Corredor 2','Corredor 3','Salão dos Ossos','Poço','Ponte Quebrada']],
    ['Ato 3', G.crypt, ['Antecâmara','Câmara Selada','Escadaria','Altar','Fosso','Saída Norte']],
    ['Rascunhos', G.forest, ['Encontro aleatório','Clareira','Acampamento','Emboscada','Trilha','Rio']],
    ['Cidade', G.town, ['Taverna','Mercado','Docas','Templo']],
  ];
  let k=0;
  packs.forEach(function(p){ p[2].forEach(function(n){ k++; EXTRA.push({id:'x'+k, nm:n, f:p[0], g:p[1], w:40,h:40, grid:100, night:false, fog:true}); }); });
})();

/* ===================== estado ===================== */
const url = new URL(location);
let variant = (url.searchParams.get('v')||'A').toUpperCase();
let role    = url.searchParams.get('role')==='player' ? 'player' : 'gm';
let big     = url.searchParams.get('big')==='1';
let hasThumb= url.searchParams.get('thumb')!=='0';
let stateKind = url.searchParams.get('state')==='empty' ? 'empty' : 'full';
let active='scenes', open=true;
let liveId='s1';                 /* a cena NO AR — global, um escritor só */
let prepId=null;                 /* Q1(c): cena aberta só para o Mestre */
let sel=null;
let q='';
let collapsed={};
let win=null;                    /* {kind:'config'|'perc'|'del'|'new', id} */
let winPos={x:null,y:null};
let toast=null;

const isGm = ()=> role==='gm';
const scenes = ()=> stateKind==='empty' ? [] : (big ? BASE.concat(EXTRA) : BASE.slice());
const S = (id)=> scenes().find(s=>s.id===id);
const live = ()=> S(liveId);
const norm = (s)=> (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function shown(){
  let l = scenes();
  if(q) l = l.filter(s=> norm(s.nm).includes(norm(q)) || norm(s.f).includes(norm(q)));
  return l;
}
function say(msg){ toast=msg; render(); setTimeout(()=>{ toast=null; render(); }, 3200); }

/* ===================== peças ===================== */
function tabButton(t){
  const gm = t.group==='gm';
  let badge='';
  if(t.id==='chat') badge='<span class="badge">3</span>';
  /* Q6: badge só existiria se a Q1 fechar em "ver diferente de ativar" */
  if(t.id==='scenes' && prepId) badge='<span class="badge dot"></span>';
  return '<button type="button" class="tabbtn '+(active===t.id&&open?'is-active':'')+'" data-tab="'+t.id+'" aria-label="'+t.label+'" title="'+t.label+'">'
    + I(TABICON[t.id],20) + badge + '<span class="tip">'+t.label+(gm?'<span class="gm-tag">GM</span>':'')+'</span></button>';
}
function mark(s){
  if(!q) return s;
  const i = norm(s).indexOf(norm(q));
  if(i<0) return s;
  return s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length);
}
function thumbStyle(s){ return hasThumb ? 'background:'+s.g : ''; }
function thumbInner(s){ return hasThumb ? I('image',16) : '<span>?</span>'; }
function tags(s){
  return (s.night?'<span class="tagn night">noite</span>':'')
       + (s.fog?'<span class="tagn fog">névoa</span>':'');
}
/* Ação só-ícone: title + aria-label em pt-BR (alvo 40px vem de .ib) */
function ib(attr, icon, label, name, cls){
  return '<button type="button" class="ib'+(cls?' '+cls:'')+'" '+attr+' title="'+label+'" aria-label="'+label+': '+name+'">'+I(icon)+'</button>';
}
function sceneActs(s){
  const isLive = s.id===liveId;
  return '<div class="actw"><div class="acts">'
    + (isLive?'':ib('data-go="'+s.id+'"','play','Pôr no ar (leva a mesa inteira)',s.nm))
    + ib('data-prep="'+s.id+'"','eye','Preparar (abre só para você — Q1c)',s.nm)
    + ib('data-cfg="'+s.id+'"','square-pen','Editar (abre uma janela)',s.nm)
    + ib('data-preload="'+s.id+'"','cloud-download','Pré-carregar para todos',s.nm)
    + ib('data-dup="'+s.id+'"','copy','Duplicar (não existe hoje — Q8)',s.nm)
    + ib('data-del="'+s.id+'"','trash','Apagar',s.nm,'dg')
    + '</div></div>';
}
function sceneRow(s){
  const cls = ['sc', s.id===liveId?'on':'', s.id===prepId?'prep':'', s.id===sel?'sel':''].join(' ');
  return '<div class="'+cls+'" data-sc="'+s.id+'">'
    + '<span class="grip" role="img" title="Arrastar para reordenar (sort) — Q4" aria-label="Arrastar para reordenar">'+I('grip-vertical')+'</span>'
    + '<span class="dot"></span>'
    + '<div class="th" style="'+thumbStyle(s)+'">'+thumbInner(s)+'</div>'
    + '<div class="mid"><div class="nm">'+mark(s.nm)+'</div>'
    +   '<div class="sub"><span class="num">'+s.w+'×'+s.h+'</span> '+tags(s)+(s.id===liveId?'<span class="tagn air">no ar</span>':'')+'</div>'
    + '</div>'
    + sceneActs(s) + '</div>';
}

/* ================= variante A — lista ================= */
function secHeader(f, n){
  const col = collapsed[f];
  return '<button type="button" class="secl" data-col="'+f+'" aria-expanded="'+(!col)+'">'+I(col?'chevron-right':'chevron-down')+'<span>'+f+'</span><span class="cnt">'+n+'</span></button>';
}
function bodyA(){
  const list = shown();
  if(!list.length) return emptyBody();
  const folders = [];
  list.forEach(s=>{ if(!folders.includes(s.f)) folders.push(s.f); });
  let out = (scenes().length>8?searchBar():'')
    + '<div class="counter"><b>'+list.length+'</b> cenas em '+folders.length+' pastas<span class="grow"></span>'
    + '<span>ordem: '+(big?'manual (sort)':'alfabética')+'</span></div>';
  out += folders.map(function(f){
    const ss = list.filter(s=>s.f===f);
    return secHeader(f, ss.length) + (collapsed[f]?'':ss.map(sceneRow).join(''));
  }).join('');
  return out + footNote();
}

/* ================= variante B — galeria ================= */
function bodyB(){
  const list = shown();
  if(!list.length) return emptyBody();
  let out = (scenes().length>8?searchBar():'')
    + '<div class="counter"><b>'+list.length+'</b> cenas<span class="grow"></span>'
    + (hasThumb?'<span>miniatura: gerada</span>':'<span style="color:var(--fusion-warning)">miniatura: nenhuma existe</span>')+'</div>'
    + '<div class="grid">'
    + list.map(function(s){
        const cls = ['card', s.id===liveId?'on':'', s.id===prepId?'prep':''].join(' ');
        const flag = s.id===liveId ? '<span class="flag">No ar</span>'
                   : s.id===prepId ? '<span class="flag prep">Preparo</span>' : '';
        const body = hasThumb
          ? '<div class="bgi" style="background:'+s.g+'">'+I('image',28)+flag+'</div>'
          : '<div class="bgi"><div class="nothumb">sem miniatura<br/><span class="num">'+s.w+'×'+s.h+'</span></div>'+flag+'</div>';
        return '<div class="'+cls+'" data-sc="'+s.id+'">'+body
          + '<div class="acts">'
          +   (s.id===liveId?'':ib('data-go="'+s.id+'"','play','Pôr no ar',s.nm))
          +   ib('data-cfg="'+s.id+'"','square-pen','Editar (abre uma janela)',s.nm)
          + '</div>'
          + '<div class="cap">'+mark(s.nm)+'</div></div>';
      }).join('')
    + '</div>';
  return out + footNote();
}

/* ================= variante C — mesa ================= */
function liveHead(){
  const s = live();
  if(!s) return '<div class="live"><div class="lbl off"><span class="dotc"></span>Nada no ar</div>'
    + '<div class="meta">Os jogadores estão vendo a tela de espera (<b>NoSceneOverlay</b>).</div>'
    + '<div class="ctl"><button type="button" class="b live grow" data-go="'+(scenes()[0]?scenes()[0].id:'')+'">Pôr a primeira cena no ar</button></div></div>';
  return '<div class="live">'
    + '<div class="top">'
    +   '<div class="th" style="'+thumbStyle(s)+'">'+(hasThumb?I('image',24):'<span class="muted">sem<br/>miniatura</span>')+'</div>'
    +   '<div style="min-width:0;flex:1">'
    +     '<div class="lbl"><span class="dotc"></span>No ar</div>'
    +     '<div class="nm">'+s.nm+'</div>'
    +     '<div class="meta"><span class="num">'+s.w+'×'+s.h+'</span> · grade <span class="num">'+s.grid+' px</span>'
    +       '<span class="who-here">· 3 na cena <span class="wip">em construção</span></span></div>'
    +   '</div>'
    + '</div>'
    + '<div class="ctl">'
    +   '<button type="button" class="tog '+(s.night?'on':'')+'" aria-pressed="'+(!!s.night)+'" data-night="'+s.id+'">'+I('moon')+'Escuridão</button>'
    +   '<button type="button" class="tog '+(s.fog?'on':'')+'" aria-pressed="'+(!!s.fog)+'" data-fogt="'+s.id+'">'+I('cloud-fog')+'Névoa</button>'
    +   ib('data-fog="'+s.id+'"','rotate-ccw','Resetar névoa',s.nm)
    +   ib('data-cfg="'+s.id+'"','square-pen','Editar (abre uma janela)',s.nm)
    + '</div></div>';
}
function bodyC(){
  const list = shown().filter(s=>s.id!==liveId);
  let out = '';
  if(!scenes().length) return emptyBody();
  out += '<div class="counter">Acervo<span class="grow"></span><b>'+list.length+'</b> outras cenas</div>';
  out += (scenes().length>8?searchBar():'');
  out += list.map(sceneRow).join('');
  return out + footNote();
}

/* ================= comuns ================= */
function searchBar(){
  return '<div class="srch"><input id="q" type="search" aria-label="Buscar cena" placeholder="Buscar cena…" value="'+q.replace(/"/g,'&quot;')+'" /></div>';
}
function emptyBody(){
  if(q) return '<div class="empty">Nenhuma cena com esse nome.</div>';
  return '<div class="empty">Nenhuma cena neste mundo.'
    + '<div class="hint">Uma cena é o mapa que a mesa vê. Enquanto não houver uma no ar, os jogadores ficam na tela de espera.</div>'
    + '<div class="acts-c"><button type="button" class="b p" data-new="1">Criar a primeira cena</button></div></div>';
}
function footNote(){
  return '<div class="foot-note"><b>Mapa de região</b> não é cena (DEC-MREG-08): ele é documento e abre pelo Hub. '
    + 'Esta linha é a <b>Q7</b> — resolve a confusão ou é poluição?</div>';
}

/* ================= janelas ================= */
function winHtml(){
  if(!win) return '';
  const s = S(win.id) || {nm:'Nova cena', w:40,h:40, grid:100, night:false, fog:true, g:G.keep};
  const x = winPos.x!==null?winPos.x:(window.innerWidth-440-380);
  const y = winPos.y!==null?winPos.y:110;
  let title='', body='', foot='';
  if(win.kind==='del'){
    const isLive = win.id===liveId;
    title = 'Apagar cena';
    body = (isLive
      ? '<div class="warn"><b>Recusado.</b> "'+s.nm+'" está <b>no ar</b>: a mesa inteira está dentro dela agora. '
        + 'Ponha outra cena no ar antes de apagar esta. <br/><br/>É a proposta da <b>Q5</b> — o combate recusa do mesmo jeito.</div>'
      : '<p>Apagar <b>'+s.nm+'</b> apaga junto o que mora dentro dela: presenças no mapa, paredes, luzes, sons e desenhos.</p>'
        + '<div class="note">O que <b>não</b> vai junto: os atores (eles são documentos do mundo, não da cena) e o journal ligado.</div>')
      ;
    foot = isLive ? '<button type="button" class="b" data-close="1">Entendi</button>'
                  : '<span style="flex:1"></span><button type="button" class="b g" data-close="1">Cancelar</button><button type="button" class="b d" data-close="1">Apagar</button>';
  } else if(win.kind==='perc'){
    title = 'Percepção — '+s.nm;
    body = '<div class="row"><label>Escuridão</label><input type="range" min="0" max="100" value="'+(s.night?70:0)+'" /></div>'
      + '<div class="row"><label>Luz global</label><select><option>ligada</option><option>desligada</option></select></div>'
      + '<div class="row"><label>Limiar</label><input type="number" value="0.75" step="0.05" /></div>'
      + '<div class="row"><label>Visão por token</label><select><option>ligada</option><option>desligada</option></select></div>'
      + '<div class="note">Já existe como <b>ScenePerceptionDialog</b>. Abre em janela porque não cabe nos 300px (DEC-GAV-04) — é o item 5 do contrato da spec-mãe.</div>';
    foot = '<span style="flex:1"></span><button type="button" class="b g" data-close="1">Cancelar</button><button type="button" class="b p" data-close="1">Salvar</button>';
  } else {
    title = (win.kind==='new'?'Nova cena':'Editar — '+s.nm);
    body = '<div class="row"><label>Nome</label><input type="text" value="'+(win.kind==='new'?'':s.nm)+'" /></div>'
      + '<div class="row"><label>Pasta</label><select><option>Ato 1</option><option>Ato 2</option><option>(nenhuma)</option></select></div>'
      + '<div class="sect">Dimensões</div>'
      + '<div class="row"><label>Largura × altura</label><div class="two"><input type="number" value="'+s.w+'" /><input type="number" value="'+s.h+'" /></div></div>'
      + '<div class="row"><label>Preenchimento</label><input type="number" value="0.25" step="0.05" /></div>'
      + '<div class="sect">Grade</div>'
      + '<div class="row"><label>Tipo</label><select><option>quadrada</option><option>hexagonal (ponta cima)</option><option>sem grade</option></select></div>'
      + '<div class="row"><label>Tamanho (px)</label><input type="number" value="'+s.grid+'" /></div>'
      + '<div class="sect">Fundo</div>'
      + '<div class="row"><label>Imagem</label><input type="text" value="assets/maps/'+(s.id||'nova')+'.webp" /></div>'
      + '<div class="row"><label>Cor</label><input type="text" value="cor do tema (padrão)" /></div>'
      + '<div class="note">É o <b>SceneCreateDialog</b> de hoje. Note o tamanho: nada disso caberia na gaveta — '
      + 'e por isso a linha só precisa de <b>pôr no ar · preparar · editar · pré-carregar · duplicar · apagar</b>.</div>';
    foot = '<button type="button" class="b" data-perc="'+win.id+'">Percepção…</button><span style="flex:1"></span>'
      + '<button type="button" class="b g" data-close="1">Cancelar</button><button type="button" class="b p" data-close="1">Salvar</button>';
  }
  return '<div class="win" role="dialog" aria-label="'+title+'" style="left:'+x+'px;top:'+y+'px">'
    + '<div class="wh" data-drag="1"><span class="t">'+title+'</span><button type="button" class="ib" data-close="1" title="Fechar" aria-label="Fechar">'+I('x')+'</button></div>'
    + '<div class="wb">'+body+'</div><div class="foot">'+foot+'</div></div>';
}

/* ================= painel ================= */
function panelScenes(){
  if(!isGm()) return '<div class="phead"><span class="ttl">Cenas</span></div>'
    + '<div class="pbody"><div class="noaccess">Esta aba é do <b>grupo GM</b> (DEC-GAV-01).<br/>'
    + 'No trilho do jogador ela nem aparece — o painel só está aqui para você ver o contraste.<br/><br/>'
    + '<span class="wip">redação no servidor</span><br/><br/>'
    + 'Esconder o ícone não é proteção: o predicado que protege o dado é <b>isRolePrivileged</b> no handler (REQ-GAV-034).</div></div>';
  const head = '<div class="phead"><span class="ttl">Cenas'
    + (scenes().length?' <span class="num">'+scenes().length+'</span>':'')+'</span>'
    + '<span class="grow"></span>'
    + '<button type="button" class="ib" data-new="1" title="Nova cena" aria-label="Nova cena">'+I('plus')+'</button>'
    + '<button type="button" class="ib" title="Ordenar e opções" aria-label="Ordenar e opções">'+I('ellipsis')+'</button></div>';
  const body = variant==='A'?bodyA():variant==='B'?bodyB():bodyC();
  const head2 = (variant==='C') ? liveHead() : '';
  const t = toast ? '<div class="toast" role="status">'+toast+'</div>' : '';
  return head + t + head2 + '<div class="pbody">'+body+'</div>';
}
function panel(){
  const inner = active==='scenes'
    ? panelScenes()
    : '<div class="phead"><span class="ttl">'+TITLE[active]+'</span></div><div class="pbody">'+OTHER[active]+'</div>';
  return '<div class="panel">'+inner+'</div>';
}

/* ===================== render ===================== */
function stageHtml(){
  const s = prepId ? S(prepId) : live();
  const isPrep = !!prepId;
  if(!s) return '<div class="canvasart" style="background:var(--fusion-bg)"></div>'
    + '<div class="lbl"><b>Nenhuma cena no ar</b><br/><small>NoSceneOverlay — o que o jogador vê</small></div>';
  return '<div class="canvasart" style="background:'+(hasThumb?s.g:'var(--fusion-surface)')+'"></div>'
    + (isPrep? '<div class="prepbar">'+I('eye')+'<span>Preparando <b>'+s.nm+'</b> — os jogadores continuam em "'+(live()?live().nm:'nada')+'"</span>'
        + '<span class="grow"></span><button type="button" class="b p" data-go="'+s.id+'">Pôr no ar</button>'
        + '<button type="button" class="b g" data-unprep="1">Sair do preparo</button></div>' : '')
    + '<div class="lbl"><b>'+s.nm+'</b><br/><small>'+(isPrep?'só você está vendo isto (Q1c)':'a mesa inteira está vendo isto')+'</small></div>';
}
function render(){
  const all = TABS.filter(t=>t.group==='all'&&!t.foot);
  const gms = TABS.filter(t=>t.group==='gm'&&isGm());
  const foot= TABS.filter(t=>t.foot);
  document.getElementById('root').innerHTML =
    '<div class="'+(open?'is-open':'')+'"><aside class="shell">'
    + '<nav class="tabs"><div class="grp">'+all.map(tabButton).join('')+'</div>'
    + (gms.length?'<div class="grp gm">'+gms.map(tabButton).join('')+'</div>':'')
    + '<div class="foot">'+foot.map(tabButton).join('')+'</div></nav>'
    + panel() + '</aside></div>';
  document.getElementById('float').innerHTML = winHtml();
  document.getElementById('stage').innerHTML = stageHtml();

  const who = document.getElementById('who');
  who.className = 'who '+(isGm()?'':'player');
  who.innerHTML = isGm() ? '<b><span class="dotc"></span></b> Gamemaster · <span class="muted">Mestre</span>'
                         : '<b><span class="dotc"></span></b> Alexandre · <span class="muted">Jogador (Fofurinha)</span>';
  document.getElementById('hpill').innerHTML = I('map') + ' ' + (live()?live().nm:'sem cena');
  wire(); chrome();
  const u = new URL(location);
  u.searchParams.set('v',variant); u.searchParams.set('role',role);
  u.searchParams.set('big',big?'1':'0'); u.searchParams.set('thumb',hasThumb?'1':'0');
  u.searchParams.set('state',stateKind);
  history.replaceState(null,'',u);
}

function wire(){
  const root=document.getElementById('root'), float=document.getElementById('float'), stage=document.getElementById('stage');
  const on=(scope,sel,fn)=>scope.querySelectorAll(sel).forEach(el=>{ el.onclick=(ev)=>{ ev.stopPropagation(); fn(el,ev); }; });

  on(root,'[data-tab]', el=>{ const id=el.dataset.tab; if(open&&active===id){open=false;} else {active=id;open=true;} render(); });
  on(root,'[data-col]', el=>{ const f=el.dataset.col; collapsed[f]=!collapsed[f]; render(); });
  on(root,'[data-sc]',  el=>{ sel=el.dataset.sc; render(); });

  [root,stage].forEach(s=>{
    on(s,'[data-go]', el=>{ const id=el.dataset.go; const nm=S(id)?S(id).nm:'';
      liveId=id; prepId=null; say(nm+' está no ar — toda a mesa foi levada junto, sem aviso (Q1).'); });
  });
  on(root,'[data-prep]', el=>{ prepId = prepId===el.dataset.prep ? null : el.dataset.prep; render(); });
  on(stage,'[data-unprep]', ()=>{ prepId=null; render(); });
  on(root,'[data-new]',  ()=>{ win={kind:'new',id:null}; render(); });
  on(root,'[data-dup]',  el=>{ say('Duplicar não existe no sceneController de hoje (Q8).'); });
  on(root,'[data-preload]', el=>{ const s=S(el.dataset.preload); say('Pré-carregando "'+(s?s.nm:'')+'" para todos os jogadores — sem trocar a cena no ar.'); });
  on(root,'[data-fog]',  ()=>{ say('Névoa resetada para todos — sem confirmação. Certo?'); });
  on(root,'[data-fogt]', el=>{ const s=S(el.dataset.fogt); if(s){ s.fog=!s.fog; } render(); });
  on(root,'[data-night]',el=>{ const s=S(el.dataset.night); if(s){ s.night=!s.night; } render(); });
  [root,float].forEach(s=>{
    on(s,'[data-cfg]', el=>{ win={kind:'config',id:el.dataset.cfg}; render(); });
    on(s,'[data-del]', el=>{ win={kind:'del',id:el.dataset.del}; render(); });
    on(s,'[data-perc]',el=>{ win={kind:'perc',id:el.dataset.perc}; render(); });
  });
  on(float,'[data-close]',()=>{ win=null; render(); });

  const qi = root.querySelector('#q');
  if(qi){ qi.oninput=(e)=>{ q=e.target.value; const p=e.target.selectionStart; render();
    const n=document.getElementById('q'); if(n){ n.focus(); n.setSelectionRange(p,p); } }; }

  const wh = float.querySelector('[data-drag]');
  if(wh) wh.onmousedown=(ev)=>{
    const w=float.querySelector('.win'), r=w.getBoundingClientRect();
    const dx=ev.clientX-r.left, dy=ev.clientY-r.top;
    const mv=(e2)=>{ winPos.x=e2.clientX-dx; winPos.y=e2.clientY-dy; w.style.left=winPos.x+'px'; w.style.top=winPos.y+'px'; };
    const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  };
}

/* ===================== alternador / legenda ===================== */
const VAR_LB = {A:'A · lista (nome)', B:'B · galeria (miniatura)', C:'C · mesa (no ar)'};
const VAR_NOTE = {
  A:`<tr><td>aposta</td><td>cena se reconhece pelo <b>nome</b> (inteiro, quebra em até 2 linhas). Pastas (o schema já tem <b>folder</b>/<b>sort</b>),
      busca quando a lista cresce, ações só-ícone ao passar o mouse, focar ou tocar. Zero imagem — nada que o projeto ainda não gere.</td></tr>
     <tr><td>custo</td><td>ligue o <b>acervo de campanha</b>: "Corredor 1..3" não dizem nada. A linha não mostra o que a cena É.</td></tr>`,
  B:`<tr><td>aposta</td><td>mapa é <b>imagem</b>: duas colunas de miniatura, moldura verde na que está no ar.
      O Mestre reconhece antes de ler.</td></tr>
     <tr><td>custo</td><td><b>thumb não é gerado por ninguém</b> (assets/routes.ts: TODO post-MVP).
      Desligue "miniatura" e veja o que a variante vira — é a <b>Q2</b>.</td></tr>`,
  C:`<tr><td>aposta</td><td>esta é a <b>porta de entrada do Mestre</b> (DEC-GAV-02). O cabeçalho "No ar" responde
      "o que está no ar agora" com os controles da sessão; o acervo vem embaixo.</td></tr>
     <tr><td>custo</td><td>o cabeçalho de altura fixa come ~1/3 do painel, e escuridão/névoa aqui encostam
      na spec 07 (são controles de cena ou da barra do canvas?).</td></tr>`,
};
function chrome(){
  document.getElementById('variant').textContent = VAR_LB[variant];
  document.getElementById('role').textContent = isGm()?'papel: Mestre':'papel: jogador (sem a aba)';
  document.getElementById('big').textContent = big?'acervo: campanha (28)':'acervo: mundo (6)';
  document.getElementById('thumb').textContent = hasThumb?'miniatura: fingida':'miniatura: não gerada';
  document.getElementById('state').textContent = stateKind==='empty'?'estado: vazio':'estado: com cenas';
  document.getElementById('legend').innerHTML =
    '<h4>Aba Cenas — rodada 1 · variante '+VAR_LB[variant]+'</h4><table>'
    + VAR_NOTE[variant]
    + '<tr><td>o que já existe</td><td>backend pronto (<b>world:activeScene</b>, GM-only, broadcast global) e um front quase pronto'
    + ' (<b>ScenesSidebar</b>). A spec-filha <b>formaliza e migra</b> — não constrói do zero.</td></tr>'
    + '<tr><td>ações da linha</td><td>só ícone, cada um com title e aria-label: <b>play</b> pôr no ar · <b>olho</b> preparar ·'
    + ' <b>lápis em quadrado</b> editar · <b>nuvem</b> pré-carregar para todos · <b>cópia</b> duplicar · <b>lixeira</b> apagar.'
    + ' Aparecem no hover, no foco de teclado e sempre em toque. O <b>grip</b> à esquerda reordena.</td></tr>'
    + '<tr><td>ativar</td><td>é <b>global e instantâneo</b>: um escritor só, <b>doc:update{active} é bloqueado</b> no servidor.'
    + ' Clique em "Pôr no ar" e leia o aviso — é a <b>Q1</b>.</td></tr>'
    + '<tr><td>preparo</td><td>"Preparar" abre a cena <b>só para você</b> (a proposta Q1c). Exige <b>sceneId</b> na presença'
    + ' (REQ-USR-032/033), previsto e <b>não implementado</b>.</td></tr>'
    + '<tr><td>fora da gaveta</td><td>"Editar" e percepção abrem <b>janela</b> (DEC-GAV-04): grade, fundo, dimensões,'
    + ' escuridão.</td></tr>'
    + '</table>'
    + '<div class="q"><b>Experimente:</b> pôr no ar "Cripta dos Sete" (a mesa vai junto) · preparar a mesma cena e olhe a faixa amarela no mapa ·'
    + ' apagar a cena que está no ar (recusa, <b>Q5</b>) · editar para ver o tamanho do que <b>não</b> cabe em 300px ·'
    + ' desligue a <b>miniatura</b> na variante B.</div>'
    + '<div class="q"><b>Em aberto:</b> Q3 pastas no MVP? · Q4 ordem manual ou alfabética? · Q6 badge só se existir preparo ·'
    + ' Q7 linha do mapa de região · Q8 duplicar · Q9 "3 na cena" não existe enquanto ativar for global.</div>'
    + '<div class="q" style="border:0;padding-top:0">Teclas: <b>1/2/3</b> variante · <b>p</b> papel · <b>a</b> acervo ·'
    + ' <b>m</b> miniatura · <b>v</b> vazio · <b>Esc</b> fecha janela/preparo</div>';
}
document.getElementById('variant').onclick=()=>{ variant = variant==='A'?'B':variant==='B'?'C':'A'; win=null; render(); };
document.getElementById('role').onclick=()=>{ role = isGm()?'player':'gm'; win=null; prepId=null; render(); };
document.getElementById('big').onclick=()=>{ big=!big; q=''; render(); };
document.getElementById('thumb').onclick=()=>{ hasThumb=!hasThumb; render(); };
document.getElementById('state').onclick=()=>{ stateKind = stateKind==='empty'?'full':'empty'; prepId=null; win=null; render(); };
document.addEventListener('keydown',(e)=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  if(e.key==='1'){variant='A';win=null;render();}
  else if(e.key==='2'){variant='B';win=null;render();}
  else if(e.key==='3'){variant='C';win=null;render();}
  else if(e.key==='p') document.getElementById('role').click();
  else if(e.key==='a') document.getElementById('big').click();
  else if(e.key==='m') document.getElementById('thumb').click();
  else if(e.key==='v') document.getElementById('state').click();
  else if(e.key==='Escape'){ if(win){win=null;} else if(prepId){prepId=null;} render(); }
});
render();
</script>
</body>
</html>
