    <!--
  PROTOTYPE — descartável. Rodada 1 do grill da aba NPCs. Não é código de
  produção; não importar nada daqui.

  ════════════════════════════════════════════════════════════════════════════
  POR QUE ESTA ABA EXISTE (e por que ela nasce devendo)
  ════════════════════════════════════════════════════════════════════════════
  A spec 39 (Contatos) tirou "+Novo" e "excluir" da aba do jogador e escreveu a
  dívida com todas as letras (DEC-CTT-01): o cliente fica SEM NENHUMA forma de
  criar ou excluir ator até esta aba existir. A 39 §2.2 também transferiu para
  cá, nominalmente: o diretório completo de não-jogadores, PASTAS, AUTORIA,
  SUBTIPOS e IMPORTAÇÃO.
  Ou seja: esta aba não é "a Contatos do Mestre". É o lugar da autoria.

  ════════════════════════════════════════════════════════════════════════════
  O QUE JÁ VEM DECIDIDO DA 39 (tratei como não-negociável — confira)
  ════════════════════════════════════════════════════════════════════════════
   · CONDIÇÃO por contrato (DEC-CTT-11): cor por tom (verde ajuda / vermelho
     atrapalha / roxo situação), `critical` PREENCHE o chip (não é 4ª cor),
     valor colado ao rótulo em tabular, ajuda em tooltip desenhado, ordem
     crítica→penalidade→situação→benefício, teto 2 + "+N", SEM ÍCONE.
   · SUB-PERSONAGEM encapsulado no dono (DEC-CTT-06) — o corvo Nix aparece
     dentro da Vess, nunca solto. Aqui vale para NPC também.
   · TÍTULO livre sob o nome (DEC-CTT-07). A Q-CTT-05 perguntava se vale para
     não-jogador; este protótipo APOSTA QUE SIM e deixa o Mestre editar aqui.
   · CONHECIMENTO se edita NUM LUGAR SÓ (DEC-CTT-05), a janela "Quem conhece
     quem". Aqui ela é a MESMA janela, alcançável pelo mesmo rodapé fixo; o
     cartão mostra o estado só em LEITURA (✓2 ◐1). Nenhum controle de estado
     no cartão — se isso te incomodar na hora de revelar, é exatamente o
     feedback que a rodada 2 precisa.
   · REDAÇÃO no servidor (REQ-CTT-081..083): esconder no cliente não esconde.

  ════════════════════════════════════════════════════════════════════════════
  AS TRÊS VARIANTES — cada uma aposta em uma coisa diferente
  ════════════════════════════════════════════════════════════════════════════
  A · DIRETÓRIO   — pastas de verdade (documento Folder, servidor), aninhadas,
                    árvore. É o ActorDirectory de hoje, feito direito. Aposta:
                    o Mestre quer um gerenciador de arquivos, e o bestiário
                    inteiro mora aqui dentro.
  B · ELENCO      — organiza por PAPEL NA FICÇÃO: "Em cena" (quem está na cena
                    ativa agora), "Elenco" (recorrentes, com nome), "Avulsos"
                    (bestiário, recolhido, só chega por busca). Pasta vira
                    detalhe secundário. Aposta: durante o jogo o Mestre não
                    quer árvore, quer quem importa agora.
  C · BANCADA     — uma busca só que atravessa MUNDO e COMPÊNDIO. O resultado
                    vem em duas faixas: "no mundo" e "nos compêndios (importar)".
                    Aposta: a pergunta real do Mestre é "me dá um goblin", e
                    ele não quer saber se já está no mundo ou não.
                    (A REQ-CMP-018 já manda o drop de ator de pack importar
                    antes de criar o token — C é levar isso a sério.)

  ════════════════════════════════════════════════════════════════════════════
  O QUE O PROTÓTIPO PÕE NA MESA DE PROPÓSITO (é aqui que quero seu feedback)
  ════════════════════════════════════════════════════════════════════════════
   Q1 — CRIAR: a janela "Novo" oferece TODOS os subtipos do sistema, inclusive
        Personagem — e diz que o Personagem criado aqui vai APARECER NA ABA
        CONTATOS, não nesta lista. É a proposta de pagar a dívida da DEC-CTT-01
        inteira: criar é autoria (é daqui), listar é por plateia (é de lá).
        Alternativa: esta aba só cria não-jogador, e criar PC vira gesto da
        seção Usuários da 37.
   Q2 — ESCALA: ligue "bestiário importado" no switcher. São 492 atores no
        mundo. A variante A vira uma árvore com uma pasta gigante; a B empurra
        para "Avulsos" recolhido; a C dilui na busca. A 39 pôde assumir
        "dezenas" (RNF-CTT-02); aqui não dá.
   Q3 — REVELAR: o cartão só LÊ o estado (✓2 ◐1). Revelar exige abrir a janela.
        É o preço da DEC-CTT-05. Vale a pena?
   Q4 — VIDA: botão "vida" no switcher. Argumento para NÃO mostrar, mais forte
        que o da 39: com token desvinculado (REQ-DOC-033) a vida do ator-base é
        MOLDE, não valor vivo — os 3 goblins na cena têm cada um a sua. Exibir
        "a vida do ator" aqui é exibir um número que não descreve ninguém.
   Q5 — VÍNCULO DO TOKEN: arrastar goblin para o mapa cria token DESVINCULADO
        (cada um com sua vida); arrastar um NPC nomeado cria VINCULADO. O
        protótipo mostra o default vindo do subtipo, com o modificador para
        inverter (Alt). Hoje o código cria sempre vinculado.
   Q6 — EXCLUIR: a janela de exclusão mostra o que vai junto — N tokens em M
        cenas, combate ativo (que RECUSA a exclusão), e o conhecimento que
        será apagado. A REQ-CTT-076 só cobriu o caso espelho (excluir
        personagem); excluir contato não está em spec nenhuma.
   Q7 — PERIGO/VEÍCULO: "Armadilha de Fosso" é subtipo `hazard`. Ator que não é
        gente cabe numa aba chamada "NPCs"? (o trilho da 36 já batizou assim)

  NOTA DE VOCABULÁRIO — o mesmo problema que a aba Combate encontrou: TOKEN
  ainda não tem spec fechada. Aqui a palavra aparece só onde é inevitável
  (contagem de presença no mapa) e a spec vai ter que pendurar isso na spec de
  Token que ainda será escrita.
-->

  <body>
    <div class="header">
      <span class="bolt">⚡</span><span class="world">teste_xande</span
      ><span class="pill">🗺 aha</span>

    </div>
    <div class="legend" id="legend"></div>

    <script>
      /* ================= chassi (spec 36) ================= */
      const ICONS = {
        chat: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
        contacts:
          '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
        combat:
          '<svg class="icon" viewBox="0 0 24 24"><path d="M4 4l11 11M20 4L9 15"/><path d="M14 16l2 2M10 16l-2 2M17 13l3 3-2 2-3-3M7 13l-3 3 2 2 3-3"/></svg>',
        compendium:
          '<svg class="icon" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>',
        npcs: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7z"/><circle cx="12" cy="11" r="2.2"/></svg>',
        scenes:
          '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>',
        settings:
          '<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>',
      };
      const UI_ICON = {
        search:
          '<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
        sheet:
          '<svg class="icon" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
        grid: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',
        plus: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
        trash:
          '<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>',
      };
      const TABS = [
        { id: "chat", label: "Chat", group: "all", badge: "3" },
        { id: "contacts", label: "Contatos", group: "all" },
        { id: "combat", label: "Combate", group: "all" },
        { id: "compendium", label: "Compêndio", group: "all" },
        { id: "npcs", label: "NPCs", group: "gm" },
        { id: "scenes", label: "Cenas", group: "gm" },
        { id: "settings", label: "Configurações", group: "all", foot: true },
      ];
      const TITLE = {
        chat: "Chat",
        contacts: "Contatos",
        combat: "Combate",
        compendium: "Compêndio",
        npcs: "NPCs",
        scenes: "Cenas",
        settings: "Configurações",
      };
      const OTHER = {
        chat: `<div class="row"><span class="name">Fofurinha</span><span class="sub2">21:14</span></div>`,
        contacts: `<div class="row"><span class="name">Tobias</span><span class="sub2">você</span></div>
    <div class="row"><span class="name">Fofurinha</span><span class="sub2">na mesa</span></div>
    <p class="hint">A aba do jogador. Não cria nem exclui ator (DEC-CTT-01) —<br/>é esta aba aqui que paga essa dívida.</p>`,
        combat: `<p class="empty">Nenhum combate ativo.</p>`,
        compendium: `<div class="row"><span class="name">Bestiário 1</span><span class="sub2">492</span></div>
    <div class="row"><span class="name">Talentos</span><span class="sub2">1.812</span></div>`,
        scenes: `<div class="row"><span style="color:var(--ok)">●</span><span class="name">Fortaleza</span><span class="sub2">ativa</span></div>`,
        settings: `<div class="row"><span class="name">Minhas preferências</span><span class="sub2">›</span></div>`,
      };

      /* ================= condições (contrato herdado da 39) ================= */
      const COND = {
        unconscious: {
          lb: "Inconsciente",
          tone: "harm",
          critical: true,
          help: "Caído e sem agir; não percebe o que acontece em volta.",
        },
        frightened: {
          lb: "Amedrontado",
          valued: true,
          tone: "harm",
          help: "Penalidade igual ao valor em testes e CDs. Cai 1 ao fim do seu turno.",
        },
        wounded: {
          lb: "Ferido",
          valued: true,
          tone: "harm",
          help: "Se cair de novo, você começa a Morrer num grau pior.",
        },
        invisible: {
          lb: "Invisível",
          tone: "special",
          help: "Indetectado por quem depende da visão, até ser localizado.",
        },
        hidden: {
          lb: "Escondido",
          tone: "special",
          help: "Sabem mais ou menos onde você está, mas não conseguem te ver.",
        },
        quickened: {
          lb: "Acelerado",
          tone: "benefit",
          help: "Uma ação extra por turno, limitada ao que a fonte permite.",
        },
        slowed: {
          lb: "Lento",
          valued: true,
          tone: "harm",
          help: "Começa o turno com menos ações, igual ao valor.",
        },
      };
      const TONE_LB = { harm: "penalidade", benefit: "benefício", special: "situação" };
      const ORDER = { crit: 0, harm: 1, special: 2, benefit: 3 };
      const condRank = (c) => {
        const d = COND[c.slug] || {};
        return d.critical ? ORDER.crit : ORDER[d.tone || "special"];
      };
      const sortConds = (list) =>
        [...list].sort(
          (a, b) =>
            condRank(a) - condRank(b) ||
            (COND[a.slug]?.lb || a.slug).localeCompare(COND[b.slug]?.lb || b.slug, "pt-BR"),
        );

      /* ================= mundo mock ================= */
      /* subtipos declarados pelo sistema (systems/pf2e — REQ-DOC-023) */
      const SUBTYPES = [
        { id: "character", lb: "Personagem", pc: true },
        { id: "npc", lb: "NPC" },
        { id: "hazard", lb: "Perigo" },

      /* compêndios (variante C) */

      /* ================= estado ================= */
      const url = new URL(location);
      let variant = (url.searchParams.get("v") || "A").toUpperCase();

      let win = null; /* null | "new" | "delete" | "matrix" | "sheet" */

        "f-vila": true,
        "f-corvo": true,
        "f-best": true,
        "f-gob": true,
        "f-mortos": false,
      };
      let bandOpen = { world: true, pack: true, loose: false };
      let expandConds = {};
      let dragLinked = null;

      /* conhecimento: regra geral + exceções (mesmo modelo da 39) */
      const rule = {};
      const ex = {};
      function seedKnowledge() {
        allNpcs(true).forEach((n) => {
          /* a regra geral é o estado mais comum entre os personagens;
             o que destoar dela vira exceção (mesmo modelo da 39) */
          const vals = PCS.map((p) => (n.know ? (n.know[p.id] ?? 0) : 0));
          const tally = [0, 0, 0];
          vals.forEach((v) => tally[v]++);
          rule[n.id] = tally.indexOf(Math.max(...tally));
          ex[n.id] = {};
          PCS.forEach((p, i) => {
            if (vals[i] !== rule[n.id]) ex[n.id][p.id] = vals[i];
          });
        });
      }
      const know = (n, p) => (ex[n] && p in ex[n] ? ex[n][p] : (rule[n] ?? 0));
      const isEx = (n, p) => !!(ex[n] && p in ex[n]);
      function setKnow(n, p, v) {
        if (v === (rule[n] ?? 0)) delete ex[n][p];
        else ex[n][p] = v;
      }

      /* ================= helpers ================= */
      function allNpcs(includeFlood) {
        return includeFlood || flood ? [...NPCS, ...floodActors()] : [...NPCS];
      }
      function visible() {
        if (empty) return [];
        const list = allNpcs();
        if (!query.trim()) return list;
        const q = query.trim().toLowerCase();
        return list.filter(
          (n) => n.name.toLowerCase().includes(q) || (n.title || "").toLowerCase().includes(q),
        );
      }
      const byName = (a, b) => a.name.localeCompare(b.name, "pt-BR");
      const tokCount = (n) => Object.values(n.tok || {}).reduce((a, b) => a + b, 0);
      const initials = (s) =>
        s
          .split(" ")
          .filter((w) => w.length > 2)
          .slice(0, 2)
          .map((w) => w[0])
          .join("")
          .toUpperCase() || s[0].toUpperCase();

      function knowSummary(n) {
        let k2 = 0,
          k1 = 0;
        PCS.forEach((p) => {
          const v = know(n.id, p.id);
          if (v === 2) k2++;
          else if (v === 1) k1++;
        });
        const k0 = PCS.length - k2 - k1;
        const help = encodeURIComponent(
          JSON.stringify({
            t: "Quem conhece " + n.name,
            h:
              `<b>${k2}</b> conhece(m) · <b>${k1}</b> entreviu/entreviram · <b>${k0}</b> não vê(em).<br><br>` +
              `Aqui é <b>leitura</b>. Mudar isso é só na janela <b>Quem conhece quem</b>, pelo rodapé — é a DEC-CTT-05 da spec 39.`,
            tone: "conhecimento (par contato × personagem)",
          }),
        );
        return `<span class="know" data-help="${help}"><span class="k2">✓${k2}</span> <span class="k1">◐${k1}</span> <span class="k0">·${k0}</span></span>`;
      }

      function condsHtml(n) {
        if (!n.conds || !n.conds.length) return "";
        const sorted = sortConds(n.conds);
        const expandedNow = !!expandConds[n.id];
        const shown = expandedNow ? sorted : sorted.slice(0, 2);
        const rest = sorted.length - shown.length;
        const chips = shown
          .map((c) => {
            const d = COND[c.slug] || {};
            const tone = d.critical ? "crit" : d.tone || "special";
            const lb = d.lb || c.slug;
            const val = c.v != null ? ` <span class="v">${c.v}</span>` : "";
            const help = encodeURIComponent(
              JSON.stringify({
                t: lb + (c.v != null ? " " + c.v : ""),
                h: d.help || "",
                tone: (d.critical ? "crítica · " : "") + (TONE_LB[d.tone] || "situação"),
              }),
            );
            return `<span class="chip ${tone}" data-help="${help}">${lb}${val}</span>`;
          })
          .join("");
        const more = rest > 0 ? `<span class="chip more" data-more="${n.id}">+${rest}</span>` : "";
        return `<div class="conds">${chips}${more}</div>`;
      }

      function actorRow(n, opts = {}) {
        const sub = n.type === "hazard" ? "hz" : "";
        const t = n.title;
        const titleLine =
          editTitle === n.id
            ? `<div class="ttl"><input id="titleinput" value="${t || ""}" placeholder="um título para ${n.name}"/></div>`
            : t
              ? `<div class="ttl"><span>${t}</span><span class="pen" data-title="${n.id}">✎</span></div>`

          JSON.stringify({
            t: "Presença no mapa",

            tone: n.link

        const meta = `<span class="meta hide-on-hover">

        ${tk ? `<span class="tok" data-help="${tkHelp}">⬡${tk}</span>` : ""}

        const tools = `<span class="tools">

        <button data-move="${n.id}" title="mover de pasta">🗀</button>

        ${meta}${tools}
      </div>${condsHtml(n)}${subs}`;
      }

      /* ================= variante A — diretório ================= */
      function folderNode(f, list, depth) {
        const kids = FOLDERS.filter((x) => x.parent === f.id);
        const mine = list.filter((n) => n.folder === f.id).sort(byName);
        const deepCount =
          mine.length + kids.reduce((a, k) => a + list.filter((n) => n.folder === k.id).length, 0);
        if (query.trim() && deepCount === 0) return "";
        const isOpen = expanded[f.id] || !!query.trim();
        const inner = isOpen
          ? `<div class="kids">${kids.map((k) => folderNode(k, list, depth + 1)).join("")}${mine
              .map((n) => actorRow(n))
              .join("")}</div>`
          : "";
        return `<div class="fold" data-fold="${f.id}">
        <span class="chev">${isOpen ? "▾" : "▸"}</span>
        <span class="fn">${f.name}</span>
        <span class="cnt">${deepCount}</span>
        <span class="tools"><button data-newin="${f.id}" title="novo ator aqui">＋</button><button title="renomear">✎</button><button title="excluir pasta">✕</button></span>
      </div>${inner}`;
      }
      function bodyA() {
        const list = visible();
        if (!list.length) return emptyState();
        const roots = FOLDERS.filter((f) => !f.parent);
        const loose = list.filter((n) => !n.folder).sort(byName);
        return (
          roots.map((f) => folderNode(f, list, 0)).join("") +
          (loose.length
            ? `<div class="sec"><span class="lbl">sem pasta</span><span class="cnt">${loose.length}</span><span class="line"></span></div>${loose
                .map((n) => actorRow(n))
                .join("")}`
            : "")
        );
      }

      /* ================= variante B — elenco ================= */
      function bodyB() {
        const list = visible();
        if (!list.length) return emptyState();
        const inScene = list.filter((n) => tokCount(n) > 0).sort(byName);
        const cast = list.filter((n) => n.cast && tokCount(n) === 0).sort(byName);
        const loose = list.filter((n) => !n.cast && tokCount(n) === 0).sort(byName);
        const looseOpen = bandOpen.loose || !!query.trim();
        const sec = (id, lbl, arr, clickable) =>
          arr.length
            ? `<div class="sec ${clickable ? "click" : ""}" ${clickable ? `data-band="${id}"` : ""}>
          ${clickable ? `<span class="chev">${looseOpen ? "▾" : "▸"}</span>` : ""}
          <span class="lbl">${lbl}</span><span class="cnt">${arr.length}</span><span class="line"></span></div>`
            : "";
        return (
          sec("scene", "em cena · Fortaleza", inScene) +
          inScene.map((n) => actorRow(n)).join("") +
          sec("cast", "elenco", cast) +
          cast.map((n) => actorRow(n)).join("") +
          sec("loose", "avulsos", loose, true) +
          (looseOpen ? loose.map((n) => actorRow(n)).join("") : "") +
          (loose.length && !looseOpen
            ? `<p class="hint">${loose.length} atores sem papel na história.<br/>Abra, ou ache pela busca.</p>`
            : "")
        );
      }

      /* ================= variante C — bancada ================= */
      function bodyC() {
        const list = visible().sort(byName);
        const q = query.trim().toLowerCase();
        const packHits = q
          ? PACK.filter((p) => p.name.toLowerCase().includes(q))
          : PACK.slice(0, 3);
        const worldPart = list.length

          : `<p class="hint">${
              empty ? "Nenhum ator no mundo ainda." : "Nada no mundo com esse nome."
            }<br/>Olhe a faixa de compêndio abaixo.</p>`;
        const packPart = packHits
          .map(
            (p) => `<div class="act frompack" draggable="true">

        return `<div class="band"><span class="lbl">no mundo</span><span class="cnt">${
          empty ? 0 : allNpcs().length

      }

      /* ================= janelas (spec 11) ================= */
      function newWinHtml() {
        const st = SUBTYPES.find((s) => s.id === newType);
        return `<div class="win" style="width:480px;left:calc(50% - 240px)">
      <div class="wh">${UI_ICON.plus} Novo ator<button class="x" data-winclose>✕</button></div>

            (s) =>
              `<button class="${s.id === newType ? "on" : ""}" data-st="${s.id}">${s.lb}</button>`,
          ).join("")}</div>
        </div>
        <div class="field"><label>Nome</label><input placeholder="${
          st.pc ? "nome do personagem" : "nome do ator"
        }" /></div>
        <div class="field"><label>Pasta</label>
          <select>${["(sem pasta)", ...FOLDERS.map((f) => f.name)]
            .map((n) => `<option>${n}</option>`)
            .join("")}</select></div>
        ${
          st.pc
            ? `<div class="warnbox"><b>Q1 — a proposta que este protótipo faz.</b><br/>
        Personagem é criado <b>aqui</b> (autoria), mas aparece na aba <b>Contatos</b>, não nesta lista:
        criar é desta aba, listar é por plateia. É assim que a dívida da DEC-CTT-01 é paga por inteiro —
        senão criar um PC continua não tendo endereço em lugar nenhum do app.<br/><br/>
        <b>Alternativa a discutir:</b> esta aba só cria não-jogador, e criar PC vira gesto da
        seção <b>Usuários</b> da spec 37 (o PC nasce colado ao usuário dele).</div>`
            : `<div class="note">Os tipos vêm do <b>sistema ativo</b> (pf2e), não desta aba —
        mesmo princípio da DEC-CTT-11: a UI pinta o que o sistema declarou.
        <br/><b>Q7:</b> "Perigo" e "Veículo" não são gente. Cabem numa aba chamada <b>NPCs</b>?</div>`
        }
      </div>
      <div class="wf"><button class="btn-ghost" data-winclose>Cancelar</button>
        <button class="hbtn pri">Criar</button></div></div>`;
      }

      function deleteWinHtml() {
        const n = allNpcs(true).find((x) => x.id === delTarget);
        if (!n) return "";
        const tk = tokCount(n);
        const scenes = Object.entries(n.tok || {});
        let k2 = 0,
          k1 = 0;
        PCS.forEach((p) => {
          const v = know(n.id, p.id);
          if (v === 2) k2++;
          else if (v === 1) k1++;
        });
        return `<div class="win danger" style="width:500px;left:calc(50% - 250px)">
      <div class="wh">${UI_ICON.trash} Excluir <b style="color:var(--text)">&nbsp;${n.name}</b>?
        <button class="x" data-winclose>✕</button></div>
      <div class="wb">
        <b>O que vai junto:</b>
        <ul class="conseq">
          <li><i>⬡</i><span>${
            tk
              ? `<b>${tk}</b> presença(s) no mapa, em ${scenes.map(([s, c]) => `${s} (${c})`).join(", ")} — somem junto.`
              : "nenhuma presença em cena."
          }</span></li>
          <li><i>◐</i><span>${
            k2 + k1
              ? `<b>${k2}</b> personagem(ns) conhece(m) e <b>${k1}</b> entreviu/entreviram — o conhecimento é apagado com o ator.`
              : "ninguém conhece este ator; nada de conhecimento a apagar."
          }</span></li>
          <li><i>▤</i><span>a ficha e os itens embutidos vão junto, sem lixeira.</span></li>
        </ul>
        ${
          n.inCombat
            ? `<div class="stopbox"><b>Recusado:</b> este ator está em um <b>combate ativo</b>.
          Encerre o combate, ou tire-o dele, antes de excluir.<br/>
          <b>Q6</b> — a REQ-CTT-076 só cobriu o caso espelho (excluir personagem apaga as exceções que o citam).
          Excluir <i>contato</i> não está em spec nenhuma: cascata silenciosa, recusa, ou aviso?</div>`
            : `<div class="warnbox"><b>Q6</b> — a REQ-CTT-076 só cobriu o caso espelho (excluir personagem
          apaga as exceções que o citam). Excluir <i>contato</i> não está em spec nenhuma.</div>`
        }
      </div>
      <div class="wf"><button class="btn-ghost" data-winclose>Cancelar</button>
        <button class="btn-danger" ${n.inCombat ? "disabled" : ""}>Excluir</button></div></div>`;
      }

      const ST = ["oculto", "entrevisto", "conhecido"];
      const SYM = ["·", "◐", "✓"];
      function matrixHtml() {
        const list = allNpcs()
          .filter((n) => !n.flood)
          .sort(byName);
        return `<div class="win"><div class="wh">${UI_ICON.grid} Quem conhece quem
      <button class="x" data-winclose>✕</button></div>
    <div class="wb">
      A <b>mesma janela</b> da aba Contatos (spec 39, REQ-CTT-061). Ela é alcançável pelas duas abas
      porque o conhecimento se edita <b>num lugar só</b> — DEC-CTT-05.
      <div class="keys"><span><i class="k0">·</i>oculto</span><span><i class="k1">◐</i>entrevisto</span>
        <span><i class="k2">✓</i>conhecido</span><span><i>__</i>sublinhado = exceção</span></div>
      <table class="matrix"><thead><tr><th>contato</th>
        ${PCS.map((p) => `<th data-col="${p.id}">${p.name}<small>coluna inteira</small></th>`).join("")}
      </tr></thead><tbody>
      ${list
        .map(
          (n) => `<tr>
        <td class="nm" data-rowcycle="${n.id}">${n.name}<small>regra geral: ${ST[rule[n.id] ?? 0]}</small></td>
        ${PCS.map((p) => {
          const v = know(n.id, p.id);
          return `<td><button class="cell k${v} ${isEx(n.id, p.id) ? "ex" : ""}" data-mx="${n.id}::${p.id}">${SYM[v]}</button></td>`;
        }).join("")}
      </tr>`,
        )
        .join("")}
      </tbody></table>
      <div class="note"><b>Q3</b> — na aba NPCs o cartão só <b>lê</b> o estado (✓2 ◐1). Revelar exige vir até aqui.
        É o preço da DEC-CTT-05: um lugar só de edição. O gesto real do Mestre é
        "criei o NPC → a mesa encontrou → revelo" — vale a pena o desvio?</div>
    </div></div>`;
      }

      function sheetWinHtml() {
        const n = allNpcs(true).find((x) => x.id === win.replace("sheet:", ""));
        return `<div class="win" style="width:460px;left:calc(50% - 230px)">
      <div class="wh">${UI_ICON.sheet} Ficha — ${n ? n.name : "?"}<button class="x" data-winclose>✕</button></div>
      <div class="wb">A ficha abre <b>fora da gaveta</b>, como janela do window manager (spec 11) —
      §7.5 do contrato da spec-mãe. Duplo-clique na linha faz o mesmo (DEC-CTT-13).</div></div>`;
      }

      function winHtml() {
        if (!win) return "";
        if (win === "new") return newWinHtml();
        if (win === "delete") return deleteWinHtml();
        if (win === "matrix") return matrixHtml();
        if (win.startsWith("sheet:")) return sheetWinHtml();
        return "";
      }

      /* ================= render ================= */
      function npcsHead() {
        return `<div class="panel-head">
      <div class="search"><span class="mag">${UI_ICON.search}</span>
        <input id="q" placeholder="Procurar ator" value="${query}"/></div>
      <button class="hbtn pri" id="new" title="novo ator ou pasta">${UI_ICON.plus}</button>
    </div>`;
      }
      function tabButton(t) {
        const badge = t.badge ? `<span class="badge">${t.badge}</span>` : "";
        return `<button class="tabbtn ${active === t.id && open ? "is-active" : ""}" data-tab="${t.id}" aria-label="${t.label}">
      ${ICONS[t.id]}${badge}<span class="tip">${t.label}</span></button>`;
      }
      function render() {
        const isGm = role === "gm";
        if (!isGm && ["npcs", "scenes"].includes(active)) active = "contacts";
        if (!isGm) win = null;
        const all = TABS.filter((t) => t.group === "all" && !t.foot),
          gms = TABS.filter((t) => t.group === "gm" && isGm),
          foot = TABS.filter((t) => t.foot);

        const isNpcs = active === "npcs";
        const head = isNpcs
          ? npcsHead()
          : `<div class="panel-head"><span class="panel-title">${TITLE[active]}</span></div>`;
        const body = isNpcs
          ? `<div class="panel-body">${variant === "A" ? bodyA() : variant === "B" ? bodyB() : bodyC()}</div>`
          : `<div class="panel-body">${OTHER[active] || ""}</div>`;
        /* rodapé fixo — o mesmo da aba Contatos (DEC-CTT-05/REQ-CTT-060) */
        const footer = isNpcs
          ? `<div class="panel-foot"><button class="hbtn wide" id="matrix">${UI_ICON.grid} Quem conhece quem</button></div>`
          : "";

        document.getElementById("root").innerHTML = `
      <div class="${open ? "is-open" : ""}"><aside class="sidebar">
        <nav class="tabs">
          <div class="grp">${all.map(tabButton).join("")}</div>
          ${gms.length ? `<div class="grp gm">${gms.map(tabButton).join("")}</div>` : ""}
          <div class="foot">${foot.map(tabButton).join("")}</div>
        </nav>
        <div class="panel">${head}${body}${footer}</div>
      </aside></div>`;
        document.getElementById("float").innerHTML = winHtml();

        const who = document.getElementById("who");
        who.className = isGm ? "who" : "who player";
        who.innerHTML = isGm
          ? '<b>●</b> Gamemaster · <span style="color:var(--muted)">Mestre</span>'
          : '<b>●</b> Alexandre · <span style="color:var(--muted)">Jogador (Fofurinha) — não vê esta aba</span>';

        const dl = document.getElementById("droplink");
        dl.textContent = dragLinked
          ? dragLinked.link
            ? `${dragLinked.name}: VINCULADO (um só; a vida é a do ator)`
            : `${dragLinked.name}: DESVINCULADO (cada um com sua vida)`
          : "goblin: desvinculado · Aldric: vinculado — Alt inverte (Q5)";

        hideTip();
        wire();
        paintSwitcher();
        const u = new URL(location);
        u.searchParams.set("v", variant);
        u.searchParams.set("role", role);
        u.searchParams.set("flood", flood ? "1" : "0");
        u.searchParams.set("hp", showHp ? "1" : "0");
        u.searchParams.set("state", empty ? "empty" : "full");
        history.replaceState(null, "", u);
      }

      /* ================= tooltip ================= */
      const tipEl = () => document.getElementById("tip");
      function showTip(el) {
        let d;
        try {
          d = JSON.parse(decodeURIComponent(el.dataset.help));
        } catch {
          return;
        }
        const t = tipEl();
        t.innerHTML = `<b>${d.t}</b>${d.h || '<i style="color:var(--subtle)">sem texto de ajuda declarado</i>'}<span class="tone">${d.tone}</span>`;
        t.style.display = "block";
        const r = el.getBoundingClientRect(),
          tr = t.getBoundingClientRect();
        t.style.left = Math.max(8, r.left - tr.width - 10) + "px";
        t.style.top = Math.max(8, r.top - 4) + "px";
      }
      function hideTip() {
        const t = tipEl();
        if (t) t.style.display = "none";
      }

      /* ================= eventos ================= */
      function wire() {
        const root = document.getElementById("root"),
          float = document.getElementById("float");

        root.querySelectorAll("[data-tab]").forEach(
          (b) =>
            (b.onclick = () => {
              const id = b.dataset.tab;
              if (open && active === id) open = false;
              else {
                active = id;
                open = true;
              }
              editTitle = null;
              render();
            }),
        );

        root.querySelectorAll("[data-fold]").forEach(
          (f) =>
            (f.onclick = (e) => {
              if (e.target.closest("button")) return;
              const id = f.dataset.fold;
              expanded[id] = !expanded[id];
              render();
            }),
        );
        root.querySelectorAll("[data-band]").forEach(
          (s) =>
            (s.onclick = () => {
              bandOpen.loose = !bandOpen.loose;
              render();
            }),
        );
        root.querySelectorAll("[data-more]").forEach(
          (m) =>
            (m.onclick = (e) => {
              e.stopPropagation();
              expandConds[m.dataset.more] = !expandConds[m.dataset.more];
              render();
            }),
        );

        root.querySelectorAll("[data-act]").forEach((a) => {
          a.onclick = (e) => {
            if (e.target.closest("button") || e.target.closest(".pen")) return;
            sel = a.dataset.act;
            render();
          };
          a.ondblclick = () => {
            win = "sheet:" + a.dataset.act;
            render();
          };
          a.ondragstart = () => {
            const n = allNpcs(true).find((x) => x.id === a.dataset.act);
            dragLinked = n;
            const dl = document.getElementById("droplink");
            if (dl && n)
              dl.textContent = n.link
                ? `${n.name}: VINCULADO (um só; a vida é a do ator)`
                : `${n.name}: DESVINCULADO (cada um com sua vida)`;
          };
          a.ondragend = () => {
            dragLinked = null;
            render();
          };
        });

        root.querySelectorAll("[data-title]").forEach(
          (p) =>
            (p.onclick = (e) => {
              e.stopPropagation();
              editTitle = p.dataset.title;
              render();
              const i = document.getElementById("titleinput");
              if (i) {
                i.focus();
                i.select();
              }
            }),
        );
        const ti = document.getElementById("titleinput");
        if (ti)
          ti.onkeydown = (e) => {
            if (e.key === "Enter") {
              const n = allNpcs(true).find((x) => x.id === editTitle);
              const real = NPCS.find((x) => x.id === editTitle);
              if (real) real.title = ti.value.trim();
              else if (n) n.title = ti.value.trim();
              editTitle = null;
              render();
            }
            if (e.key === "Escape") {
              editTitle = null;
              render();
            }
          };

        root.querySelectorAll("[data-sheet]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              win = "sheet:" + b.dataset.sheet;
              render();
            }),
        );
        root.querySelectorAll("[data-del]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              delTarget = b.dataset.del;
              win = "delete";
              render();
            }),
        );
        root.querySelectorAll("[data-newin]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              win = "new";
              render();
            }),
        );
        const nb = document.getElementById("new");
        if (nb)
          nb.onclick = () => {
            win = "new";
            render();
          };
        const ne = document.getElementById("newempty");
        if (ne)
          ne.onclick = () => {
            win = "new";
            render();
          };
        const mx = document.getElementById("matrix");
        if (mx)
          mx.onclick = () => {
            win = "matrix";
            render();
          };

        float.querySelectorAll("[data-winclose]").forEach(
          (b) =>
            (b.onclick = () => {
              win = null;
              render();
            }),
        );
        float.querySelectorAll("[data-st]").forEach(
          (b) =>
            (b.onclick = () => {
              newType = b.dataset.st;
              render();
            }),
        );
        float.querySelectorAll("[data-mx]").forEach(
          (b) =>
            (b.onclick = () => {
              const [npc, pc] = b.dataset.mx.split("::");
              setKnow(npc, pc, (know(npc, pc) + 1) % 3);
              render();
            }),
        );
        float.querySelectorAll("[data-rowcycle]").forEach(
          (td) =>
            (td.onclick = () => {
              const npc = td.dataset.rowcycle;
              rule[npc] = ((rule[npc] ?? 0) + 1) % 3;
              ex[npc] = {};
              render();
            }),
        );
        float.querySelectorAll("[data-col]").forEach(
          (th) =>
            (th.onclick = () => {
              const pc = th.dataset.col;
              const list = allNpcs().filter((n) => !n.flood);
              const vals = list.map((n) => know(n.id, pc));
              const uniform = vals.every((v) => v === vals[0]) ? vals[0] : -1;
              const next = uniform === -1 ? 2 : (uniform + 1) % 3;
              list.forEach((n) => setKnow(n.id, pc, next));
              render();
            }),
        );

        document.querySelectorAll("[data-help]").forEach((el) => {
          el.onmouseenter = () => showTip(el);
          el.onmouseleave = hideTip;
        });

        const q = document.getElementById("q");
        if (q)
          q.oninput = () => {
            query = q.value;
            render();
            const el = document.getElementById("q");
            if (el) {
              el.focus();
              el.setSelectionRange(query.length, query.length);
            }
          };
      }

      /* ================= switcher / legenda ================= */
      const VAR_LB = {
        A: "A · diretório (pastas)",
        B: "B · elenco (ficção)",
        C: "C · bancada (mundo+pack)",
      };
      const VAR_NOTE = {
        A: `<tr><td>aposta</td><td><b>árvore de pastas de verdade</b> (documento Folder, servidor, aninhada).
          É o ActorDirectory de hoje feito direito. O bestiário inteiro mora aqui.</td></tr>
        <tr><td>custo</td><td>com 492 atores vira gerenciador de arquivos no meio da sessão — ligue <b>bestiário</b>.</td></tr>`,
        B: `<tr><td>aposta</td><td>organiza por <b>papel na ficção</b>: em cena agora · elenco recorrente ·
          avulsos (recolhido, só por busca). Pasta vira detalhe.</td></tr>
        <tr><td>custo</td><td>"elenco" e "avulso" são julgamento de quem escreve, não dado. Quem marca?</td></tr>`,
        C: `<tr><td>aposta</td><td>uma busca só atravessa <b>mundo e compêndio</b>. A pergunta do Mestre é
          "me dá um goblin" — não "já importei?".</td></tr>
        <tr><td>custo</td><td>invade a aba Compêndio (spec 16) e cria dois lugares de importar.</td></tr>`,
      };
      function paintSwitcher() {
        document.getElementById("variant").textContent = VAR_LB[variant];
        document.getElementById("role").textContent =
          role === "gm" ? "ver como jogador" : "ver como Mestre";
        document.getElementById("bestiary").textContent = flood
          ? "bestiário: importado (36)"
          : "bestiário: mundo enxuto";
        document.getElementById("hp").textContent = showHp ? "vida: mostrando" : "vida: oculta";
        document.getElementById("state").textContent = empty
          ? "estado: vazio"
          : "estado: com conteúdo";

        document.getElementById("legend").innerHTML = `
      <h4>Aba NPCs — rodada 1 · variante ${VAR_LB[variant]}</h4>
      <table>
        ${VAR_NOTE[variant]}
        <tr><td>o que é só daqui</td><td><b>criar · excluir · pastas · subtipos · importar</b> — a 39 §2.2
          transferiu tudo isso para cá, e a DEC-CTT-01 deixou o cliente sem criar/excluir até esta aba existir.</td></tr>
        <tr><td>conhecimento</td><td>no cartão é <b>leitura</b> (<span style="color:#2a8">✓</span>conhecem
          <span style="color:#a80">◐</span>entreviram <span style="color:#888">·</span>não veem).
          Editar só no rodapé — DEC-CTT-05.</td></tr>
        <tr><td>condição</td><td><span class="sw" style="background:#ff5c5c"></span>penalidade
          <span class="sw" style="background:#3ddc84"></span>benefício
          <span class="sw" style="background:#b98cff"></span>situação · preenchido = tira da cena</td></tr>
        <tr><td>⬡ n</td><td>presenças no mapa. Passe o mouse: mostra em que cena, e se o arraste
          nasce vinculado ou não (<b>Q5</b>).</td></tr>
      </table>
      <div class="q"><b>experimente:</b> ＋ no cabeçalho → escolha <b>Personagem</b> e leia a proposta da <b>Q1</b> ·
        ✕ no <b>Goblin Guerreiro</b> → exclusão <b>recusada</b> por combate ativo (<b>Q6</b>) ·
        arraste o goblin e depois o Aldric para o mapa e veja o vínculo mudar (<b>Q5</b>) ·
        ligue <b>vida</b> (<b>Q4</b>) e <b>bestiário</b> (<b>Q2</b>) · ✎ edita o título de um NPC (<b>Q-CTT-05</b>).</div>
      <div class="q" style="border:0;padding-top:.3rem;color:#666">teclas: <b>1/2/3</b> variante ·
        <b>p</b> papel · <b>b</b> bestiário · <b>h</b> vida · <b>v</b> vazio</div>`;
      }

      document.getElementById("variant").onclick = () => {
        variant = variant === "A" ? "B" : variant === "B" ? "C" : "A";
        win = null;
        render();
      };
      document.getElementById("role").onclick = () => {
        role = role === "gm" ? "player" : "gm";
        win = null;
        render();
      };
      document.getElementById("bestiary").onclick = () => {
        flood = !flood;
        seedKnowledge();
        render();
      };
      document.getElementById("hp").onclick = () => {
        showHp = !showHp;
        render();
      };
      document.getElementById("state").onclick = () => {
        empty = !empty;
        render();
      };

      document.addEventListener("keydown", (e) => {
        if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
        if (e.key === "1") variant = "A";
        if (e.key === "2") variant = "B";
        if (e.key === "3") variant = "C";
        if (e.key === "p") role = role === "gm" ? "player" : "gm";
        if (e.key === "b") {
          flood = !flood;
          seedKnowledge();
        }
        if (e.key === "h") showHp = !showHp;
        if (e.key === "v") empty = !empty;
        if (["1", "2", "3", "p", "b", "h", "v"].includes(e.key)) {
          if (["1", "2", "3", "p"].includes(e.key)) win = null;
          render();
        }
        if (e.key === "Escape" && win) {
          win = null;
          render();
        }
      });

      seedKnowledge();
      render();
    </script>
  </body>
</html>
