    <!--
  PROTOTYPE — descartável. Rodada 3 do grill. Não é código de produção.
  Rodada 1 (três variantes) e rodada 2 (diretório) estão no histórico do arquivo.

  ════════════════════════════════════════════════════════════════════════════
  DECIDIDO NA RODADA 1 (2026-08-16)
  ════════════════════════════════════════════════════════════════════════════
   1. DIRETÓRIO é o desenho, com o Mestre CRIANDO pastas e podendo FIXÁ-LAS no topo.
   2. MOVER ATOR por arraste E pelo botão de pasta — as duas formas.
   3. PERSONAGEM NÃO NASCE AQUI. "A aba é de NPC, ou seja, personagens NÃO
      jogáveis." Personagem nasce colado ao player: todo player criado nasce com
      um personagem em branco. → emenda na 37 (Usuários) e na 05.
   4. VEÍCULO SAIU. Ver o item 1 da rodada 3: ele nunca existiu.
   5. CRIAR NPC tem dois caminhos: do bestiário (browser aqui) ou do zero.
   6. VIDA NÃO APARECE nesta aba.
   7. Ficha de NPC será muito mais maleável que a de personagem, e ganha SPEC
      PRÓPRIA. Esta spec não define ficha — só abre a que a spec dela definir.

  ════════════════════════════════════════════════════════════════════════════
  DECIDIDO NA RODADA 2 (2026-08-16)
  ════════════════════════════════════════════════════════════════════════════
   1. VEÍCULO NÃO EXISTE — não ocupa eixo nenhum, não é subtipo cortado, é coisa
      que o Fusion não tem. Confirmado no código: systems/pf2e/src/index.ts:71
      declara Actor: ["character","npc","hazard","loot","familiar"]. "vehicle"
      não aparece em lugar nenhum do repo; foi invenção do protótipo da rodada 1.
      → A janela de criação oferece NPC e Perigo. `familiar` nasce colado a um dono
        (DEC-CTT-06), e `loot` é assunto do baú (item 3).
   2. "TIPO DE NPC" É PRESET. Mercador, chefe, montaria pré-preenchem a ficha na
      criação e NÃO viram capacidade gravada no ator. Os presets AINDA NÃO EXISTEM,
      mas vão existir — a spec fixa o conceito e o ponto de extensão, não o catálogo.
      → Consequência que o protótipo passou a respeitar: o preset SOME depois de
        criar. Não há etiqueta de "mercador" na linha, porque não há nada gravado
        para etiquetar. Só aparece na janela de criação.
   3. BAÚ NÃO É ATOR. "É uma ferramenta para ajudar na agilidade do GM narrar."
      → O botão põe um baú direto na cena e ele NUNCA aparece no diretório.
      → Fica pendurado: o pf2e declara o subtipo `loot`, que é exatamente o
        recipiente. Se o baú não é ator, `loot` fica sem uso — ou o baú usa `loot`
        por baixo sem nunca ser listado. Onde vive o conteúdo do baú é assunto da
        spec de Token/Cenas, não desta.
   4. NOVO — ATITUDE. Cada NPC pode ter uma atitude diante dos jogadores:
      INIMIGO · NEUTRO · ALIADO. É configuração para a PARTY INTEIRA, não por
      personagem. Atributo simples; só importa de verdade mais para a frente.
      → O contraste que vale registrar na spec: CONHECIMENTO é por par
        contato × personagem (DEC-CTT-03), ATITUDE é da party toda. Duas
        granularidades diferentes de propósito, e a spec tem que dizer por quê.
      → No protótipo: marca à esquerda dos números, sempre visível, que CICLA no
        clique (aliado → neutro → inimigo), como a célula da matriz da 39.
        Perigo não tem atitude — a marca simplesmente não aparece.
   5. SEM EMOJI. Todo ícone desta tela é desenhado. Era regra do projeto desde a
      DEC-ACH-04 (spec 38): "emoji muda de desenho e de cor em cada sistema
      operacional e não acompanha o tema". O protótipo estava violando em nove
      lugares (baú, pastas, ficha, lápis, ✕, estrela, hexágono, chevrons).

  ════════════════════════════════════════════════════════════════════════════
  HERDADO DA SPEC 39 (não se rediscute)
  ════════════════════════════════════════════════════════════════════════════
   · Condição por contrato (DEC-CTT-11) · sub-personagem encapsulado (DEC-CTT-06)
   · título livre (DEC-CTT-07, fecha Q-CTT-05) · conhecimento se edita num lugar
     só (DEC-CTT-05) · redação no servidor (REQ-CTT-081..083).

  ════════════════════════════════════════════════════════════════════════════
  O QUE AINDA NÃO FOI DECIDIDO (vira Q- na spec se não fechar agora)
  ════════════════════════════════════════════════════════════════════════════
   N1 FIXAR PASTA — "Goblinoides" está fixada e SAIU de dentro de "Bestiário"
      (sobe com o caminho). É isso, ou fixar só devia ordenar entre as irmãs? E o
      favorito mora no aparelho (como as categorias da 39) ou na pasta?
   N5 IMPORTAR DO BESTIÁRIO — cai em qual pasta? E guarda vínculo com o pack de
      origem, para atualizar depois, ou vira cópia solta?
   N6 EXCLUIR — recusa enquanto houver combate ativo? (a REQ-CTT-076 só cobriu o
      caso espelho: excluir personagem)
   N7 REVELAR — o cartão só lê o estado; revelar exige o rodapé. Continua assim?
   N8 VÍNCULO NO ARRASTE — goblin desvinculado, Aldric vinculado. Depende da
      spec 41 (Token), que ainda não existe.
   N9 SEGUNDO PERSONAGEM — se o personagem nasce com o player, o SEGUNDO
      personagem de um jogador nasce como? A 39 já prevê o caso (CA-CTT-010).
   N10 EXCLUIR PERSONAGEM — criar ganhou casa (Usuários); excluir não tem nenhuma.
-->

        background: var(--accent-dim);

        color: var(--ok);

      .wtabs {

        background: none;
        border: 0;

        font: inherit;
        font-size: 0.78rem;
        padding: 0.4rem 0.5rem;

      .wtabs button:hover {
        color: var(--text);
      }

        color: var(--accent-hover);
        border-bottom-color: var(--accent);

      .browser {
        border: 1px solid var(--border);

        max-height: 190px;
        overflow: auto;
        margin-top: 0.4rem;
      }
      .brow {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.28rem 0.45rem;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .brow:last-child {
        border-bottom: 0;
      }
      .brow:hover {
        background: var(--surface-alt);
      }
      .brow.on {
        background: var(--accent-dim);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .brow .av {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 0.6rem;
        font-weight: 700;
        color: #0b0b0f;
        flex: 0 0 auto;
      }
      .brow .bn {
        color: var(--text);
        font-size: 0.78rem;
        flex: 1;
        min-width: 0;
      }
      .brow .bs {
        font-size: 0.66rem;
        color: var(--subtle);
      }
      .warnbox {
        margin-top: 0.6rem;
        border: 1px solid rgba(229, 184, 59, 0.4);
        background: rgba(229, 184, 59, 0.07);
        border-radius: var(--radius-sm);
        padding: 0.45rem 0.55rem;
        color: var(--warn);
        font-size: 0.74rem;
        line-height: 1.5;
      }
      .warnbox b {
        color: var(--warn);
      }
      .stopbox {
        margin-top: 0.6rem;
        border: 1px solid var(--danger);
        background: rgba(255, 92, 92, 0.08);
        border-radius: var(--radius-sm);
        padding: 0.45rem 0.55rem;
        color: #ff9a9a;
        font-size: 0.74rem;
        line-height: 1.5;
      }
      .stopbox b {
        color: #ffc9c9;
      }
      .conseq {
        list-style: none;
        margin: 0.4rem 0 0;
        padding: 0;
      }
      .conseq li {
        display: flex;
        gap: 0.45rem;

        border-bottom: 1px solid var(--border);

      }
      .conseq li .icon {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
        margin-top: 2px;
        color: var(--subtle);
      }
      .btn-danger {
        background: var(--danger);
        border: 1px solid var(--danger);
        color: #160608;
        border-radius: var(--radius-sm);

        font: inherit;
        font-size: 0.76rem;
        font-weight: 700;

      }

        opacity: 0.4;

      .btn-ghost {
        background: var(--surface-alt);

        font: inherit;
        font-size: 0.76rem;
        cursor: pointer;
      }
      .btn-ghost:hover {
        color: var(--text);
      }
      .keys {
        display: flex;
        gap: 0.8rem;
        flex-wrap: wrap;
        margin: 0.5rem 0 0.2rem;
        font-size: 0.74rem;
      }
      .keys span {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        color: var(--subtle);
      }
      .keys i {
        font-style: normal;
        font-size: 0.95rem;
        width: 1.1rem;
        text-align: center;

      .k0 {
        color: var(--subtle);
      }
      .k1 {
        color: var(--warn);
      }
      .k2 {
        color: var(--ok);
      }
      .matrix {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.75rem;
        margin-top: 0.5rem;
      }
      .matrix th,
      .matrix td {
        border: 1px solid var(--border);
        padding: 0.2rem 0.35rem;
        text-align: center;
        vertical-align: middle;
      }
      .matrix thead th {
        color: var(--muted);

        font-size: 0.72rem;

        cursor: pointer;
        user-select: none;

      .matrix thead th:hover {
        color: var(--accent-hover);
      }
      .matrix thead th:first-child {
        cursor: default;
        text-align: left;
      }
      .matrix thead th small {
        display: block;
        color: var(--subtle);
        font-size: 0.62rem;
        font-weight: 400;
      }
      .matrix td.nm {
        text-align: left;
        color: var(--text);
        cursor: pointer;
        white-space: nowrap;
      }
      .matrix td.nm:hover {
        color: var(--accent-hover);
      }
      .matrix td.nm small {
        display: block;
        color: var(--subtle);

      }
      .matrix td button.cell {
        background: none;

        font-size: 1rem;
        width: 100%;
        line-height: 1.3;
        border-radius: var(--radius-sm);
      }
      .matrix td button.cell:hover {
        background: var(--surface-alt);
      }
      .matrix td button.cell.ex {
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      /* ---------- Switcher + legenda ---------- */
      .switcher {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: #fff;
        color: #111;
        border-radius: 999px;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        font-size: 0.8rem;
        font-weight: 600;
      }
      .switcher button {
        border: 0;
        background: #111;
        color: #fff;
        height: 28px;
        padding: 0 0.7rem;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.76rem;
        font-weight: 600;
      }
      .switcher button.alt {
        background: #5a4bd6;
      }
      .legend {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 9999;
        background: rgba(255, 255, 255, 0.96);
        color: #111;
        border-radius: 10px;
        padding: 0.6rem 0.7rem;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
        font-size: 0.72rem;
        max-width: 420px;
        line-height: 1.45;
      }
      .legend h4 {
        margin: 0 0 0.35rem;
        font-size: 0.78rem;
      }
      .legend td {
        padding: 0.12rem 0.25rem;
        vertical-align: top;
      }
      .legend td:first-child {
        color: #666;
        white-space: nowrap;
      }
      .legend b {
        color: #111;
      }
      .legend .sw {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 0.2rem;
      }
      .legend .q {
        margin-top: 0.45rem;
        padding-top: 0.4rem;
        border-top: 1px solid #ddd;
        color: #444;
      }
    </style>
  </head>
  <body>

      ><span class="pill">🗺 aha</span>

      <span class="who" id="who"></span>
      <button class="btn">Sair</button>
    </div>
    <div class="stage">

      <div class="art">
        <div class="house"><div class="star">★</div></div>
      </div>
      <div class="chestmark" id="chestmark" style="display: none"></div>

        arraste um ator para cá → vira presença no mapa<br /><b id="droplink"></b>

    <div id="float"></div>

    <div class="switcher">

    <div class="legend" id="legend"></div>

    <script>

        combat: svg(
          '<path d="M4 4l11 11M20 4L9 15"/><path d="M14 16l2 2M10 16l-2 2M17 13l3 3-2 2-3-3M7 13l-3 3 2 2 3-3"/>',
        ),
        compendium: svg(
          '<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',

        npcs: svg(

          JSON.stringify({
            t: "Presença no mapa",
            h: tk
              ? Object.entries(n.tok)
                  .map(([s, c]) => `<b>${c}</b> em ${s}`)
                  .join("<br>")
              : "não está em cena nenhuma",
            tone: n.link
              ? "N8 · arrasta VINCULADO (um só, vida compartilhada)"
              : "N8 · arrasta DESVINCULADO (cada um com sua vida)",
          }),
        );
        const meta = `<span class="meta hide-on-hover">
        <span class="lvl">${n.lvl}</span>
        ${tk ? `<span class="tok" data-help="${tkHelp}">${UI.hex}${tk}</span>` : ""}
        ${knowSummary(n)}
      </span>`;
        const tools = `<span class="tools">
        <button data-sheet="${n.id}" title="abrir ficha">${UI.sheet}</button>
        <button data-move="${n.id}" title="mudar de pasta">${UI.folder}</button>
        <button class="del" data-del="${n.id}" title="excluir ator">${UI.trash}</button>
      </span>`;
        const subs = (n.subs || [])
          .map(
            (s) =>
              `<div class="sub"><span class="nm">${s.name}</span><span class="sb">${s.kind}</span></div>`,
          )
          .join("");
        return `<div class="act ${sel === n.id ? "sel" : ""} ${dragActor === n.id ? "dragging" : ""}" data-act="${n.id}" draggable="true">
        <span class="av ${hz}" style="background:${n.color}">${initials(n.name)}</span>
        <span class="idt"><span class="nm">${n.name}</span>${titleLine}</span>
        ${attButton(n)}${meta}${tools}
      </div>${condsHtml(n)}${moveMenu(n)}${subs}`;
      }

      /* ---------- árvore ---------- */
      function subtreeCount(fid, list) {
        const kids = FOLDERS.filter((x) => x.parent === fid);
        return (
          list.filter((n) => n.folder === fid).length +
          kids.reduce((a, k) => a + subtreeCount(k.id, list), 0)
        );
      }
      function newFolderInput() {
        return `<div class="fold"><span class="chev">${UI.chevron}</span>
        <input id="newfolderinput" placeholder="nome da pasta"/></div>`;
      }
      function folderNode(f, list, opts) {
        const o = opts || {};
        const pins = pinnedIds();
        /* pasta fixada sai do lugar dela na árvore e sobe para o topo (N1) */
        const kids = FOLDERS.filter((x) => x.parent === f.id && !pins.includes(x.id));
        const mine = list.filter((n) => n.folder === f.id).sort(byName);
        const total = subtreeCount(f.id, list);
        if (query.trim() && total === 0) return "";
        const isOpen = expanded[f.id] || !!query.trim();
        const renaming = renameFolder === f.id;
        const newHere = newFolderIn === f.id;
        const inner = isOpen
          ? `<div class="kids">${newHere ? newFolderInput() : ""}${kids
              .map((k) => folderNode(k, list, o))
              .join("")}${mine.map((n) => actorRow(n)).join("")}</div>`
          : "";
        const path = o.showPath && f.parent ? `<span class="path">${folderPath(f)} ›</span>` : "";
        return `<div class="fold" data-fold="${f.id}" data-dropfolder="${f.id}">
        <span class="chev ${isOpen ? "open" : ""}">${UI.chevron}</span>
        ${f.pin ? `<span class="pinmark">${UI.starOn}</span>` : ""}
        ${path}
        ${renaming ? `<input id="renameinput" value="${f.name}"/>` : `<span class="fn">${f.name}</span>`}
        <span class="cnt">${total}</span>
        <span class="tools">
          <button class="pinb ${f.pin ? "on" : ""}" data-pin="${f.id}" title="${f.pin ? "desafixar" : "fixar no topo"}">${f.pin ? UI.starOn : UI.star}</button>
          <button data-newfolder="${f.id}" title="nova subpasta">${UI.folderPlus}</button>
          <button data-newin="${f.id}" title="novo NPC aqui">${UI.plus}</button>
          <button data-rename="${f.id}" title="renomear">${UI.pencil}</button>
          <button class="del" data-delfolder="${f.id}" title="excluir pasta">${UI.close}</button>
        </span>
      </div>${inner}`;
      }

      function npcsBody() {
        const list = visible();
        if (!list.length) return emptyState();
        const pinned = FOLDERS.filter((f) => f.pin);
        const roots = FOLDERS.filter((f) => !f.parent && !f.pin);
        const loose = list.filter((n) => !n.folder).sort(byName);
        const pinnedBlock = pinned.length
          ? `<div class="sec pinned"><span class="lbl">${UI.starOn} fixadas</span><span class="cnt">${pinned.length}</span><span class="line"></span></div>` +
            pinned.map((f) => folderNode(f, list, { showPath: true })).join("")
          : "";
        const treeBlock =
          `<div class="sec"><span class="lbl">pastas</span><span class="line"></span>
            <button class="add" data-newfolder="">${UI.folderPlus} nova</button></div>` +
          (newFolderIn === null ? newFolderInput() : "") +
          roots.map((f) => folderNode(f, list)).join("");
        const looseBlock =
          `<div class="sec" data-dropfolder=""><span class="lbl">sem pasta</span><span class="cnt">${loose.length}</span><span class="line"></span></div>` +
          loose.map((n) => actorRow(n)).join("");
        return pinnedBlock + treeBlock + looseBlock;
      }

      function emptyState() {
        if (empty)
          return `<div class="vazio"><b>Nenhum NPC neste mundo ainda.</b><br/>
        Crie do zero, ou puxe um do bestiário.<br/><br/>
        <button class="hbtn pri" id="newempty">${UI.plus} Novo NPC</button></div>
        <p class="hint">Personagem de jogador não aparece aqui —<br/>ele nasce com o player, em Configurações › Usuários.</p>`;
        return `<div class="vazio">Nada encontrado para <b>"${query}"</b>.</div>`;
      }

      /* ================= janelas (spec 11) ================= */
      function newWinHtml() {
        const hits = packQuery.trim()
          ? PACK.filter((p) => p.name.toLowerCase().includes(packQuery.trim().toLowerCase()))
          : PACK;
        const picked = PACK.find((p) => p.id === packPick);
        const body =
          newMode === "pack"
            ? `<div class="field"><label>Buscar</label>
            <input id="packq" value="${packQuery}" placeholder="goblin, esqueleto, ogro…"/></div>
          <div class="browser">${
            hits.length
              ? hits
                  .map(
                    (p) => `<div class="brow ${p.id === packPick ? "on" : ""}" data-pack="${p.id}">
              <span class="av" style="background:${p.color}">${initials(p.name)}</span>
              <span class="bn">${p.name}</span><span class="bs">${p.pack} · nv ${p.lvl}</span></div>`,
                  )
                  .join("")
              : '<div class="brow"><span class="bs">nada no bestiário com esse nome</span></div>'
          }</div>
          ${
            picked
              ? `<div class="note"><b>${picked.name}</b> vem de <b>${picked.pack}</b>.
            <br/><b>N5</b> — importar copia para o mundo (REQ-CMP-021). Vai para qual pasta: a
            escolhida abaixo, uma pasta "Importados", ou a que espelha o pack? E o ator guarda
            vínculo com a origem, para atualizar quando o pack mudar, ou vira cópia solta?</div>`
              : ""
          }`
            : `<div class="field"><label>Tipo</label>
            <div class="pills">${SUBTYPES.map(
              (s) =>
                `<button class="${s.id === newType ? "on" : ""}" data-st="${s.id}">${s.lb}</button>`,
            ).join("")}</div></div>
          <div class="field"><label>Nome</label><input placeholder="nome do NPC"/></div>`;
        return `<div class="win" style="width:520px;left:calc(50% - 260px)">
      <div class="wh">${UI.plus} Novo NPC<button class="x" data-winclose>${UI.close}</button></div>
      <div class="wtabs">
        <button class="${newMode === "pack" ? "on" : ""}" data-mode="pack">Do bestiário</button>
        <button class="${newMode === "scratch" ? "on" : ""}" data-mode="scratch">Criar do zero</button>
      </div>
      <div class="wb">
        ${body}
        <div class="field"><label>Preset</label>
          <div class="pills">${PRESETS.map(
            (r) =>
              `<button class="${r.id === newPreset ? "on" : ""}" data-preset="${r.id}">${r.lb}</button>`,
          ).join("")}</div></div>
        <div class="field"><label>Atitude</label>
          <div class="pills">${ATT.map(
            (a) =>
              `<button class="${a.id === newAtt ? "on " + a.id : ""}" data-newatt="${a.id}">${UI[a.icon]}${a.lb}</button>`,
          ).join("")}</div></div>
        <div class="field"><label>Pasta</label>
          <select>${["(sem pasta)", ...FOLDERS.map((f) => f.name)]
            .map((n) => `<option>${n}</option>`)
            .join("")}</select></div>
        <div class="note"><b>Preset é preset:</b> pré-preenche a ficha e não fica gravado no ator —
          por isso não há etiqueta de "mercador" na lista. Os presets ainda não existem no projeto;
          a spec fixa o conceito e o ponto de extensão, não o catálogo.
          <br/><br/><b>Atitude</b>, ao contrário, é atributo do ator e vale para a party inteira.
          <br/><br/>Só NPC e Perigo: <b>personagem</b> nasce com o player (Configurações › Usuários),
          <b>familiar</b> nasce colado a um dono, e <b>veículo não existe no Fusion</b>.</div>
      </div>
      <div class="wf"><button class="btn-ghost" data-winclose>Cancelar</button>
        <button class="hbtn pri">${newMode === "pack" ? "Importar e criar" : "Criar"}</button></div></div>`;
      }

      function deleteWinHtml() {
        const n = findActor(delTarget);
        if (!n) return "";
        const tk = tokCount(n);
        const scenes = Object.entries(n.tok || {});
        let k2 = 0,
          k1 = 0;
        PCS.forEach((p) => {
          const v = know(n.id, p.id);
          if (v === 2) k2++;
          else if (v === 1) k1++;
        });
        return `<div class="win danger" style="width:500px;left:calc(50% - 250px)">
      <div class="wh">${UI.trash} Excluir <b style="color:var(--text)">&nbsp;${n.name}</b>?
        <button class="x" data-winclose>${UI.close}</button></div>
      <div class="wb">
        <b>O que vai junto:</b>
        <ul class="conseq">
          <li>${UI.hex}<span>${
            tk
              ? `<b>${tk}</b> presença(s) no mapa, em ${scenes.map(([s, c]) => `${s} (${c})`).join(", ")} — somem junto.`
              : "nenhuma presença em cena."
          }</span></li>
          <li>${UI.grid}<span>${
            k2 + k1
              ? `<b>${k2}</b> personagem(ns) conhece(m) e <b>${k1}</b> entreviu/entreviram — o conhecimento é apagado com o ator.`
              : "ninguém conhece este ator; nada de conhecimento a apagar."
          }</span></li>
          <li>${UI.sheet}<span>a ficha e os itens embutidos vão junto, sem lixeira.</span></li>
        </ul>
        ${
          n.inCombat
            ? `<div class="stopbox"><b>Recusado:</b> este ator está em um <b>combate ativo</b>.
          Encerre o combate, ou tire-o dele, antes de excluir.<br/>
          <b>N6</b> — recusar é o certo, ou é atrapalhar o Mestre?</div>`
            : `<div class="warnbox"><b>N6</b> — a REQ-CTT-076 só cobriu o caso espelho (excluir personagem
          apaga as exceções que o citam). Excluir NPC não está em spec nenhuma.</div>`
        }
      </div>
      <div class="wf"><button class="btn-ghost" data-winclose>Cancelar</button>
        <button class="btn-danger" ${n.inCombat ? "disabled" : ""}>Excluir</button></div></div>`;
      }

      const ST = ["oculto", "entrevisto", "conhecido"];
      const SYM = ["·", "◐", "✓"];
      function matrixHtml() {
        const list = allNpcs()
          .filter((n) => !n.flood)
          .sort(byName);
        return `<div class="win"><div class="wh">${UI.grid} Quem conhece quem
      <button class="x" data-winclose>${UI.close}</button></div>
    <div class="wb">
      A <b>mesma janela</b> da aba Contatos (spec 39, REQ-CTT-061), alcançável pelas duas abas porque o
      conhecimento se edita <b>num lugar só</b> — DEC-CTT-05.
      <div class="keys"><span><i class="k0">·</i>oculto</span><span><i class="k1">◐</i>entrevisto</span>
        <span><i class="k2">✓</i>conhecido</span><span><i>__</i>sublinhado = exceção</span></div>
      <table class="matrix"><thead><tr><th>NPC</th>
        ${PCS.map((p) => `<th data-col="${p.id}">${p.name}<small>coluna inteira</small></th>`).join("")}
      </tr></thead><tbody>
      ${list
        .map(
          (n) => `<tr>
        <td class="nm" data-rowcycle="${n.id}">${n.name}<small>regra geral: ${ST[rule[n.id] ?? 0]}</small></td>
        ${PCS.map((p) => {
          const v = know(n.id, p.id);
          return `<td><button class="cell k${v} ${isEx(n.id, p.id) ? "ex" : ""}" data-mx="${n.id}::${p.id}">${SYM[v]}</button></td>`;
        }).join("")}
      </tr>`,
        )
        .join("")}
      </tbody></table>
      <div class="note"><b>Por que esta grade existe e a atitude não tem uma:</b> conhecer é do par
        NPC × personagem (o Tobias conhece o ferreiro, a Fofurinha só o entreviu); atitude é da
        <b>party inteira</b>, então cabe num atributo do ator, editável na própria linha.
        <br/><br/><b>N7</b> — revelar exige vir até aqui. Vale o desvio, ou o cartão precisa de um
        "revelar a todos"?</div>
    </div></div>`;
      }

      function sheetWinHtml() {
        const n = findActor(win.replace("sheet:", ""));
        return `<div class="win" style="width:470px;left:calc(50% - 235px)">
      <div class="wh">${UI.sheet} Ficha — ${n ? n.name : "?"}<button class="x" data-winclose>${UI.close}</button></div>
      <div class="wb">A ficha abre <b>fora da gaveta</b>, como janela do window manager (spec 11).
      <div class="note">A ficha de NPC vai ser <b>muito mais maleável</b> que a de personagem, e ganha
      <b>spec própria</b>. Esta spec não a define: só diz que a aba abre a ficha que a spec dela
      definir.</div></div></div>`;
      }

      function winHtml() {
        if (!win) return "";
        if (win === "new") return newWinHtml();
        if (win === "delete") return deleteWinHtml();
        if (win === "matrix") return matrixHtml();
        if (win.startsWith("sheet:")) return sheetWinHtml();
        return "";
      }

      /* ================= render ================= */
      function npcsHead() {
        return `<div class="panel-head">
      <div class="search"><span class="mag">${UI.search}</span>
        <input id="q" placeholder="Procurar NPC" value="${query}"/></div>
      <button class="hbtn pri" id="new" title="novo NPC">${UI.plus}</button>
    </div>`;
      }
      function tabButton(t) {
        const badge = t.badge ? `<span class="badge">${t.badge}</span>` : "";
        return `<button class="tabbtn ${active === t.id && open ? "is-active" : ""}" data-tab="${t.id}" aria-label="${t.label}">
      ${ICONS[t.id]}${badge}<span class="tip">${t.label}</span></button>`;
      }
      function render() {
        const isGm = role === "gm";
        if (!isGm && ["npcs", "scenes"].includes(active)) active = "contacts";
        if (!isGm) win = null;
        const all = TABS.filter((t) => t.group === "all" && !t.foot),
          gms = TABS.filter((t) => t.group === "gm" && isGm),
          foot = TABS.filter((t) => t.foot);

        const isNpcs = active === "npcs";
        const head = isNpcs
          ? npcsHead()
          : `<div class="panel-head"><span class="panel-title">${TITLE[active]}</span></div>`;
        const body = `<div class="panel-body">${isNpcs ? npcsBody() : OTHER[active] || ""}</div>`;
        const footer = isNpcs
          ? `<div class="panel-foot">
          <button class="hbtn chestb" id="chest" title="põe um baú direto na cena ativa">${UI.chest} Baú</button>
          <button class="hbtn wide" id="matrix">${UI.grid} Quem conhece</button></div>`
          : "";

        document.getElementById("root").innerHTML = `
      <div class="${open ? "is-open" : ""}"><aside class="sidebar">
        <nav class="tabs">
          <div class="grp">${all.map(tabButton).join("")}</div>
          ${gms.length ? `<div class="grp gm">${gms.map(tabButton).join("")}</div>` : ""}
          <div class="foot">${foot.map(tabButton).join("")}</div>
        </nav>
        <div class="panel">${head}${body}${footer}</div>
      </aside></div>`;
        document.getElementById("float").innerHTML = winHtml();

        const who = document.getElementById("who");
        who.className = isGm ? "who" : "who player";
        who.innerHTML = isGm
          ? '<b>●</b> Gamemaster · <span style="color:var(--muted)">Mestre</span>'
          : '<b>●</b> Alexandre · <span style="color:var(--muted)">Jogador (Fofurinha) — não vê esta aba</span>';

        const n = dragActor ? findActor(dragActor) : null;
        document.getElementById("droplink").textContent = n
          ? n.link
            ? `${n.name}: VINCULADO (um só; a vida é a do ator)`
            : `${n.name}: DESVINCULADO (cada um com sua vida)`
          : "goblin desvinculado · Aldric vinculado — N8 em aberto";
        const cm = document.getElementById("chestmark");
        cm.style.display = chestOnScene ? "block" : "none";
        cm.innerHTML = chestOnScene ? `${UI.chest}<small>baú — não é ator</small>` : "";

        hideTip();
        wire();
        paintSwitcher();
        const u = new URL(location);
        u.searchParams.set("role", role);
        u.searchParams.set("flood", flood ? "1" : "0");
        u.searchParams.set("state", empty ? "empty" : "full");
        history.replaceState(null, "", u);
      }

      /* ================= tooltip ================= */
      const tipEl = () => document.getElementById("tip");
      function showTip(el) {
        let d;
        try {
          d = JSON.parse(decodeURIComponent(el.dataset.help));
        } catch {
          return;
        }
        const t = tipEl();
        t.innerHTML = `<b>${d.t}</b>${d.h || '<i style="color:var(--subtle)">sem texto de ajuda declarado</i>'}<span class="tone">${d.tone}</span>`;
        t.style.display = "block";
        const r = el.getBoundingClientRect(),
          tr = t.getBoundingClientRect();
        t.style.left = Math.max(8, r.left - tr.width - 10) + "px";
        t.style.top = Math.max(8, r.top - 4) + "px";
      }
      function hideTip() {
        const t = tipEl();
        if (t) t.style.display = "none";
      }

      /* ================= eventos ================= */
      function wire() {
        const root = document.getElementById("root"),
          float = document.getElementById("float");

        root.querySelectorAll("[data-tab]").forEach(
          (b) =>
            (b.onclick = () => {
              const id = b.dataset.tab;
              if (open && active === id) open = false;
              else {
                active = id;
                open = true;
              }
              editTitle = moveFor = renameFolder = null;
              newFolderIn = undefined;
              render();
            }),
        );

        /* --- pastas --- */
        root.querySelectorAll("[data-fold]").forEach(
          (f) =>
            (f.onclick = (e) => {
              if (e.target.closest("button") || e.target.tagName === "INPUT") return;
              const id = f.dataset.fold;
              expanded[id] = !expanded[id];
              render();
            }),
        );
        root.querySelectorAll("[data-pin]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              const f = folderById(b.dataset.pin);
              if (f) f.pin = !f.pin;
              render();
            }),
        );
        root.querySelectorAll("[data-newfolder]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              const p = b.dataset.newfolder;
              newFolderIn = p === "" ? null : p;
              if (p) expanded[p] = true;
              render();
              const i = document.getElementById("newfolderinput");
              if (i) i.focus();
            }),
        );
        const nf = document.getElementById("newfolderinput");
        if (nf)
          nf.onkeydown = (e) => {
            if (e.key === "Enter" && nf.value.trim()) {
              FOLDERS.push({
                id: "f-new-" + FOLDERS.length,
                name: nf.value.trim(),
                parent: newFolderIn ?? null,
                pin: false,
              });
              newFolderIn = undefined;
              render();
            }
            if (e.key === "Escape") {
              newFolderIn = undefined;
              render();
            }
          };
        root.querySelectorAll("[data-rename]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              renameFolder = b.dataset.rename;
              render();
              const i = document.getElementById("renameinput");
              if (i) {
                i.focus();
                i.select();
              }
            }),
        );
        const rn = document.getElementById("renameinput");
        if (rn)
          rn.onkeydown = (e) => {
            if (e.key === "Enter") {
              const f = folderById(renameFolder);
              if (f && rn.value.trim()) f.name = rn.value.trim();
              renameFolder = null;
              render();
            }
            if (e.key === "Escape") {
              renameFolder = null;
              render();
            }
          };
        root.querySelectorAll("[data-delfolder]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              const id = b.dataset.delfolder;
              [...NPCS, ...FLOOD].forEach((n) => {
                if (n.folder === id) n.folder = null;
              });
              FOLDERS.filter((f) => f.parent === id).forEach((f) => (f.parent = null));
              const i = FOLDERS.findIndex((f) => f.id === id);
              if (i >= 0) FOLDERS.splice(i, 1);
              render();
            }),
        );

        /* --- atores --- */
        root.querySelectorAll("[data-act]").forEach((a) => {
          a.onclick = (e) => {
            if (e.target.closest("button") || e.target.closest(".pen")) return;
            sel = a.dataset.act;
            render();
          };
          a.ondblclick = () => {
            win = "sheet:" + a.dataset.act;
            render();
          };
          a.ondragstart = (ev) => {
            dragActor = a.dataset.act;
            ev.dataTransfer.effectAllowed = "move";
            try {
              ev.dataTransfer.setData("text/plain", dragActor);
            } catch (err) {
              /* alguns navegadores exigem, outros não */
            }
            const n2 = findActor(dragActor);
            const dl = document.getElementById("droplink");
            if (dl && n2)
              dl.textContent = n2.link
                ? `${n2.name}: VINCULADO (um só; a vida é a do ator)`
                : `${n2.name}: DESVINCULADO (cada um com sua vida)`;
          };
          a.ondragend = () => {
            dragActor = null;
            render();
          };
        });

        /* --- atitude: cicla no clique --- */
        root.querySelectorAll("[data-att]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              const n2 = findActor(b.dataset.att);
              if (n2) n2.att = nextAtt(n2.att);
              render();
            }),
        );

        /* --- drop de ator em pasta (e em "sem pasta") --- */
        root.querySelectorAll("[data-dropfolder]").forEach((el) => {
          el.ondragover = (ev) => {
            if (!dragActor) return;
            ev.preventDefault();
            el.classList.add("drop-ok");
          };
          el.ondragleave = () => el.classList.remove("drop-ok");
          el.ondrop = (ev) => {
            ev.preventDefault();
            el.classList.remove("drop-ok");
            const n2 = findActor(dragActor);
            if (n2) n2.folder = el.dataset.dropfolder === "" ? null : el.dataset.dropfolder;
            dragActor = null;
            render();
          };
        });

        root.querySelectorAll("[data-title]").forEach(
          (p) =>
            (p.onclick = (e) => {
              e.stopPropagation();
              editTitle = p.dataset.title;
              render();
              const i = document.getElementById("titleinput");
              if (i) {
                i.focus();
                i.select();
              }
            }),
        );
        const ti = document.getElementById("titleinput");
        if (ti)
          ti.onkeydown = (e) => {
            if (e.key === "Enter") {
              const n2 = findActor(editTitle);
              if (n2) n2.title = ti.value.trim();
              editTitle = null;
              render();
            }
            if (e.key === "Escape") {
              editTitle = null;
              render();
            }
          };

        root.querySelectorAll("[data-move]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              moveFor = moveFor === b.dataset.move ? null : b.dataset.move;
              render();
            }),
        );
        root.querySelectorAll("[data-moveto]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              const parts = b.dataset.moveto.split("::");
              const n2 = findActor(parts[0]);
              if (n2) n2.folder = parts[1] === "" ? null : parts[1];
              moveFor = null;
              render();
            }),
        );
        root.querySelectorAll("[data-sheet]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              win = "sheet:" + b.dataset.sheet;
              render();
            }),
        );
        root.querySelectorAll("[data-del]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              delTarget = b.dataset.del;
              win = "delete";
              render();
            }),
        );
        root.querySelectorAll("[data-more]").forEach(
          (m) =>
            (m.onclick = (e) => {
              e.stopPropagation();
              expandConds[m.dataset.more] = !expandConds[m.dataset.more];
              render();
            }),
        );
        root.querySelectorAll("[data-newin]").forEach(
          (b) =>
            (b.onclick = (e) => {
              e.stopPropagation();
              win = "new";
              render();
            }),
        );

        const nb = document.getElementById("new");
        if (nb)
          nb.onclick = () => {
            win = "new";
            render();
          };
        const ne = document.getElementById("newempty");
        if (ne)
          ne.onclick = () => {
            win = "new";
            render();
          };
        const mx = document.getElementById("matrix");
        if (mx)
          mx.onclick = () => {
            win = "matrix";
            render();
          };
        const ch = document.getElementById("chest");
        if (ch)
          ch.onclick = () => {
            chestOnScene = !chestOnScene;
            render();
          };

        /* --- janelas --- */
        float.querySelectorAll("[data-winclose]").forEach(
          (b) =>
            (b.onclick = () => {
              win = null;
              render();
            }),
        );
        float.querySelectorAll("[data-mode]").forEach(
          (b) =>
            (b.onclick = () => {
              newMode = b.dataset.mode;
              render();
            }),
        );
        float.querySelectorAll("[data-st]").forEach(
          (b) =>
            (b.onclick = () => {
              newType = b.dataset.st;
              render();
            }),
        );
        float.querySelectorAll("[data-preset]").forEach(
          (b) =>
            (b.onclick = () => {
              newPreset = b.dataset.preset;
              render();
            }),
        );
        float.querySelectorAll("[data-newatt]").forEach(
          (b) =>
            (b.onclick = () => {
              newAtt = b.dataset.newatt;
              render();
            }),
        );
        float.querySelectorAll("[data-pack]").forEach(
          (b) =>
            (b.onclick = () => {
              packPick = b.dataset.pack;
              render();
            }),
        );
        const pq = document.getElementById("packq");
        if (pq)
          pq.oninput = () => {
            packQuery = pq.value;
            render();
            const el = document.getElementById("packq");
            if (el) {
              el.focus();
              el.setSelectionRange(packQuery.length, packQuery.length);
            }
          };
        float.querySelectorAll("[data-mx]").forEach(
          (b) =>
            (b.onclick = () => {
              const parts = b.dataset.mx.split("::");
              setKnow(parts[0], parts[1], (know(parts[0], parts[1]) + 1) % 3);
              render();
            }),
        );
        float.querySelectorAll("[data-rowcycle]").forEach(
          (td) =>
            (td.onclick = () => {
              const npc = td.dataset.rowcycle;
              rule[npc] = ((rule[npc] ?? 0) + 1) % 3;
              ex[npc] = {};
              render();
            }),
        );
        float.querySelectorAll("[data-col]").forEach(
          (th) =>
            (th.onclick = () => {
              const pc = th.dataset.col;
              const list = allNpcs().filter((n2) => !n2.flood);
              const vals = list.map((n2) => know(n2.id, pc));
              const uniform = vals.every((v) => v === vals[0]) ? vals[0] : -1;
              const next = uniform === -1 ? 2 : (uniform + 1) % 3;
              list.forEach((n2) => setKnow(n2.id, pc, next));
              render();
            }),
        );

        document.querySelectorAll("[data-help]").forEach((el) => {
          el.onmouseenter = () => showTip(el);
          el.onmouseleave = hideTip;
        });

        const q = document.getElementById("q");
        if (q)
          q.oninput = () => {
            query = q.value;
            render();
            const el = document.getElementById("q");
            if (el) {
              el.focus();
              el.setSelectionRange(query.length, query.length);
            }
          };
      }

      /* arraste para o mapa */
      const dz = document.getElementById("dropzone");
      dz.ondragover = (e) => {
        if (!dragActor) return;
        e.preventDefault();
        dz.classList.add("hot");
      };
      dz.ondragleave = () => dz.classList.remove("hot");
      dz.ondrop = (e) => {
        e.preventDefault();
        dz.classList.remove("hot");
        const n = findActor(dragActor);
        if (n) n.tok = Object.assign({}, n.tok, { Fortaleza: ((n.tok || {}).Fortaleza || 0) + 1 });
        dragActor = null;
        render();
      };

      /* ================= switcher / legenda ================= */
      function paintSwitcher() {
        document.getElementById("role").textContent =
          role === "gm" ? "ver como jogador" : "ver como Mestre";
        document.getElementById("bestiary").textContent = flood
          ? "bestiário: importado (36)"
          : "bestiário: mundo enxuto";
        document.getElementById("state").textContent = empty
          ? "estado: vazio"
          : "estado: com conteúdo";

        document.getElementById("legend").innerHTML = `
      <h4>Aba NPCs — rodada 3 · atitude, preset e ícones desenhados</h4>
      <table>
        <tr><td>novo aqui</td><td><b>atitude</b> na linha (aliado · neutro · inimigo), que <b>cicla no
          clique</b> e vale para a <b>party inteira</b> · <b>preset</b> só na criação, sem etiqueta na
          lista · <b>zero emoji</b>: todo ícone desenhado (DEC-ACH-04)</td></tr>
        <tr><td>atitude × conhecimento</td><td>atitude é da party toda (atributo do ator);
          conhecimento é do par NPC × personagem (grade). Granularidades diferentes de propósito —
          e a spec vai ter que dizer por quê.</td></tr>
        <tr><td>baú</td><td><b>não é ator</b>: some da cena e nunca entra no diretório. É atalho de
          narração do Mestre. O pf2e declara o subtipo <b>loot</b> — se o baú não é ator, ele fica
          sem uso ou é usado por baixo sem ser listado.</td></tr>
        <tr><td>veículo</td><td>não existe no Fusion — conferido: pf2e declara
          <i>character, npc, hazard, loot, familiar</i>. Era invenção do protótipo.</td></tr>
        <tr><td>condição</td><td><span class="sw" style="background:#ff5c5c"></span>penalidade
          <span class="sw" style="background:#3ddc84"></span>benefício
          <span class="sw" style="background:#b98cff"></span>situação · preenchido = tira da cena</td></tr>
      </table>
      <div class="q"><b>experimente:</b> clique na marca de atitude do <b>Bram</b> e veja ciclar ·
        o <b>Fosso</b> (perigo) não tem atitude nenhuma · a estrela fixa/desafixa pasta ·
        arraste o <b>Zumbi</b> para "Vila de Pedra Alta" · o botão <b>Baú</b> põe e tira o baú da cena.</div>
      <div class="q" style="border:0;padding-top:.3rem;color:#666">ainda aberto:
        <b>N1</b> fixar · <b>N5</b> importar · <b>N6</b> excluir · <b>N7</b> revelar ·
        <b>N8</b> vínculo · <b>N9/N10</b> segundo personagem e excluir personagem</div>`;
      }

      document.getElementById("role").onclick = () => {
        role = role === "gm" ? "player" : "gm";
        win = null;
        render();
      };
      document.getElementById("bestiary").onclick = () => {
        flood = !flood;
        render();
      };
      document.getElementById("state").onclick = () => {
        empty = !empty;
        render();
      };

      document.addEventListener("keydown", (e) => {
        if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
        if (e.key === "p") {
          role = role === "gm" ? "player" : "gm";
          win = null;
          render();
        }
        if (e.key === "b") {
          flood = !flood;
          render();
        }
        if (e.key === "v") {
          empty = !empty;
          render();
        }
        if (e.key === "Escape" && win) {
          win = null;
          render();
        }
      });

      seedKnowledge();
      render();
    </script>
  </body>
</html>
