    <title>Protótipo — Aba NPCs (rodada 3: atitude, preset e ícones desenhados)</title>
    <!--
  PROTOTYPE — descartável. Rodada 3 do grill. Não é código de produção.
  Rodada 1 (três variantes) e rodada 2 (diretório) estão no histórico do arquivo.

  ════════════════════════════════════════════════════════════════════════════
  DECIDIDO NA RODADA 1 (2026-08-16)
  ════════════════════════════════════════════════════════════════════════════
   1. DIRETÓRIO é o desenho, com o Mestre CRIANDO pastas e podendo FIXÁ-LAS no topo.
   2. MOVER ATOR por arraste E pelo botão de pasta — as duas formas.
   3. PERSONAGEM NÃO NASCE AQUI. "A aba é de NPC, ou seja, personagens NÃO
      jogáveis." Personagem nasce colado ao player: todo player criado nasce com
      um personagem em branco. => emenda na 37 (Usuários) e na 05.
   4. VEÍCULO SAIU. Ver o item 1 da rodada 3: ele nunca existiu.
   5. CRIAR NPC tem dois caminhos: do bestiário (browser aqui) ou do zero.
   6. VIDA NÃO APARECE nesta aba.
   7. Ficha de NPC será muito mais maleável que a de personagem, e ganha SPEC
      PRÓPRIA. Esta spec não define ficha — só abre a que a spec dela definir.

  ════════════════════════════════════════════════════════════════════════════
  DECIDIDO NA RODADA 2 (2026-08-16)
  ════════════════════════════════════════════════════════════════════════════
   1. VEÍCULO NÃO EXISTE — não ocupa eixo nenhum, não é subtipo cortado, é coisa
      que o Fusion não tem. Confirmado no código: systems/pf2e/src/index.ts:71
      declara Actor: ["character","npc","hazard","loot","familiar"]. "vehicle"
      não aparece em lugar nenhum do repo; foi invenção do protótipo da rodada 1.
      => A janela de criação oferece NPC e Perigo. `familiar` nasce colado a um dono
        (DEC-CTT-06), e `loot` é assunto do baú (item 3).
   2. "TIPO DE NPC" É PRESET. Mercador, chefe, montaria pré-preenchem a ficha na
      criação e NÃO viram capacidade gravada no ator. Os presets AINDA NÃO EXISTEM,
      mas vão existir — a spec fixa o conceito e o ponto de extensão, não o catálogo.
      => Consequência que o protótipo passou a respeitar: o preset SOME depois de
        criar. Não há etiqueta de "mercador" na linha, porque não há nada gravado
        para etiquetar. Só aparece na janela de criação.
   3. BAÚ NÃO É ATOR. "É uma ferramenta para ajudar na agilidade do GM narrar."
      => O botão põe um baú direto na cena e ele NUNCA aparece no diretório.
      => Fica pendurado: o pf2e declara o subtipo `loot`, que é exatamente o
        recipiente. Se o baú não é ator, `loot` fica sem uso — ou o baú usa `loot`
        por baixo sem nunca ser listado. Onde vive o conteúdo do baú é assunto da
        spec de Token/Cenas, não desta.
   4. NOVO — ATITUDE. Cada NPC pode ter uma atitude diante dos jogadores:
      INIMIGO · NEUTRO · ALIADO. É configuração para a PARTY INTEIRA, não por
      personagem. Atributo simples; só importa de verdade mais para a frente.
      => O contraste que vale registrar na spec: CONHECIMENTO é por par
        contato e personagem (DEC-CTT-03), ATITUDE é da party toda. Duas
        granularidades diferentes de propósito, e a spec tem que dizer por quê.
      => No protótipo: marca à esquerda dos números, sempre visível, que CICLA no
        clique (aliado => neutro => inimigo), como a célula da matriz da 39.
        Perigo não tem atitude — a marca simplesmente não aparece.
   5. SEM EMOJI. Todo ícone desta tela é desenhado. Era regra do projeto desde a
      DEC-ACH-04 (spec 38): "emoji muda de desenho e de cor em cada sistema
      operacional e não acompanha o tema". O protótipo estava violando em nove
      lugares (baú, pastas, ficha, lápis, x de fechar, estrela, hexágono, chevrons).

  ════════════════════════════════════════════════════════════════════════════
  HERDADO DA SPEC 39 (não se rediscute)
  ════════════════════════════════════════════════════════════════════════════
   · Condição por contrato (DEC-CTT-11) · sub-personagem encapsulado (DEC-CTT-06)
   · título livre (DEC-CTT-07, fecha Q-CTT-05) · conhecimento se edita num lugar
     só (DEC-CTT-05) · redação no servidor (REQ-CTT-081..083).

  ════════════════════════════════════════════════════════════════════════════
  O QUE AINDA NÃO FOI DECIDIDO (vira Q- na spec se não fechar agora)
  ════════════════════════════════════════════════════════════════════════════
   N1 FIXAR PASTA — "Goblinoides" está fixada e SAIU de dentro de "Bestiário"
      (sobe com o caminho). É isso, ou fixar só devia ordenar entre as irmãs? E o
      favorito mora no aparelho (como as categorias da 39) ou na pasta?
   N5 IMPORTAR DO BESTIÁRIO — cai em qual pasta? E guarda vínculo com o pack de
      origem, para atualizar depois, ou vira cópia solta?
   N6 EXCLUIR — recusa enquanto houver combate ativo? (a REQ-CTT-076 só cobriu o
      caso espelho: excluir personagem)
   N7 REVELAR — o cartão só lê o estado; revelar exige o rodapé. Continua assim?
   N8 VÍNCULO NO ARRASTE — goblin desvinculado, Aldric vinculado. Depende da
      spec 41 (Token), que ainda não existe.
   N9 SEGUNDO PERSONAGEM — se o personagem nasce com o player, o SEGUNDO
      personagem de um jogador nasce como? A 39 já prevê o caso (CA-CTT-010).
   N10 EXCLUIR PERSONAGEM — criar ganhou casa (Usuários); excluir não tem nenhuma.
-->

:root {
  color-scheme: dark;

  /* Surfaces: warm charcoal, three flat steps. */
  --fusion-bg: #141311;
  --fusion-surface: #1c1b18;
  --fusion-surface-alt: #25231f;
  --fusion-input-bg: #11100e;
  --fusion-border: #3b3830;
  --fusion-border-strong: #575245;

  /* Text: off-white, never #fff. Muted and subtle stay AA on every surface. */
  --fusion-text: #ebe5d6;
  --fusion-text-muted: #b8b09e;
  --fusion-text-subtle: #9a927f;

  /* The one accent — brass. Interactive and "selected" only, never decoration. */
  --fusion-accent: #d6a24a;
  --fusion-accent-hover: #e4b765;
  --fusion-accent-dim: rgba(214, 162, 74, 0.16);
  --fusion-on-accent: #1a1408;

  /* Semantic */
  --fusion-success: #7cc395;
  --fusion-warning: #e8925a;
  --fusion-danger: #ec7468;
  --fusion-info: #7fb2dc;
  --fusion-magic: #b9a0ea;

  /* Semantic washes — subtle tinted fills for badges / states */
  --fusion-success-dim: rgba(124, 195, 149, 0.15);
  --fusion-warning-dim: rgba(232, 146, 90, 0.15);
  --fusion-danger-dim: rgba(236, 116, 104, 0.15);
  --fusion-info-dim: rgba(127, 178, 220, 0.15);
  --fusion-magic-dim: rgba(185, 160, 234, 0.15);

  /* Chat system card (A022, spec 38, DEC-ACH-02/03 + REQ-ACH-025): a card's left border is
     this fixed blue regardless of sender, so "this is a system card" reads apart from
     "this is <someone>'s message". Not derived from the accent/semantic tones on purpose —
     those already carry meaning in chat (crit, fumble, blind). */
  --fusion-chat-sys: #6fa6cc;

  /* Focus ring: its own colour, never the accent, so focus never reads as "selected". */
  --fusion-focus: #9ccaff;

  /* Elevation: one soft shadow, for floating windows, popovers and menus only. */
  --fusion-shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.45);
  --fusion-shadow-popover: 0 6px 18px rgba(0, 0, 0, 0.35);

  /* Proficiency (TEML — Destreinado, Treinado, Expert, Mestre, Lendário). */
  --fusion-prof-u: var(--fusion-text-subtle);
  --fusion-prof-t: var(--fusion-info);
  --fusion-prof-e: var(--fusion-success);
  --fusion-prof-m: var(--fusion-accent);
  --fusion-prof-l: var(--fusion-magic);

  --fusion-prof-u-bg: rgba(154, 146, 127, 0.14);
  --fusion-prof-t-bg: var(--fusion-info-dim);
  --fusion-prof-e-bg: var(--fusion-success-dim);
  --fusion-prof-m-bg: var(--fusion-accent-dim);
  --fusion-prof-l-bg: var(--fusion-magic-dim);

  --fusion-prof-u-border: var(--fusion-border);
  --fusion-prof-t-border: rgba(127, 178, 220, 0.45);
  --fusion-prof-e-border: rgba(124, 195, 149, 0.45);
  --fusion-prof-m-border: rgba(214, 162, 74, 0.45);
  --fusion-prof-l-border: rgba(185, 160, 234, 0.45);

  /* Typography. rem sizes (the reader's browser zoom wins); nothing below xs. */
  --fusion-font:
    "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
    sans-serif;
  --fusion-font-mono:
    "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas,
    monospace;
  --fusion-text-xs: 0.8125rem; /* 13px — captions, badges: the floor */
  --fusion-text-sm: 0.875rem; /* 14px — dense lists, secondary text */
  --fusion-text-base: 0.9375rem; /* 15px — body */
  --fusion-text-md: 1rem; /* 16px — reading text (journal, descriptions) */
  --fusion-text-lg: 1.125rem; /* 18px — section titles */
  --fusion-text-xl: 1.375rem; /* 22px — window / sheet titles */
  --fusion-text-2xl: 1.75rem; /* 28px — the big number of a stat or a roll */
  --fusion-leading: 1.5;
  --fusion-leading-tight: 1.25;
  --fusion-tracking: 0.012em;
  --fusion-word-spacing: 0.06em;
  --fusion-weight-regular: 400;
  --fusion-weight-medium: 500;
  --fusion-weight-bold: 700;
  /* Readable line length for prose. */
  --fusion-measure: 68ch;

  /* Spacing (4px grid) */
  --fusion-space-1: 4px;
  --fusion-space-2: 8px;
  --fusion-space-3: 12px;
  --fusion-space-4: 16px;
  --fusion-space-5: 20px;
  --fusion-space-6: 24px;
  --fusion-space-8: 32px;

  /* Radii: small and few. Pills only for counters. */
  --fusion-radius-sm: 3px;
  --fusion-radius: 6px;
  --fusion-radius-lg: 8px;
  --fusion-radius-pill: 999px;

  /* Touch target floor (mouse and finger). */
  --fusion-target: 40px;

  /* Motion */
  --fusion-transition: 150ms ease;

  /* Layout.
     The side drawer is one fixed width for every tab (REQ-GAV-012, DEC-GAV-04):
     300px of panel plus a 44px rail, and no user resize — a tab that needs more
     room opens a floating window instead of stretching the drawer. */
  --fusion-sidebar-width: 300px;
  --fusion-sidebar-rail-width: 44px;
  --fusion-header-height: 48px;

  /* Layer scale (spec 11 REQ-UIF-008; spec 53 §2.7 — BAR-F1-03).
     The z-index of the shell's layers, declared in one place so nobody hard-codes a number:

       canvas
       < scene notice               60  literal in ScenePrepareNotice.svelte
       < action bar                 70  --fusion-z-actionbar
       < side drawer                90  literal in Sidebar.svelte
       < header                    100  literal in TableScreen.svelte
       < floating windows         101+  counted up by the window manager, inside the host
       < window host               200  --fusion-z-windows
       < tooltip, popover          400  --fusion-z-tooltip
       < context menu              410  --fusion-z-menu

     Tooltip, popover and menu are portaled to <body> (lib/ui/floatingLayer.ts), so these
     numbers are compared with the window host's own: the host is a stacking context at
     200, and a layer rendered *inside* a window could never rise above it.
     They also clear the in-page modals that still use literals (token dialogs 200/201, file
     picker 300/301), so a tooltip or menu opened from inside one stays visible. REQ-UIF-008
     wants modals above menus and tooltips; that is for the day modals get tokens of their own
     (above 410) — a native <dialog> is already above everything, in the top layer. */
  --fusion-z-actionbar: 70;
  --fusion-z-windows: 200;
  --fusion-z-tooltip: 400;
  --fusion-z-menu: 410;

  /* Combat turn head (spec 40, DEC-CBA-02 / REQ-CBA-021).
     The head of the turn is one fixed height for every participant — a new condition, a
     long name or a health bar must never move the advance control, which is anchored to
     the footer strip below (RNF-CBA-03). Mirrored in TS by TURN_HEAD_HEIGHT_REM /
     TURN_HEAD_FOOTER_HEIGHT_REM in lib/combat/turnHead.svelte.ts. */
  --fusion-combat-turn-head-height: 6.5rem;
  --fusion-combat-turn-head-footer-height: 2.25rem;

  /* Condition tone (DEC-CTT-11, REQ-SYS-043 / REQ-CTT-031).
     The colour of a condition chip says what the condition does to whoever carries it,
     never how grave it is: green helps, red hinders, purple is a situation (detection,
     attitude, control). Aliases rather than raw colours so the combat tab (REQ-CBA-050)
     and the contacts tab paint the same three tones. The `-dim` fills are the emphasis of
     a critical condition (REQ-CTT-032) — emphasis on the tone it already has, never a
     fourth colour. */
  --fusion-condition-benefit: var(--fusion-success);
  --fusion-condition-harm: var(--fusion-danger);
  --fusion-condition-special: var(--fusion-magic);
  --fusion-condition-benefit-dim: var(--fusion-success-dim);
  --fusion-condition-harm-dim: var(--fusion-danger-dim);
  --fusion-condition-special-dim: var(--fusion-magic-dim);

  /* The "no ar" head of the Cenas tab is one fixed height for every state
     (REQ-CEN-010/013): a long scene name, a missing background image or the
     environment row must never move the controls the GM presses all session. */
  --fusion-scene-head-height: 132px;

  /* Aliases for components written against names nobody had declared (they silently fell
     back to hard-coded colours and ignored the theme). New code uses the names above. */
  --fusion-radius-md: var(--fusion-radius);
  --fusion-surface-raised: var(--fusion-surface-alt);
  --fusion-text-on-accent: var(--fusion-on-accent);
  --fusion-accent-contrast: var(--fusion-on-accent);
  --fusion-accent-soft: var(--fusion-accent-dim);
  --fusion-warn: var(--fusion-warning);
  --fusion-color-accent: var(--fusion-accent);
  --fusion-color-accent-hover: var(--fusion-accent-hover);
  --fusion-color-on-accent: var(--fusion-on-accent);
  --fusion-color-border: var(--fusion-border);
  --fusion-color-focus: var(--fusion-focus);
  --fusion-color-hero: var(--fusion-accent);
  --fusion-color-info: var(--fusion-info);
  --fusion-color-magic: var(--fusion-magic);
  --fusion-color-success: var(--fusion-success);
  --fusion-color-warning: var(--fusion-warning);
  --fusion-color-input-bg: var(--fusion-input-bg);
  --fusion-color-surface: var(--fusion-surface);
  --fusion-color-surface-raised: var(--fusion-surface-alt);
  --fusion-color-text: var(--fusion-text);
  --fusion-color-text-primary: var(--fusion-text);
  --fusion-color-text-secondary: var(--fusion-text-muted);
  --fusion-color-text-muted: var(--fusion-text-muted);
  --fusion-color-text-subtle: var(--fusion-text-subtle);
}

      .stage .scenepill {
        position: absolute;
        left: var(--fusion-space-4);
        top: var(--fusion-space-4);
        background: var(--fusion-surface);
        border: 1px solid var(--fusion-border);
        border-radius: var(--fusion-radius);
        padding: var(--fusion-space-1) var(--fusion-space-3);
        font-size: var(--fusion-text-sm);
        color: var(--fusion-text-muted);
        display: inline-flex;
        align-items: center;
        gap: var(--fusion-space-2);
      }
      .stage .chestmark {
        position: absolute;
        left: calc(50% + 9vh);
        top: calc(50% - 5vh);
        color: var(--fusion-warning);
        text-align: center;
        --ico: 30px;
      }
      .stage .chestmark .svg-i {
        display: block;
        margin: 0 auto;
      }
      .stage .chestmark small {
        display: block;
        font-size: var(--fusion-text-xs);
        margin-top: var(--fusion-space-1);
      }

      /* ---------- Chassi C (spec 36) ---------- */
      .tabbtn {
        position: relative;
        display: grid;
        place-items: center;
        background: none;
        border: 0;
        color: var(--fusion-text-muted);
        cursor: pointer;
        padding: 0;
        --ico: 22px;
        transition:
          color var(--fusion-transition),
          background var(--fusion-transition);
      }
      .tabbtn:hover {
        color: var(--fusion-text);
      }
      .tabbtn .badge {
        position: absolute;
        top: 2px;
        right: 2px;
        min-width: 18px;
        height: 18px;
        padding: 0 var(--fusion-space-1);
        border-radius: var(--fusion-radius-pill);
        background: var(--fusion-danger);
        color: var(--fusion-bg);
        font-size: var(--fusion-text-xs);
        font-weight: var(--fusion-weight-bold);
        display: grid;
        place-items: center;
        line-height: 1;
      }
      .tabbtn .tip {
        position: absolute;
        right: calc(100% + 10px);
        top: 50%;
        transform: translateY(-50%);
        background: var(--fusion-surface-alt);
        border: 1px solid var(--fusion-border);
        color: var(--fusion-text);
        padding: var(--fusion-space-1) var(--fusion-space-2);
        border-radius: var(--fusion-radius-sm);
        font-size: var(--fusion-text-sm);
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--fusion-transition);
        box-shadow: var(--fusion-shadow-popover);
        z-index: 5;
      }
      .tabbtn:hover .tip,
      .tabbtn:focus-visible .tip {
        opacity: 1;
      }
      .sidebar {
        position: absolute;
        top: var(--fusion-header-height);
        right: 0;
        bottom: 0;
        display: flex;
        z-index: 90;
      }
      .tabs {
        width: var(--fusion-sidebar-rail-width);
        display: flex;
        flex-direction: column;
        padding: var(--fusion-space-3) 0;
        gap: var(--fusion-space-1);
        align-items: flex-end;
      }
      .tabs .tabbtn {
        width: var(--fusion-sidebar-rail-width);
        height: 44px;
        border: 1px solid var(--fusion-border);
        border-right: 0;
        border-radius: var(--fusion-radius) 0 0 var(--fusion-radius);
        background: var(--fusion-surface-alt);
      }
      .tabs .tabbtn.is-active {
        background: var(--fusion-surface);
        color: var(--fusion-text);
        border-color: var(--fusion-accent);
        z-index: 2;
      }
      .tabs .grp {
        display: flex;
        flex-direction: column;
        gap: var(--fusion-space-1);
        align-items: flex-end;
      }
      .tabs .grp.gm {
        margin-top: var(--fusion-space-4);
        position: relative;
      }
      .tabs .grp.gm::before,
      .tabs .foot::before {
        content: "";
        position: absolute;
        top: -10px;
        right: 6px;
        width: 28px;
        height: 1px;
        background: var(--fusion-border);
      }
      .tabs .foot {
        margin-top: auto;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: var(--fusion-space-1);
        align-items: flex-end;
      }
      .panel {
        width: var(--fusion-sidebar-width);
        background: var(--fusion-surface);
        border-left: 1px solid var(--fusion-accent);
        display: none;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      .is-open .panel {
        display: flex;
      }
      .panel-head {
        display: flex;
        align-items: center;
        gap: var(--fusion-space-2);
        padding: var(--fusion-space-2);
        border-bottom: 1px solid var(--fusion-border);
        flex: 0 0 auto;
      }
      .panel-title {
        font-size: var(--fusion-text-md);
        font-weight: var(--fusion-weight-bold);
        color: var(--fusion-text);
        padding: var(--fusion-space-2) var(--fusion-space-1);
        flex: 1;
      }
      .panel-body {
        flex: 1;
        overflow: auto;
        padding: var(--fusion-space-2) var(--fusion-space-2) var(--fusion-space-4);
        font-size: var(--fusion-text-base);
        min-height: 0;
      }
      .panel-foot {
        flex: 0 0 auto;
        border-top: 1px solid var(--fusion-border);
        background: var(--fusion-surface-alt);
        padding: var(--fusion-space-2);
        display: flex;
        gap: var(--fusion-space-2);
        align-items: center;
      }

      /* ---------- Peças ---------- */
      .search {
        flex: 1;
        min-width: 0;
        min-height: var(--fusion-target);
        display: flex;
        align-items: center;
        gap: var(--fusion-space-2);
        background: var(--fusion-input-bg);
        border: 1px solid var(--fusion-border);
        border-radius: var(--fusion-radius-sm);
        padding: 0 var(--fusion-space-2);
      }
      .search:focus-within {
        border-color: var(--fusion-accent);
      }
      .search input {
        flex: 1;
        min-width: 0;
        min-height: var(--fusion-target);
        background: none;
        border: 0;
        color: var(--fusion-text);
        font-size: var(--fusion-text-base);
        padding: 0;
      }
      .search .mag {
        color: var(--fusion-text-subtle);
        display: grid;
        place-items: center;
        --ico: 16px;
      }
      .hbtn {
        background: var(--fusion-surface);
        border: 1px solid var(--fusion-border);
        color: var(--fusion-text-muted);
        border-radius: var(--fusion-radius-sm);
        min-height: var(--fusion-target);
        min-width: var(--fusion-target);
        padding: 0 var(--fusion-space-3);
        font-size: var(--fusion-text-sm);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: var(--fusion-space-2);
        justify-content: center;
      }
      .hbtn:hover {
        color: var(--fusion-text);
        border-color: var(--fusion-accent);
      }
      .hbtn.wide {
        flex: 1;
      }
      .hbtn.pri {
        border-color: var(--fusion-accent);
        color: var(--fusion-text);
        background: var(--fusion-accent-dim);
      }
      .hbtn.chestb {
        border-color: var(--fusion-warning);
        color: var(--fusion-warning);
      }
      .hbtn.chestb:hover {
        background: var(--fusion-warning-dim);
      }
      .hbtn .svg-i {
        --ico: 16px;
      }

      .sec {
        margin: var(--fusion-space-4) 0 var(--fusion-space-1);
        display: flex;
        align-items: center;
        gap: var(--fusion-space-2);
        padding: 0 var(--fusion-space-1);
        min-height: 28px;
      }
      .sec:first-child {
        margin-top: var(--fusion-space-1);
      }
      .sec .lbl {
        font-size: var(--fusion-text-sm);
        font-weight: var(--fusion-weight-bold);
        color: var(--fusion-text-muted);
        display: inline-flex;
        align-items: center;
        gap: var(--fusion-space-1);
      }
      .sec.pinned .lbl {
        color: var(--fusion-accent);
      }
      .sec .cnt {
        font-size: var(--fusion-text-xs);
        font-family: var(--fusion-font-mono);
        color: var(--fusion-text-muted);
        background: var(--fusion-surface-alt);
        border-radius: var(--fusion-radius-pill);
        padding: 0 var(--fusion-space-2);
      }
      .sec .line {
        flex: 1;
        height: 1px;
        background: var(--fusion-border);
      }
      .sec .add {
        background: none;
        border: 0;
        color: var(--fusion-text-muted);
        cursor: pointer;
        font-size: var(--fusion-text-sm);
        min-height: var(--fusion-target);
        padding: 0 var(--fusion-space-2);
        display: inline-flex;
        align-items: center;
        gap: var(--fusion-space-1);
      }
      .sec .add:hover {
        color: var(--fusion-text);
      }
      .sec.drop-ok {
        outline: 1px dashed var(--fusion-accent);
        outline-offset: 2px;
        border-radius: var(--fusion-radius-sm);
      }

      /* ---------- Árvore de pastas ---------- */
      .fold {
        display: flex;
        align-items: center;
        gap: var(--fusion-space-2);
        padding: var(--fusion-space-1);
        min-height: var(--fusion-target);
        border-radius: var(--fusion-radius-sm);
        cursor: pointer;
        color: var(--fusion-text-muted);
        user-select: none;
        position: relative;
      }
      .fold:hover {
        background: var(--fusion-surface-alt);
        color: var(--fusion-text);
      }
      .fold.drop-ok {
        background: var(--fusion-accent-dim);
        outline: 1px solid var(--fusion-accent);
        color: var(--fusion-text);
      }
      .fold .chev {
        color: var(--fusion-text-subtle);
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        --ico: 14px;
      }
      .fold .chev .svg-i {
        transition: transform var(--fusion-transition);
      }
      .fold .chev.open .svg-i {
        transform: rotate(90deg);
      }
      .fold .pinmark {
        color: var(--fusion-accent);
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        --ico: 14px;
      }
      .fold .fn {
        font-size: var(--fusion-text-base);
        font-weight: var(--fusion-weight-bold);
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .fold .path {
        font-size: var(--fusion-text-xs);
        color: var(--fusion-text-subtle);
        flex: 0 0 auto;
      }
      .fold .cnt {
        font-size: var(--fusion-text-xs);
        font-family: var(--fusion-font-mono);
        color: var(--fusion-text-muted);
        margin-left: auto;
        flex: 0 0 auto;
      }
      /* ferramentas: sobrepõem o fim da linha em hover/foco; em toque entram no fluxo */
      .fold .tools {
        display: none;
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        background: var(--fusion-surface-alt);
        border-radius: var(--fusion-radius-sm);
        align-items: center;
      }
      .fold:hover .tools,
      .fold:focus-within .tools {
        display: flex;
      }
      .tools button {
        background: none;
        border: 0;
        color: var(--fusion-text-muted);
        cursor: pointer;
        min-width: var(--fusion-target);
        min-height: var(--fusion-target);
        display: grid;
        place-items: center;
        --ico: 16px;
        border-radius: var(--fusion-radius-sm);
      }
      .tools button:hover {
        color: var(--fusion-text);
        background: var(--fusion-accent-dim);
      }
      .tools button.del:hover {
        color: var(--fusion-danger);
      }
      .tools button.pinb.on {
        color: var(--fusion-accent);
      }
      .fold input {
        background: var(--fusion-input-bg);
        border: 1px solid var(--fusion-accent);
        border-radius: var(--fusion-radius-sm);
        color: var(--fusion-text);
        font-size: var(--fusion-text-base);
        min-height: 32px;
        padding: 0 var(--fusion-space-2);
        flex: 1;
        min-width: 0;
      }
      .kids {
        margin-left: var(--fusion-space-3);
        padding-left: var(--fusion-space-2);
        border-left: 1px solid var(--fusion-border);
      }

      /* ---------- Linha de ator ---------- */
      .act {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) auto;
        column-gap: var(--fusion-space-2);
        align-items: center;
        padding: var(--fusion-space-1);
        border-radius: var(--fusion-radius-sm);
        cursor: grab;
        position: relative;
      }
      .act:hover {
        background: var(--fusion-surface-alt);
      }
      .act.sel {
        background: var(--fusion-accent-dim);
        outline: 1px solid var(--fusion-accent);
      }
      .act.dragging {
        opacity: 0.4;
      }
      .act .av {
        grid-row: 1;
        width: 28px;
        height: 28px;
        border-radius: var(--fusion-radius-pill);
        display: grid;
        place-items: center;
        font-size: var(--fusion-text-xs);
        font-weight: var(--fusion-weight-bold);
        background: var(--fusion-surface-alt);
        border: 2px solid currentColor;
      }
      .act .av.hz {
        border-radius: var(--fusion-radius-sm);
      }
      .act .idt {
        min-width: 0;
        grid-column: 2;
      }
      .act .nm {
        font-size: var(--fusion-text-base);
        color: var(--fusion-text);
        display: block;
        overflow-wrap: anywhere;
      }
      .act .ttl {
        font-size: var(--fusion-text-sm);
        color: var(--fusion-text-muted);
        display: flex;
        align-items: center;
        gap: var(--fusion-space-1);
        min-width: 0;
      }
      .act .ttl > span:first-child {
        overflow-wrap: anywhere;
      }
      .act .ttl.fallback > span {
        color: var(--fusion-text-subtle);
      }
      .act .ttl .pen {
        background: none;
        border: 0;
        padding: 0;
        color: var(--fusion-text-subtle);
        cursor: text;
        opacity: 0;
        transition: opacity var(--fusion-transition);
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        --ico: 14px;
        position: relative;
      }
      .act .ttl .pen::after {
        content: "";
        position: absolute;
        inset: -12px -10px;
      }
      .act:hover .ttl .pen,
      .act:focus-within .ttl .pen {
        opacity: 1;
      }
      .act .ttl input {
        flex: 1;
        min-width: 0;
        background: var(--fusion-input-bg);
        border: 1px solid var(--fusion-accent);
        border-radius: var(--fusion-radius-sm);
        color: var(--fusion-text);
        font-size: var(--fusion-text-sm);
        min-height: 28px;
        padding: 0 var(--fusion-space-2);
      }
      .act > .att {
        grid-column: 3;
        grid-row: 1;
      }
      .act .under {
        grid-column: 2 / 4;
        grid-row: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--fusion-space-2);
        min-height: 24px;
      }
      .act .meta {
        display: flex;
        align-items: center;
        gap: var(--fusion-space-3);
        flex: 0 0 auto;
      }
      /* ferramentas da linha: área de 40px, mas a linha continua baixa (margem negativa) */
      .act .tools {
        display: flex;
        visibility: hidden;
        margin-block: calc((var(--fusion-target) - 24px) / -2);
      }
      .act:hover .tools,
      .act:focus-within .tools {
        visibility: visible;
      }

      /* atitude: sempre visível, cicla no clique */
      .att {
        background: none;
        border: 1px solid transparent;
        cursor: pointer;
        min-width: var(--fusion-target);
        min-height: var(--fusion-target);
        margin: calc((var(--fusion-target) - 28px) / -2) 0;
        display: grid;
        place-items: center;
        --ico: 18px;
        border-radius: var(--fusion-radius-sm);
        flex: 0 0 auto;
      }
      .att:hover {
        border-color: currentColor;
      }
      .att.ally {
        color: var(--fusion-success);
      }
      .att.neutral {
        color: var(--fusion-text-muted);
      }
      .att.foe {
        color: var(--fusion-danger);
      }

      .lvl {
        font-size: var(--fusion-text-xs);
        font-family: var(--fusion-font-mono);
        color: var(--fusion-text-muted);
        border-bottom: 1px solid var(--fusion-border-strong);
      }
      .tok {
        font-size: var(--fusion-text-xs);
        font-family: var(--fusion-font-mono);
        color: var(--fusion-text-muted);
        cursor: default;
        display: inline-flex;
        align-items: center;
        gap: var(--fusion-space-1);
      }
      .know {
        font-size: var(--fusion-text-xs);
        font-family: var(--fusion-font-mono);
        cursor: default;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: var(--fusion-space-2);
      }
      .know > span {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }

      /* menu de mover para pasta (convive com o arraste) */
      .movemenu {
        margin: var(--fusion-space-1) 0 var(--fusion-space-2) var(--fusion-space-6);
        padding: var(--fusion-space-2) 0;
        border-top: 1px solid var(--fusion-border);
        border-bottom: 1px solid var(--fusion-border);
        display: flex;
        flex-wrap: wrap;
        gap: var(--fusion-space-1);
      }
      .movemenu button {
        background: none;
        border: 1px solid var(--fusion-border);
        border-radius: var(--fusion-radius-sm);
        color: var(--fusion-text-muted);
        font-size: var(--fusion-text-sm);
        min-height: var(--fusion-target);
        padding: 0 var(--fusion-space-3);
        cursor: pointer;
      }
      .movemenu button:hover {
        border-color: var(--fusion-accent);
        color: var(--fusion-text);
      }
      .movemenu button.on {
        border-color: var(--fusion-accent);
        color: var(--fusion-text);
        background: var(--fusion-accent-dim);
      }

      /* --- condições (contrato herdado da 39) --- */
      .conds {
        display: flex;
        gap: var(--fusion-space-1);
        flex-wrap: wrap;
        margin: var(--fusion-space-1) 0 var(--fusion-space-2) var(--fusion-space-8);
      }
      .chip {
        font-size: var(--fusion-text-xs);
        border-radius: var(--fusion-radius-sm);
        padding: 0 var(--fusion-space-2);
        border: 1px solid var(--fusion-border);
        color: var(--fusion-text-muted);
        white-space: nowrap;
        cursor: default;
        position: relative;
      }
      .chip .v {
        font-family: var(--fusion-font-mono);
        font-weight: var(--fusion-weight-bold);
      }
      .chip.harm {
        border-color: var(--fusion-condition-harm);
        color: var(--fusion-condition-harm);
        background: var(--fusion-condition-harm-dim);
      }
      .chip.benefit {
        border-color: var(--fusion-condition-benefit);
        color: var(--fusion-condition-benefit);
        background: var(--fusion-condition-benefit-dim);
      }
      .chip.special {
        border-color: var(--fusion-condition-special);
        color: var(--fusion-condition-special);
        background: var(--fusion-condition-special-dim);
      }
      .chip.crit {
        background: var(--fusion-danger);
        border-color: var(--fusion-danger);
        color: var(--fusion-bg);
        font-weight: var(--fusion-weight-bold);
      }
      .chip.more {
        cursor: pointer;
        border-style: dashed;
        color: var(--fusion-text-muted);
        background: none;
        font-size: var(--fusion-text-xs);
      }
      .chip.more::after {
        content: "";
        position: absolute;
        inset: -12px -8px;
      }
      .chip.more:hover {
        color: var(--fusion-text);
        border-color: var(--fusion-accent);
      }

      /* sub-personagem encapsulado (DEC-CTT-06): recuo + linha-guia, sem cartão */
      .sub {
        display: flex;
        align-items: center;
        gap: var(--fusion-space-2);
        margin: 0 0 var(--fusion-space-1) var(--fusion-space-8);
        padding: var(--fusion-space-1) var(--fusion-space-2);
        border-left: 2px solid var(--fusion-border);
        cursor: grab;
      }
      .sub:hover {
        border-left-color: var(--fusion-accent);
      }
      .sub .nm {
        font-size: var(--fusion-text-sm);
        color: var(--fusion-text);
      }
      .sub .sb {
        font-size: var(--fusion-text-xs);
        color: var(--fusion-text-subtle);
        margin-left: auto;
      }

      .vazio {
        border-top: 1px solid var(--fusion-border);
        border-bottom: 1px solid var(--fusion-border);
        padding: var(--fusion-space-4) var(--fusion-space-2);
        text-align: center;
        color: var(--fusion-text-subtle);
        font-size: var(--fusion-text-base);
        margin: var(--fusion-space-3) 0;
      }
      .vazio b {
        color: var(--fusion-text-muted);
      }
      .hint {
        color: var(--fusion-text-subtle);
        font-size: var(--fusion-text-sm);
        text-align: center;
        padding: var(--fusion-space-3) var(--fusion-space-1) 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: var(--fusion-space-2);
        padding: var(--fusion-space-2);
        min-height: var(--fusion-target);
        border-radius: var(--fusion-radius-sm);
        color: var(--fusion-text-muted);
      }
      .row:hover {
        background: var(--fusion-surface-alt);
      }
      .row .name {
        color: var(--fusion-text);
        font-size: var(--fusion-text-base);
      }
      .row .sub2 {
        color: var(--fusion-text-subtle);
        font-size: var(--fusion-text-sm);
        margin-left: auto;
        display: inline-flex;
        align-items: center;
      }
      .empty {
        text-align: center;
        padding: var(--fusion-space-6) 0 var(--fusion-space-3);
        color: var(--fusion-text-muted);
      }

      #tip {
        position: fixed;
        z-index: 9998;
        max-width: 260px;
        background: var(--fusion-surface-alt);
        border: 1px solid var(--fusion-border);
        border-radius: var(--fusion-radius-sm);
        padding: var(--fusion-space-2) var(--fusion-space-3);
        font-size: var(--fusion-text-sm);
        color: var(--fusion-text);
        box-shadow: var(--fusion-shadow-popover);
        pointer-events: none;
        display: none;
      }
      #tip b {
        display: block;
        margin-bottom: var(--fusion-space-1);
      }
      #tip .tone {
        color: var(--fusion-text-subtle);
        font-size: var(--fusion-text-xs);
        margin-top: var(--fusion-space-1);
        display: block;
      }
      #tip .nohelp {
        color: var(--fusion-text-subtle);
      }

      /* janela (spec 11) */
      .win {
        position: fixed;
        top: 84px;
        left: calc(50% - 300px);
        width: 600px;
        max-width: calc(100vw - 16px);
        background: var(--fusion-surface);
        border: 1px solid var(--fusion-border-strong);
        border-radius: var(--fusion-radius);
        box-shadow: var(--fusion-shadow-modal);
        z-index: 500;
        overflow: hidden;
      }
      .win.danger {
        border-color: var(--fusion-danger);
      }
      .win .wh {
        display: flex;
        align-items: center;
        gap: var(--fusion-space-2);
        padding: var(--fusion-space-1) var(--fusion-space-3);
        min-height: 48px;
        background: var(--fusion-surface-alt);
        border-bottom: 1px solid var(--fusion-border);
        font-size: var(--fusion-text-md);
        font-weight: var(--fusion-weight-bold);
      }
      .win .wh .x {
        margin-left: auto;
        background: none;
        border: 0;
        color: var(--fusion-text-muted);
        cursor: pointer;
        min-width: var(--fusion-target);
        min-height: var(--fusion-target);
        display: grid;
        place-items: center;
        --ico: 18px;
      }
      .win .wb {
        padding: var(--fusion-space-3) var(--fusion-space-4) var(--fusion-space-4);
        color: var(--fusion-text-muted);
        font-size: var(--fusion-text-base);
        max-height: 62vh;
        overflow: auto;
      }
      .win .wb b {
        color: var(--fusion-text);
      }
      .win .note {
        margin-top: var(--fusion-space-3);
        padding-top: var(--fusion-space-3);
        border-top: 1px solid var(--fusion-border);
        color: var(--fusion-text-subtle);
        font-size: var(--fusion-text-sm);
      }
      .win .wf {
        display: flex;
        gap: var(--fusion-space-2);
        justify-content: flex-end;
        padding: var(--fusion-space-3) var(--fusion-space-4);
        border-top: 1px solid var(--fusion-border);
      }
      .field {
        display: flex;
        align-items: center;
        gap: var(--fusion-space-2);
        margin: var(--fusion-space-2) 0;
        min-height: var(--fusion-target);
      }
      .field > label {
        width: 64px;
        color: var(--fusion-text-subtle);
        font-size: var(--fusion-text-sm);
        flex: 0 0 auto;
      }
      .field input,
      .field select {
        flex: 1;
        min-width: 0;
        background: var(--fusion-input-bg);
        border: 1px solid var(--fusion-border);
        border-radius: var(--fusion-radius-sm);
        color: var(--fusion-text);
        font-size: var(--fusion-text-base);
        min-height: var(--fusion-target);
        padding: 0 var(--fusion-space-2);
      }
      .field input:focus,
      .field select:focus {
        border-color: var(--fusion-accent);
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: var(--fusion-space-2);
        flex: 1;
      }
      .pills button {
        background: var(--fusion-surface-alt);
        border: 1px solid var(--fusion-border);
        color: var(--fusion-text-muted);
        border-radius: var(--fusion-radius-sm);
        font-size: var(--fusion-text-sm);
        min-height: var(--fusion-target);
        padding: 0 var(--fusion-space-3);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: var(--fusion-space-2);
      }
      .pills button:hover {
        color: var(--fusion-text);
        border-color: var(--fusion-accent);
      }
      .pills button.on {
        background: var(--fusion-accent-dim);
        border-color: var(--fusion-accent);
        color: var(--fusion-text);
        font-weight: var(--fusion-weight-bold);
      }
      .pills button.on.ally {
        color: var(--fusion-success);
        border-color: var(--fusion-success);
        background: var(--fusion-success-dim);
      }
      .pills button.on.foe {
        color: var(--fusion-danger);
        border-color: var(--fusion-danger);
        background: var(--fusion-danger-dim);
      }
      .wtabs {
        display: flex;
        gap: var(--fusion-space-2);
        border-bottom: 1px solid var(--fusion-border);
        padding: 0 var(--fusion-space-4);
        background: var(--fusion-surface-alt);
      }
      .wtabs button {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        color: var(--fusion-text-muted);
        font-size: var(--fusion-text-base);
        min-height: var(--fusion-target);
        padding: 0 var(--fusion-space-2);
        cursor: pointer;
      }
      .wtabs button:hover {
        color: var(--fusion-text);
      }
      .wtabs button.on {
        color: var(--fusion-text);
        border-bottom-color: var(--fusion-accent);
        font-weight: var(--fusion-weight-bold);
      }
      .browser {
        border-top: 1px solid var(--fusion-border);
        border-bottom: 1px solid var(--fusion-border);
        max-height: 240px;
        overflow: auto;
        margin-top: var(--fusion-space-2);
      }
      .brow {
        display: flex;
        align-items: center;
        gap: var(--fusion-space-2);
        padding: var(--fusion-space-1) var(--fusion-space-2);
        min-height: var(--fusion-target);
        border-bottom: 1px solid var(--fusion-border);
        cursor: pointer;
      }
      .brow:last-child {
        border-bottom: 0;
      }
      .brow:hover {
        background: var(--fusion-surface-alt);
      }
      .brow.on {
        background: var(--fusion-accent-dim);
        outline: 1px solid var(--fusion-accent);
      }
      .brow .av {
        width: 28px;
        height: 28px;
        border-radius: var(--fusion-radius-pill);
        display: grid;
        place-items: center;
        font-size: var(--fusion-text-xs);
        font-weight: var(--fusion-weight-bold);
        background: var(--fusion-surface-alt);
        border: 2px solid currentColor;
        flex: 0 0 auto;
      }
      .brow .bn {
        color: var(--fusion-text);
        font-size: var(--fusion-text-base);
        flex: 1;
        min-width: 0;
      }
      .brow .bs {
        font-size: var(--fusion-text-xs);
        color: var(--fusion-text-subtle);
      }
      .warnbox,
      .stopbox {
        margin-top: var(--fusion-space-3);
        padding: var(--fusion-space-1) 0 var(--fusion-space-1) var(--fusion-space-3);
        font-size: var(--fusion-text-sm);
      }
      .warnbox {
        border-left: 3px solid var(--fusion-warning);
        color: var(--fusion-warning);
      }
      .stopbox {
        border-left: 3px solid var(--fusion-danger);
        color: var(--fusion-danger);
      }
      .win .wb .warnbox b {
        color: var(--fusion-warning);
      }
      .win .wb .stopbox b {
        color: var(--fusion-danger);
      }
      .conseq {
        list-style: none;
        margin: var(--fusion-space-2) 0 0;
        padding: 0;
      }
      .conseq li {
        display: flex;
        gap: var(--fusion-space-2);
        align-items: flex-start;
        padding: var(--fusion-space-2) 0;
        border-bottom: 1px solid var(--fusion-border);
        font-size: var(--fusion-text-base);
      }
      .conseq li:last-child {
        border-bottom: 0;
      }
      .conseq li .svg-i {
        --ico: 16px;
        margin-top: 3px;
        color: var(--fusion-text-subtle);
      }
      .btn-danger {
        background: var(--fusion-danger);
        border: 1px solid var(--fusion-danger);
        color: var(--fusion-bg);
        border-radius: var(--fusion-radius-sm);
        min-height: var(--fusion-target);
        padding: 0 var(--fusion-space-4);
        font-size: var(--fusion-text-sm);
        font-weight: var(--fusion-weight-bold);
        cursor: pointer;
      }
      .btn-danger[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-ghost {
        background: var(--fusion-surface-alt);
        border: 1px solid var(--fusion-border);
        color: var(--fusion-text-muted);
        border-radius: var(--fusion-radius-sm);
        min-height: var(--fusion-target);
        padding: 0 var(--fusion-space-4);
        font-size: var(--fusion-text-sm);
        cursor: pointer;
      }
      .btn-ghost:hover {
        color: var(--fusion-text);
      }
      .keys {
        display: flex;
        gap: var(--fusion-space-4);
        flex-wrap: wrap;
        margin: var(--fusion-space-2) 0 var(--fusion-space-1);
        font-size: var(--fusion-text-sm);
      }
      .keys span {
        display: flex;
        align-items: center;
        gap: var(--fusion-space-2);
        color: var(--fusion-text-subtle);
      }
      .keys .kic {
        display: inline-flex;
        --ico: 18px;
      }
      .keys .kex {
        display: inline-block;
        width: 18px;
        border-bottom: 2px solid currentColor;
        height: 16px;
      }
      .k0 {
        color: var(--fusion-text-subtle);
      }
      .k1 {
        color: var(--fusion-warning);
      }
      .k2 {
        color: var(--fusion-success);
      }
      .matrix {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--fusion-text-sm);
        margin-top: var(--fusion-space-2);
      }
      .matrix th,
      .matrix td {
        border-bottom: 1px solid var(--fusion-border);
        padding: var(--fusion-space-1) var(--fusion-space-2);
        text-align: center;
        vertical-align: middle;
      }
      .matrix thead th {
        color: var(--fusion-text-muted);
        font-weight: var(--fusion-weight-bold);
        font-size: var(--fusion-text-sm);
        background: var(--fusion-surface-alt);
        cursor: pointer;
        user-select: none;
      }
      .matrix thead th:hover {
        color: var(--fusion-text);
      }
      .matrix thead th:first-child {
        cursor: default;
        text-align: left;
      }
      .matrix thead th small {
        display: block;
        color: var(--fusion-text-subtle);
        font-size: var(--fusion-text-xs);
        font-weight: var(--fusion-weight-regular);
      }
      .matrix td.nm {
        text-align: left;
        color: var(--fusion-text);
        cursor: pointer;
      }
      .matrix td.nm:hover {
        color: var(--fusion-accent-hover);
      }
      .matrix td.nm small {
        display: block;
        color: var(--fusion-text-subtle);
        font-size: var(--fusion-text-xs);
      }
      .matrix td button.cell {
        background: none;
        border: 0;
        cursor: pointer;
        --ico: 20px;
        width: 100%;
        min-width: var(--fusion-target);
        min-height: var(--fusion-target);
        display: grid;
        place-items: center;
        border-radius: var(--fusion-radius-sm);
      }
      .matrix td button.cell:hover {
        background: var(--fusion-surface-alt);
      }
      .matrix td button.cell.ex .svg-i {
        border-bottom: 2px solid currentColor;
        padding-bottom: 2px;
        box-sizing: content-box;
      }

      /* ---------- Switcher + legenda (ferramental do protótipo, camada flutuante) ---------- */
      .switcher {
        position: fixed;
        left: 50%;
        bottom: var(--fusion-space-4);
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: var(--fusion-space-2);
        background: var(--fusion-surface-alt);
        color: var(--fusion-text);
        border: 1px solid var(--fusion-border-strong);
        border-radius: var(--fusion-radius-lg);
        padding: var(--fusion-space-1) var(--fusion-space-2);
        box-shadow: var(--fusion-shadow-popover);
        font-size: var(--fusion-text-sm);
      }
      .switcher button {
        border: 1px solid var(--fusion-border);
        background: var(--fusion-surface);
        color: var(--fusion-text);
        min-height: var(--fusion-target);
        padding: 0 var(--fusion-space-3);
        border-radius: var(--fusion-radius);
        cursor: pointer;
        font-size: var(--fusion-text-sm);
      }
      .switcher button.alt {
        border-color: var(--fusion-accent);
      }
      .legend {
        position: fixed;
        left: var(--fusion-space-4);
        bottom: var(--fusion-space-4);
        z-index: 9999;
        background: var(--fusion-surface-alt);
        color: var(--fusion-text);
        border: 1px solid var(--fusion-border-strong);
        border-radius: var(--fusion-radius-lg);
        padding: var(--fusion-space-3);
        box-shadow: var(--fusion-shadow-popover);
        font-size: var(--fusion-text-xs);
        max-width: 420px;
        max-height: 60vh;
        overflow: auto;
      }
      .legend h4 {
        margin: 0 0 var(--fusion-space-2);
        font-size: var(--fusion-text-sm);
      }
      .legend td {
        padding: var(--fusion-space-1);
        vertical-align: top;
      }
      .legend td:first-child {
        color: var(--fusion-text-muted);
        white-space: nowrap;
      }
      .legend b {
        color: var(--fusion-text);
      }
      .legend .sw {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: var(--fusion-radius-pill);
        margin-right: var(--fusion-space-1);
      }
      .legend .sw.harm {
        background: var(--fusion-condition-harm);
      }
      .legend .sw.benefit {
        background: var(--fusion-condition-benefit);
      }
      .legend .sw.special {
        background: var(--fusion-condition-special);
      }
      .legend .q {
        margin-top: var(--fusion-space-2);
        padding-top: var(--fusion-space-2);
        border-top: 1px solid var(--fusion-border);
        color: var(--fusion-text-muted);
      }
      .legend .q.last {
        border: 0;
        padding-top: var(--fusion-space-1);
      }

      /* ação revelada no hover também aparece em toque */
      @media (hover: none) {
        .act .tools {
          visibility: visible;
        }
        .act .ttl .pen {
          opacity: 1;
        }
        .fold .tools {
          display: flex;
          position: static;
          width: 100%;
          justify-content: flex-end;
          background: none;
        }
        .fold {
          flex-wrap: wrap;
        }
        .tabbtn .tip {
          display: none;
        }
      }
    </style>
  </head>

    <script>
      (function () {
        var b = document.getElementById("theme-toggle");
        function paint() { b.textContent = "Tema: " + (document.documentElement.dataset.theme === "light" ? "claro" : "escuro"); }
        b.addEventListener("click", function () {
          document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
          paint();
        });
        paint();
      })();
    </script>

          ex[n.id] = {};
          PCS.forEach((p, i) => {
            if (vals[i] !== rule[n.id]) ex[n.id][p.id] = vals[i];
          });
        });

        if (v === (rule[n] ?? 0)) delete ex[n][p];

      function condsHtml(n) {

        const shown = isExp ? sorted : sorted.slice(0, 2);
        const rest = sorted.length - shown.length;
        const chips = shown

            const d = COND[c.slug] || {};
