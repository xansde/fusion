<!-- Atualizado para a linguagem visual de 22/10/2026 (lane ui-gaveta). Fonte dos tokens: packages/client/src/styles/base.css. -->
<!--
  PROTOTYPE — descartável. Não é código de produção; não importar nada daqui.
  Rodada 1 (três variantes: fila clássica, cabeça de turno, cronograma) está no
  histórico do arquivo — commit "aba Combate - 3 variantes para o grill".

  O QUE O ALEXANDRE DECIDIU NESTA RODADA (2026-08-16)
   1. CABEÇA DE TURNO (variante B) é o desenho. Quem age agora ocupa o topo;
      a fila rotaciona embaixo.
   2. ALTURA FIXA da cabeça: o botão de avançar fica SEMPRE no mesmo pixel,
      para o Mestre passar vários turnos em sequência sem perseguir o botão.
      A cabeça PODE crescer para mostrar tudo (expandir "+N" de condições),
      mas VOLTA ao padrão ao avançar para o próximo da iniciativa.
   3. VIDA: jogador NUNCA vê vida de criatura. O Mestre PRECISA ver, e vê
      barra + número. O jogador VÊ a vida dos personagens de jogador (fechado
      na rodada 3) — é a mesma vida que o painel de Comitiva do Hub já mostra.
   4. INICIATIVA SEM NÚMERO em andamento: o número só importa para montar a
      ordem, e some quando o combate começa. Na montagem ele aparece (é o que
      define a fila); em andamento o Mestre reordena pela alça de arrastar.
   5. MARCAR ALVO SAIU da aba: targeting é assunto de outra spec.
   6. Adicionar continua popover (Q5 fechada).
   7. TOKEN NÃO EXISTE COMO CONCEITO DEFINIDO. "Token está muito mal definido e
      precisa ser refeita TODA a spec. Nada definida ainda" (Alexandre, rodada
      3). Consequência aqui: a aba fala em PARTICIPANTES e em "criaturas na
      cena"; nunca em "token". De onde a lista de candidatos vem, e o que é a
      coisa adicionada, ficam pendurados na spec de Token que ainda será
      escrita — é a lacuna estrutural que mais justifica esta aba nascer WIP.

  BADGE (Q1 fechada): ponto de estado enquanto o combate corre; ÂMBAR quando é
  a sua vez. QUEM ENCERRA O TURNO (Q3 fechada): o jogador encerra o próprio.

  A ABA NASCE WIP, E ISSO É PROPOSITAL
  Fora do combate em andamento esta aba tem pouco a fazer; a régua real só
  aparece quando a mesa jogar um encontro inteiro. A spec-filha registra o que
  está decidido e deixa em Q- o que depende de rodar de verdade (economia de
  ações, dano, efeitos de fim de turno, delay/ready — spec 10 e 15).

  AINDA EM ABERTO (é o que o próximo grill fecha)
   Q1 — Badge: ponto de estado enquanto o combate corre (DEC-GAV-06), ou muda
        de cor quando é a sua vez? (aqui: âmbar = sua vez)
   Q2 — Vida dos personagens de jogador para o jogador: aparece? (aqui: sim)
   Q3 — O jogador encerra o próprio turno, ou só o Mestre avança? (aqui: sim)
   Q6 — Combate encerrado: some da aba na hora ou vira resumo até fechar?
   Q7 — Como a aba chama o que é adicionado: "token", "criatura da cena"?
-->

:root {
  color-scheme: dark;

  /* Surfaces: warm charcoal, three flat steps. */
  --fusion-bg: #141311;
  --fusion-surface: #1c1b18;
  --fusion-surface-alt: #25231f;
  --fusion-input-bg: #11100e;
  --fusion-border: #3b3830;
  --fusion-border-strong: #575245;

  /* Text: off-white, never #fff. Muted and subtle stay AA on every surface. */
  --fusion-text: #ebe5d6;
  --fusion-text-muted: #b8b09e;
  --fusion-text-subtle: #9a927f;

  /* The one accent — brass. Interactive and "selected" only, never decoration. */
  --fusion-accent: #d6a24a;
  --fusion-accent-hover: #e4b765;
  --fusion-accent-dim: rgba(214, 162, 74, 0.16);
  --fusion-on-accent: #1a1408;

  /* Semantic */
  --fusion-success: #7cc395;
  --fusion-warning: #e8925a;
  --fusion-danger: #ec7468;
  --fusion-info: #7fb2dc;
  --fusion-magic: #b9a0ea;

  /* Semantic washes — subtle tinted fills for badges / states */
  --fusion-success-dim: rgba(124, 195, 149, 0.15);
  --fusion-warning-dim: rgba(232, 146, 90, 0.15);
  --fusion-danger-dim: rgba(236, 116, 104, 0.15);
  --fusion-info-dim: rgba(127, 178, 220, 0.15);
  --fusion-magic-dim: rgba(185, 160, 234, 0.15);

  /* Chat system card (A022, spec 38, DEC-ACH-02/03 + REQ-ACH-025): a card's left border is
     this fixed blue regardless of sender, so "this is a system card" reads apart from
     "this is <someone>'s message". Not derived from the accent/semantic tones on purpose —
     those already carry meaning in chat (crit, fumble, blind). */
  --fusion-chat-sys: #6fa6cc;

  /* Focus ring: its own colour, never the accent, so focus never reads as "selected". */
  --fusion-focus: #9ccaff;

  /* Elevation: one soft shadow, for floating windows, popovers and menus only. */
  --fusion-shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.45);
  --fusion-shadow-popover: 0 6px 18px rgba(0, 0, 0, 0.35);

  /* Proficiency (TEML — Destreinado, Treinado, Expert, Mestre, Lendário). */
  --fusion-prof-u: var(--fusion-text-subtle);
  --fusion-prof-t: var(--fusion-info);
  --fusion-prof-e: var(--fusion-success);
  --fusion-prof-m: var(--fusion-accent);
  --fusion-prof-l: var(--fusion-magic);

  --fusion-prof-u-bg: rgba(154, 146, 127, 0.14);
  --fusion-prof-t-bg: var(--fusion-info-dim);
  --fusion-prof-e-bg: var(--fusion-success-dim);
  --fusion-prof-m-bg: var(--fusion-accent-dim);
  --fusion-prof-l-bg: var(--fusion-magic-dim);

  --fusion-prof-u-border: var(--fusion-border);
  --fusion-prof-t-border: rgba(127, 178, 220, 0.45);
  --fusion-prof-e-border: rgba(124, 195, 149, 0.45);
  --fusion-prof-m-border: rgba(214, 162, 74, 0.45);
  --fusion-prof-l-border: rgba(185, 160, 234, 0.45);

  /* Typography. rem sizes (the reader's browser zoom wins); nothing below xs. */
  --fusion-font:
    "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
    sans-serif;
  --fusion-font-mono:
    "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas,
    monospace;
  --fusion-text-xs: 0.8125rem; /* 13px — captions, badges: the floor */
  --fusion-text-sm: 0.875rem; /* 14px — dense lists, secondary text */
  --fusion-text-base: 0.9375rem; /* 15px — body */
  --fusion-text-md: 1rem; /* 16px — reading text (journal, descriptions) */
  --fusion-text-lg: 1.125rem; /* 18px — section titles */
  --fusion-text-xl: 1.375rem; /* 22px — window / sheet titles */
  --fusion-text-2xl: 1.75rem; /* 28px — the big number of a stat or a roll */
  --fusion-leading: 1.5;
  --fusion-leading-tight: 1.25;
  --fusion-tracking: 0.012em;
  --fusion-word-spacing: 0.06em;
  --fusion-weight-regular: 400;
  --fusion-weight-medium: 500;
  --fusion-weight-bold: 700;
  /* Readable line length for prose. */
  --fusion-measure: 68ch;

  /* Spacing (4px grid) */
  --fusion-space-1: 4px;
  --fusion-space-2: 8px;
  --fusion-space-3: 12px;
  --fusion-space-4: 16px;
  --fusion-space-5: 20px;
  --fusion-space-6: 24px;
  --fusion-space-8: 32px;

  /* Radii: small and few. Pills only for counters. */
  --fusion-radius-sm: 3px;
  --fusion-radius: 6px;
  --fusion-radius-lg: 8px;
  --fusion-radius-pill: 999px;

  /* Touch target floor (mouse and finger). */
  --fusion-target: 40px;

  /* Motion */
  --fusion-transition: 150ms ease;

  /* Layout.
     The side drawer is one fixed width for every tab (REQ-GAV-012, DEC-GAV-04):
     300px of panel plus a 44px rail, and no user resize — a tab that needs more
     room opens a floating window instead of stretching the drawer. */
  --fusion-sidebar-width: 300px;
  --fusion-sidebar-rail-width: 44px;
  --fusion-header-height: 48px;

  /* Layer scale (spec 11 REQ-UIF-008; spec 53 §2.7 — BAR-F1-03).
     The z-index of the shell's layers, declared in one place so nobody hard-codes a number:

       canvas
       < scene notice               60  literal in ScenePrepareNotice.svelte
       < action bar                 70  --fusion-z-actionbar
       < side drawer                90  literal in Sidebar.svelte
       < header                    100  literal in TableScreen.svelte
       < floating windows         101+  counted up by the window manager, inside the host
       < window host               200  --fusion-z-windows
       < tooltip, popover          400  --fusion-z-tooltip
       < context menu              410  --fusion-z-menu

     Tooltip, popover and menu are portaled to <body> (lib/ui/floatingLayer.ts), so these
     numbers are compared with the window host's own: the host is a stacking context at
     200, and a layer rendered *inside* a window could never rise above it.
     They also clear the in-page modals that still use literals (token dialogs 200/201, file
     picker 300/301), so a tooltip or menu opened from inside one stays visible. REQ-UIF-008
     wants modals above menus and tooltips; that is for the day modals get tokens of their own
     (above 410) — a native <dialog> is already above everything, in the top layer. */
  --fusion-z-actionbar: 70;
  --fusion-z-windows: 200;
  --fusion-z-tooltip: 400;
  --fusion-z-menu: 410;

  /* Combat turn head (spec 40, DEC-CBA-02 / REQ-CBA-021).
     The head of the turn is one fixed height for every participant — a new condition, a
     long name or a health bar must never move the advance control, which is anchored to
     the footer strip below (RNF-CBA-03). Mirrored in TS by TURN_HEAD_HEIGHT_REM /
     TURN_HEAD_FOOTER_HEIGHT_REM in lib/combat/turnHead.svelte.ts. */
  --fusion-combat-turn-head-height: 6.5rem;
  --fusion-combat-turn-head-footer-height: 2.25rem;

  /* Condition tone (DEC-CTT-11, REQ-SYS-043 / REQ-CTT-031).
     The colour of a condition chip says what the condition does to whoever carries it,
     never how grave it is: green helps, red hinders, purple is a situation (detection,
     attitude, control). Aliases rather than raw colours so the combat tab (REQ-CBA-050)
     and the contacts tab paint the same three tones. The `-dim` fills are the emphasis of
     a critical condition (REQ-CTT-032) — emphasis on the tone it already has, never a
     fourth colour. */
  --fusion-condition-benefit: var(--fusion-success);
  --fusion-condition-harm: var(--fusion-danger);
  --fusion-condition-special: var(--fusion-magic);
  --fusion-condition-benefit-dim: var(--fusion-success-dim);
  --fusion-condition-harm-dim: var(--fusion-danger-dim);
  --fusion-condition-special-dim: var(--fusion-magic-dim);

  /* The "no ar" head of the Cenas tab is one fixed height for every state
     (REQ-CEN-010/013): a long scene name, a missing background image or the
     environment row must never move the controls the GM presses all session. */
  --fusion-scene-head-height: 132px;

  /* Aliases for components written against names nobody had declared (they silently fell
     back to hard-coded colours and ignored the theme). New code uses the names above. */
  --fusion-radius-md: var(--fusion-radius);
  --fusion-surface-raised: var(--fusion-surface-alt);
  --fusion-text-on-accent: var(--fusion-on-accent);
  --fusion-accent-contrast: var(--fusion-on-accent);
  --fusion-accent-soft: var(--fusion-accent-dim);
  --fusion-warn: var(--fusion-warning);
  --fusion-color-accent: var(--fusion-accent);
  --fusion-color-accent-hover: var(--fusion-accent-hover);
  --fusion-color-on-accent: var(--fusion-on-accent);
  --fusion-color-border: var(--fusion-border);
  --fusion-color-focus: var(--fusion-focus);
  --fusion-color-hero: var(--fusion-accent);
  --fusion-color-info: var(--fusion-info);
  --fusion-color-magic: var(--fusion-magic);
  --fusion-color-success: var(--fusion-success);
  --fusion-color-warning: var(--fusion-warning);
  --fusion-color-input-bg: var(--fusion-input-bg);
  --fusion-color-surface: var(--fusion-surface);
  --fusion-color-surface-raised: var(--fusion-surface-alt);
  --fusion-color-text: var(--fusion-text);
  --fusion-color-text-primary: var(--fusion-text);
  --fusion-color-text-secondary: var(--fusion-text-muted);
  --fusion-color-text-muted: var(--fusion-text-muted);
  --fusion-color-text-subtle: var(--fusion-text-subtle);
}

<script>
  (function () {
    var b = document.getElementById("theme-toggle");
    function paint() { b.textContent = "Tema: " + (document.documentElement.dataset.theme === "light" ? "claro" : "escuro"); }

      document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";

    });

  })();
</script>

<div class="header">
  <span class="bolt"><svg class="svg-i" aria-hidden="true"><use href="#i-zap"/></svg></span><span class="world">teste_xande</span><span class="pill"><svg class="svg-i" aria-hidden="true"><use href="#i-map"/></svg>Fortaleza</span>
  <span class="spacer"></span>
  <span class="status"><span class="dot"></span>Conectado <sup>2ms</sup></span>
  <span class="who" id="who"></span>
  <button class="btn">Sair</button>
</div>

<div class="stage">
  <div class="art">
    <div class="house"><div class="star"><svg class="svg-i" aria-hidden="true"><use href="#i-star"/></svg></div></div>
    <div class="marker" id="marker"></div>
  </div>
</div>

<div id="root"></div>
<div id="tip"></div>

<div class="switcher">
  <button id="role">papel</button>
  <button id="state">estado</button>
  <button id="flood">encontro</button>
  <button id="mine">minha vez</button>
  <button id="turnbtn" class="go">Próximo turno <svg class="svg-i" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
</div>
<div class="legend" id="legend"></div>

<script>
const ic = (n, extra) => '<svg class="svg-i"' + (extra||'') + ' aria-hidden="true"><use href="#i-' + n + '"/></svg>';

/* ===================== chassi (spec 36) ===================== */
const ICONS = {
  chat:ic('message-square'), contacts:ic('users'), combat:ic('swords'), compendium:ic('book-open'),
  npcs:ic('drama'), scenes:ic('map'), settings:ic('settings'),
};
const TABS = [
  {id:'chat',label:'Chat',group:'all'},
  {id:'contacts',label:'Contatos',group:'all'},
  {id:'combat',label:'Combate',group:'all'},
  {id:'compendium',label:'Compêndio',group:'all'},
  {id:'npcs',label:'NPCs',group:'gm'},
  {id:'scenes',label:'Cenas',group:'gm'},
  {id:'settings',label:'Configurações',group:'all',foot:true},
];
const TITLE = {chat:'Chat',contacts:'Contatos',combat:'Combate',compendium:'Compêndio',npcs:'NPCs',scenes:'Cenas',settings:'Configurações'};
const OTHER = {
  chat:'<div class="empty">o painel do Chat é a spec 38</div>',
  contacts:'<div class="empty">o painel de Contatos é a spec 39</div>',
  compendium:'<div class="empty">o painel do Compêndio é a spec-filha a escrever</div>',
  npcs:'<div class="empty">o diretório de NPCs é a spec-filha a escrever</div>',
  scenes:'<div class="empty">a lista de Cenas é a spec-filha a escrever</div>',
  settings:'<div class="empty">o painel de Configurações é a spec 37</div>',
};

/* ===================== dados mock ===================== */
const HELP = {
  'Amedrontado':'Penalidade de circunstância em todas as jogadas e CDs, igual ao valor. Diminui 1 no fim de cada turno seu.',
  'Abençoada':'Bônus de condição +1 nas jogadas de ataque enquanto durar.',
  'Encoberto':'Ataques contra a criatura sofrem 20% de chance de erro.',
  'Enfraquecido':'Penalidade de condição no dano e nas jogadas de Força, igual ao valor.',
  'Morrendo':'Inconsciente e prestes a morrer. Faz uma jogada de recuperação no início do seu turno.',
  'Lento':'Perde ações no início do turno, igual ao valor.',
  'Enfeitiçado':'Trata quem enfeitiçou como amistoso; não age contra ele.',
  'Agarrado':'Imobilizado e desprevenido; ação de manobra para se soltar.',
  'Célere':'Ganha uma ação adicional no início do seu turno.',
  'Inconsciente':'Caído, indefeso e sem ações.',
  'Desprevenido':'Penalidade de -2 na CA.',
  'Ensurdecido':'Falha automática em testes que dependem de audição.',
};
const c = (n,t,v,crit)=>({n,t,v:v??null,crit:!!crit});

/* "icon" = nome do símbolo Lucide usado como retrato (sem emoji) */
const BASE = [
  {id:'n1',name:'Vess, a Corvo',icon:'feather',kind:'npc',init:22,hp:[38,38],conds:[c('Encoberto','special')]},
  {id:'p1',name:'Fofurinha',icon:'user',kind:'pc',mine:true,sub:'Druida 5',init:19,hp:[23,42],conds:[c('Amedrontado','harm',2),c('Abençoada','benefit'),c('Desprevenido','harm'),c('Ensurdecido','special')]},
  {id:'n2',name:'Goblin Guerreiro',icon:'drama',kind:'npc',init:17,hp:[9,24],conds:[c('Enfraquecido','harm',1)]},
  {id:'p2',name:'Tobias',icon:'shield',kind:'pc',sub:'Guerreiro 5',init:14,hp:[55,62],conds:[]},
  {id:'n3',name:'Goblin Arqueiro',icon:'crosshair',kind:'npc',init:11,hp:[18,18],hidden:true,conds:[]},
  {id:'n4',name:'Lobo atroz',icon:'paw-print',kind:'npc',init:8,hp:[0,30],defeated:true,conds:[c('Morrendo','harm',1,true)]},
];
const EXTRA = [
  {id:'x1',name:'Corvo espião',icon:'feather',kind:'npc',init:21,hp:[6,6],hidden:true,conds:[c('Encoberto','special')]},
  {id:'x2',name:'Goblin Xamã',icon:'wand-sparkles',kind:'npc',init:16,hp:[14,20],conds:[c('Enfeitiçado','special'),c('Lento','harm',1)]},
  {id:'x3',name:'Mestre Aldric',icon:'user',kind:'npc',init:13,hp:[30,30],conds:[c('Célere','benefit')]},
  {id:'x4',name:'Guarda ferido',icon:'shield',kind:'npc',init:10,hp:[3,28],conds:[c('Agarrado','harm')]},
  {id:'x5',name:'Zumbi A',icon:'ghost',kind:'npc',init:6,hp:[20,20],conds:[c('Lento','harm',1)]},
  {id:'x6',name:'Zumbi B',icon:'ghost',kind:'npc',init:6,hp:[20,20],conds:[c('Lento','harm',1)]},
  {id:'x7',name:'Aranha gigante',icon:'paw-print',kind:'npc',init:4,hp:[0,26],defeated:true,conds:[c('Inconsciente','harm',null,true)]},
];
const CENE_TOKENS = ['Goblin Chefe','Rato atroz','Rato atroz (2)','Estátua animada'];

/* ===================== estado ===================== */
const params = new URLSearchParams(location.search);
let role   = params.get('role') === 'player' ? 'player' : 'gm';
let state  = ['empty','setup','running'].includes(params.get('state')) ? params.get('state') : 'running';
let flood  = params.get('flood') === '1';
const pcHp = true;   /* fechado: o jogador vê a vida dos personagens de jogador */
let active = 'combat', open = true;
let round = 3, turn = 0, showAdd = false;
let rolled = new Set();
let nowExpanded = false;                         /* "+N" da cabeça — zera ao avançar */

const isGm = () => role === 'gm';
const eInit = (p) => (state === 'setup' && !rolled.has(p.id)) ? null : p.init;
const roster = () => {
  const list = flood ? BASE.concat(EXTRA) : BASE.slice();
  return list.sort((a,b)=>((eInit(b)??-99)-(eInit(a)??-99)));
};
const visible = () => roster().filter(x => isGm() || !x.hidden);
const now = () => visible()[turn] || null;
const myTurn = () => !!(now() && now().mine && !isGm() && state==='running');

function setMine(){ const i = visible().findIndex(x=>x.mine); if(i>=0) turn = i; }
/* avançar SEMPRE devolve a cabeça à altura padrão (decisão 2) */
function step(d){
  const n = visible().length; if(!n) return;
  nowExpanded = false;
  const t = turn + d;
  if(t >= n){ turn = 0; round++; }
  else if(t < 0){ turn = n-1; round = Math.max(1, round-1); }
  else turn = t;
}
function untilMine(){
  const v = visible(), n = v.length;
  for(let k=1;k<=n;k++){ if(v[(turn+k)%n].mine) return k; }
  return null;
}

/* ===================== peças ===================== */
function tabButton(t){
  const gm = t.group === 'gm';
  let badge = '';
  if(t.id === 'chat') badge = '<span class="badge">3</span>';
  if(t.id === 'combat' && state !== 'empty')
    badge = '<span class="badge dot' + (myTurn() ? ' turn' : '') + '"></span>';
  return '<button class="tabbtn ' + (active===t.id && open ? 'is-active':'') + '" data-tab="'+t.id+'" aria-label="'+t.label+'" title="'+t.label+'">'
    + ICONS[t.id] + badge
    + '<span class="tip">'+t.label+(gm?'<span class="gm-tag">Mestre</span>':'')+'</span></button>';
}

function condChip(x){
  const val = x.v!==null ? ' <span class="v">'+x.v+'</span>' : '';
  return '<span class="c '+x.t+(x.crit?' crit':'')+'" tabindex="0" data-help="'+(HELP[x.n]||'')+'">'+x.n+val+'</span>';
}
function sortConds(p){
  const order = {crit:0, harm:1, special:2, benefit:3};
  return (p.conds||[]).slice().sort(function(a,b){
    const ka = a.crit?0:order[a.t], kb = b.crit?0:order[b.t];
    return ka-kb || a.n.localeCompare(b.n,'pt-BR');
  });
}
/* teto 2 + "+N" (DEC-CTT-11); na cabeça, o "+N" expande e a altura cresce */
function condsBlock(p, cap, expandable){
  const s = sortConds(p);
  if(!s.length) return expandable ? '<div class="nocond">sem condições</div>' : '';
  const openAll = expandable && nowExpanded;
  const lim = openAll ? s.length : cap;
  const shown = s.slice(0,lim).map(condChip).join('');
  const rest = s.length - lim;
  const more = rest>0 ? '<button type="button" class="c more" data-exp="1" aria-label="Mostrar mais '+rest+' condições" title="Mostrar mais condições">+'+rest+'</button>'
             : (openAll && s.length>cap ? '<button type="button" class="c more" data-exp="1" aria-label="Mostrar menos condições" title="Mostrar menos condições">'+ic('minus')+'</button>' : '');
  return '<div class="conds">'+shown+more+'</div>';
}

/* vida: jogador NUNCA vê a de criatura; Mestre vê barra + número (decisão 3) */
function canSeeHp(p){
  if(isGm()) return true;
  return p.kind === 'pc' && pcHp;
}
function hpOf(p){
  if(!canSeeHp(p)) return '';
  const v = p.hp[0], max = p.hp[1], pct = max ? Math.round(v/max*100) : 0;
  const lvl = pct<=25 ? 'low' : pct<=60 ? 'mid' : 'hi';
  return '<span class="hp '+lvl+'"><span class="bar"><i style="width:'+pct+'%"></i></span>'
       + '<span class="num"><b>'+v+'</b>/'+max+'</span></span>';
}

/* iniciativa: número só na montagem (decisão 4) */
function initCell(p){
  if(state !== 'setup') return '';
  const iv = eInit(p);
  if(iv===null) return isGm() ? '<button class="init none" data-init="'+p.id+'" aria-label="Definir iniciativa" title="Definir iniciativa">—</button>' : '<span class="init none">—</span>';
  if(!isGm() && p.kind==='npc') return '<span class="init hid" title="a ordem é o que importa"><span class="d"></span></span>';
  return '<button class="init" data-init="'+p.id+'" aria-label="Editar iniciativa" title="Editar iniciativa">'+iv+'</button>';
}

function acts(p){
  if(!isGm()){
    if(p.mine && state==='setup' && eInit(p)===null) return '<button class="b p" data-roll="'+p.id+'">Rolar</button>';
    return '';
  }
  return '<div class="acts">'
    + (state==='setup' ? '<button class="ib" data-roll="'+p.id+'" title="Rolar iniciativa" aria-label="Rolar iniciativa">'+ic('dice-5')+'</button>' : '')
    + '<button class="ib '+(p.defeated?'on':'')+'" data-def="'+p.id+'" title="Derrotado" aria-label="Marcar como derrotado">'+ic('skull')+'</button>'
    + '<button class="ib '+(p.hidden?'on':'')+'" data-hid="'+p.id+'" title="Oculto dos jogadores" aria-label="Ocultar dos jogadores">'+ic(p.hidden?'eye-off':'eye')+'</button>'
    + '<button class="ib dg" data-rm="'+p.id+'" title="Tirar do combate" aria-label="Tirar do combate">'+ic('x')+'</button>'
    + '</div>';
}

function row(p, opts){
  opts = opts || {};
  const cls = ['cb', p.mine?'mine':'', p.defeated?'gone':'', p.hidden?'veil':'', opts.done?'done':''].join(' ');
  const grip = (isGm() && state!=='setup') ? '<button type="button" class="grip" title="Arrastar para reordenar" aria-label="Arrastar para reordenar">'+ic('grip-vertical')+'</button>' : '';
  const name = '<div class="nm"><span>'+p.name+'</span>'
    + (p.mine?'<span class="you">você</span>':'')
    + (p.hidden?'<span class="eye" title="oculto dos jogadores">'+ic('eye-off')+'</span>':'')
    + '</div>';
  const sub = (state==='setup' && isGm() && p.sub) ? '<div class="sub">'+p.sub+'</div>' : '';
  return '<div class="'+cls+'" data-cb="'+p.id+'">'
    + grip
    + '<div class="por">'+ic(p.icon)+(p.defeated?'<span class="sk">'+ic('skull')+'</span>':'')+'</div>'
    + '<div class="mid">'+name+sub+condsBlock(p,2,false)+'</div>'
    + hpOf(p)
    + (state==='setup' ? initCell(p) : '')
    + acts(p)
    + '</div>';
}

/* ---------- cabeça de turno ---------- */
function nowHead(){
  const cur = now(); if(!cur) return '';
  const ctl = isGm()
    ? '<div class="ctl"><button class="b" data-prev="1" title="Turno anterior" aria-label="Turno anterior">'+ic('chevron-left')+'</button>'
      + '<button class="b t grow" data-next="1" title="Próximo turno">Próximo turno '+ic('chevron-right')+'</button>'
      + '<button class="b g" data-endc="1" title="Encerrar combate" aria-label="Encerrar combate">'+ic('x')+'</button></div>'
    : (cur.mine
        ? '<div class="ctl"><button class="b t grow" data-end="1">Encerrar meu turno</button></div>'
        : '<div class="ctl"><span class="wip quiet">aguardando o turno</span></div>');
  return '<div class="now'+(nowExpanded?' exp':'')+'">'
    + '<div class="top">'
    +   '<div class="por">'+ic(cur.icon)+(cur.defeated?'<span class="sk">'+ic('skull')+'</span>':'')+'</div>'
    +   '<div style="min-width:0">'
    +     '<div class="lbl">Agora · rodada '+round+'</div>'
    +     '<div class="nm"><span>'+cur.name+'</span>'+(cur.mine?'<span class="you">você</span>':'')+(cur.hidden?'<span class="eye" title="oculto dos jogadores">'+ic('eye-off')+'</span>':'')+'</div>'
    +     '<div class="meta">'+(isGm()&&cur.sub?cur.sub:(cur.kind==='pc'?'personagem de jogador':'criatura'))+'</div>'
    +   '</div>'
    +   '<div class="hpwrap">'+hpOf(cur)+'</div>'
    + '</div>'
    + '<div class="cbox">'+condsBlock(cur,2,true)+'</div>'
    + ctl
    + '</div>';
}

/* ---------- corpo ---------- */
function queue(){
  const v = visible(), n = v.length;
  if(state!=='running') return v.map(function(p){ return row(p,{}); }).join('');
  const after = [];
  for(let k=1;k<n;k++) after.push({p:v[(turn+k)%n], done:(turn+k) >= n});
  const next = after.filter(function(x){return !x.done;});
  const done = after.filter(function(x){return x.done;});
  let out = '';
  if(next.length) out += '<div class="secl">A seguir</div>' + next.map(function(x){return row(x.p,{});}).join('');
  if(done.length) out += '<div class="secl">Já agiram · rodada '+round+'</div>' + done.map(function(x){return row(x.p,{done:true});}).join('');
  return out;
}

function emptyState(){
  if(isGm()) return '<div class="empty">Nenhum combate nesta cena.'
    + '<div class="hint">O combate nasce da cena ativa: escolha quem entra e comece.</div>'
    + '<div class="acts-c"><button class="b p lg" data-new="1">Criar combate</button>'
    + '<button class="b lg" data-add="1">Adicionar ao combate</button></div></div>';
  return '<div class="empty">Nenhum combate em andamento.'
    + '<div class="hint">Quando o Mestre começar um encontro, a ordem aparece aqui — e o ícone da aba acende.</div></div>';
}

function addBlock(){
  if(!showAdd || !isGm()) return '';
  return '<div class="add"><h5>Na cena ativa <span class="wip">wip</span> <button class="x" data-add="0" title="Fechar" aria-label="Fechar">'+ic('x')+'</button></h5>'
    + CENE_TOKENS.map(function(n){
        return '<div class="it"><span class="ic">'+ic('drama')+'</span><span class="grow">'+n+'</span><button class="b" data-addtok="1" title="Adicionar ao combate" aria-label="Adicionar '+n+' ao combate">'+ic('plus')+'</button></div>';
      }).join('')
    + '<div class="it note">'
    + 'de onde vem esta lista depende da spec de <b>Token</b>, que ainda será escrita — a aba nunca diz "token"</div></div>';
}

function toolbar(){
  if(!isGm()) return '';
  if(state==='setup') return '<div class="tools"><button class="b" data-add="1">Adicionar ao combate</button>'
    + '<button class="b" data-rollall="1">Rolar todos</button><button class="b" data-rollnpc="1">Rolar NPCs</button>'
    + '<button class="b g" data-reset="1">Zerar</button></div>';
  return '<div class="tools"><button class="b" data-add="1">Adicionar ao combate</button>'
    + '<button class="b g" data-reset="1">Refazer iniciativa</button></div>';
}

function header(){
  const v = visible();
  let left, ctl = '';
  if(state==='setup'){
    const falta = v.filter(function(p){return eInit(p)===null;}).length;
    left = '<span class="rd">Montando · <b>'+v.length+'</b> na fila'+(falta?' · '+falta+' sem rolar':'')+'</span>';
    if(isGm()) ctl = '<button class="b t" data-begin="1">Começar</button>';
  } else {
    left = '<span class="rd">Rodada <b>'+round+'</b></span>';
  }
  return '<div class="phead">'+left+'<span class="grow"></span>'+ctl+'</div>';
}

function mineBar(){
  if(state!=='running' || isGm()) return '';
  if(myTurn()) return '<div class="mine-bar">'+ic('sword')+' É a sua vez</div>';
  const k = untilMine();
  return k ? '<div class="wait">Sua vez em '+k+' '+(k===1?'turno':'turnos')+'.</div>' : '';
}

function panelCombat(){
  if(state==='empty') return header() + '<div class="pbody">'+emptyState()+'</div>';
  return header() + mineBar() + toolbar() + addBlock()
    + (state==='running' ? nowHead() : '')
    + '<div class="pbody">'+queue()+'</div>';
}

function panel(){
  const inner = active==='combat'
    ? panelCombat()
    : '<div class="phead"><span class="rd">'+TITLE[active]+'</span></div><div class="pbody">'+OTHER[active]+'</div>';
  return '<div class="panel">'+inner+'</div>';
}

/* ===================== render ===================== */
function render(){
  const all = TABS.filter(function(t){return t.group==='all' && !t.foot;});
  const gms = TABS.filter(function(t){return t.group==='gm' && isGm();});
  const foot = TABS.filter(function(t){return t.foot;});
  document.getElementById('root').innerHTML =
    '<div class="'+(open?'is-open':'')+'"><aside class="shell">'
    + '<nav class="tabs"><div class="grp">'+all.map(tabButton).join('')+'</div>'
    + '<div class="grp gm">'+gms.map(tabButton).join('')+'</div>'
    + '<div class="foot">'+foot.map(tabButton).join('')+'</div></nav>'
    + panel() + '</aside></div>';

  const who = document.getElementById('who');
  who.className = 'who ' + (isGm()?'':'player');
  who.innerHTML = isGm()
    ? '<span class="dot"></span>Gamemaster · <span style="color:var(--fusion-text-muted)">Mestre</span>'
    : '<span class="dot"></span>Alexandre · <span style="color:var(--fusion-text-muted)">Jogador (Fofurinha)</span>';

  const mk = document.getElementById('marker'), cur = now();
  if(state==='running' && cur && (isGm() || !cur.hidden)){
    mk.style.display='grid';
    mk.innerHTML = ic(cur.icon) + '<small>' + (myTurn()?'Sua vez':cur.name) + '</small>';
    mk.style.left = (18 + (turn*11)%60) + '%';
    mk.style.top  = (22 + (turn*17)%50) + '%';
  } else mk.style.display='none';

  wire(); chrome();
  const u = new URL(location);
  u.searchParams.set('role',role); u.searchParams.set('state',state);
  u.searchParams.set('flood',flood?'1':'0');
  history.replaceState(null,'',u);
}

function wire(){
  const root = document.getElementById('root');
  const on = function(sel, fn){ root.querySelectorAll(sel).forEach(function(el){ el.onclick = function(e){ e.stopPropagation(); fn(el); }; }); };

  on('[data-tab]', function(el){ const id=el.dataset.tab; if(open&&active===id){open=false;} else {active=id;open=true;} render(); });
  on('[data-next]', function(){ step(1); render(); });
  on('[data-prev]', function(){ step(-1); render(); });
  on('[data-end]',  function(){ step(1); render(); });
  on('[data-begin]',function(){ state='running'; round=1; turn=0; nowExpanded=false; render(); });
  on('[data-endc]', function(){ state='empty'; showAdd=false; rolled=new Set(); render(); });
  on('[data-new]',  function(){ state='setup'; rolled=new Set(); render(); });
  on('[data-add]',  function(el){ showAdd = el.dataset.add==='1'; if(showAdd && state==='empty'){ state='setup'; rolled=new Set(); } render(); });
  on('[data-addtok]', function(){ render(); });
  on('[data-rollall]',function(){ roster().forEach(function(p){ rolled.add(p.id); }); render(); });
  on('[data-rollnpc]',function(){ roster().forEach(function(p){ if(p.kind==='npc') rolled.add(p.id); }); render(); });
  on('[data-reset]', function(){ rolled = new Set(); state='setup'; render(); });
  on('[data-roll]',  function(el){ rolled.add(el.dataset.roll); render(); });
  on('[data-exp]',   function(){ nowExpanded = !nowExpanded; render(); });

  const tip = document.getElementById('tip');
  root.querySelectorAll('[data-help]').forEach(function(el){
    const show = function(){
      if(!el.dataset.help) return;
      tip.textContent = el.dataset.help; tip.style.display='block';
      const r = el.getBoundingClientRect();
      tip.style.top = (r.top - 8) + 'px';
      tip.style.left = Math.max(8, r.left - 240) + 'px';
    };
    const hide = function(){ tip.style.display='none'; };
    el.onmouseenter = show; el.onmouseleave = hide;
    el.onfocus = show; el.onblur = hide;
  });
}

function chrome(){
  document.getElementById('role').textContent  = isGm() ? 'papel: Mestre' : 'papel: jogador';
  document.getElementById('state').textContent = 'estado: ' + ({empty:'vazio',setup:'montagem',running:'em andamento'})[state];
  document.getElementById('flood').textContent = flood ? 'encontro: 13' : 'encontro: 6';
  document.getElementById('mine').innerHTML    = myTurn() ? ic('check') + ' é a sua vez' : 'pôr na minha vez';

  document.getElementById('legend').innerHTML =
    '<h4>Aba Combate — cabeça de turno <span class="wip">wip</span></h4>'
    + '<table>'
    + '<tr><td>fixo</td><td><b>A cabeça tem altura fixa</b> — "Próximo turno" não sai do lugar entre turnos. Expandir "+N" cresce a cabeça; <b>avançar devolve ao padrão</b>.</td></tr>'
    + '<tr><td>vida</td><td>jogador <b>nunca</b> vê vida de criatura; vê a dos personagens de jogador. Mestre vê <b>barra + número</b> de todos.</td></tr>'
    + '<tr><td>iniciativa</td><td>número só na <b>montagem</b>; em andamento a ordem é a lista, e o Mestre reordena pela alça de arrastar.</td></tr>'
    + '<tr><td>turnos</td><td>anterior e próximo com <b>chevron esquerdo e direito</b> (ícones, não caracteres).</td></tr>'
    + '<tr><td>badge</td><td>ponto enquanto o combate corre; <b>âmbar</b> quando é a sua vez.</td></tr>'
    + '<tr><td>fora</td><td>marcar alvo saiu (outra spec). O jogador encerra o próprio turno.</td></tr>'
    + '</table>'
    + '<div class="q"><b>lacuna estrutural:</b> <b>Token não tem spec</b> e vai ser refeito do zero. '
    + 'A aba fala em participantes e em "criaturas na cena", e a origem da lista fica pendurada nessa spec futura.</div>'
    + '<div class="q"><b>ainda aberto:</b> <b>Q6</b> combate encerrado some na hora ou vira resumo · '
    + '<b>Q8</b> o painel abre alguma coisa fora da gaveta (ficha do participante)?</div>'
    + '<div class="q">teclas: <b>n</b> próximo turno · <b>b</b> turno anterior · <b>p</b> papel · '
    + '<b>e</b> estado · <b>f</b> encontro · <b>m</b> minha vez</div>';
}

/* ===================== alternador ===================== */
document.getElementById('role').onclick = function(){ role = isGm()?'player':'gm'; turn = Math.min(turn, Math.max(visible().length-1,0)); nowExpanded=false; render(); };
document.getElementById('state').onclick = function(){
  state = state==='empty'?'setup':state==='setup'?'running':'empty';
  if(state==='setup') rolled = new Set();
  showAdd=false; turn=0; nowExpanded=false; render();
};
document.getElementById('flood').onclick = function(){ flood = !flood; turn = 0; nowExpanded=false; render(); };
document.getElementById('mine').onclick  = function(){ if(state!=='running') state='running'; setMine(); nowExpanded=false; render(); };
document.getElementById('turnbtn').onclick= function(){ if(state==='running'){ step(1); render(); } };

document.addEventListener('keydown', function(e){
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.key==='n'){ if(state==='running'){ step(1); render(); } }
  else if(e.key==='b'){ if(state==='running'){ step(-1); render(); } }
  else if(e.key==='p') document.getElementById('role').click();
  else if(e.key==='e') document.getElementById('state').click();
  else if(e.key==='f') document.getElementById('flood').click();
  else if(e.key==='m') document.getElementById('mine').click();
});

if(params.get('mine')==='1'){ state='running'; setMine(); }
render();
</script>
