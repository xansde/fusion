<title>Protótipo — Aba Compêndio (grill rodada 1: três variantes)</title>
<!--
  Protótipo — descartável. Rodada 1 do grill da aba Compêndio. Não é código de
  produção; não importar nada daqui.

  ============================================================================
  O PONTO DE PARTIDA É DIFERENTE DAS OUTRAS ABAS
  ============================================================================
  Chat, Contatos, Combate e NPCs nasceram de tela em branco. Compêndio NÃO:
  `CompendiumBrowser.svelte` já existe, funciona e faz o essencial —
  packs agrupados por tipo > índice do pack > busca/filtro/ordenação >
  preview sob demanda > importar (só GM) > arrastar para canvas/ficha.
  Ele cumpre REQ-CMP-012..018 e REQ-CMP-021.

  Então esta rodada não pergunta "como seria a aba". Pergunta:
  **o que quebra quando esse painel entra numa gaveta de 300px, com o PF2e
  inteiro dentro dele, e com um jogador do outro lado da tela?**

  ============================================================================
  O QUE JÁ VEM DECIDIDO (tratei como não-negociável — confira)
  ============================================================================
   · GRUPO "TODOS" (DEC-GAV-01): Compêndio não é aba de Mestre. O jogador tem
     o ícone dele, na mesma posição do trilho do Mestre.
   · LARGURA FIXA 300+44 (DEC-GAV-04): o que não couber abre JANELA, não
     estica a gaveta. Hoje o preview abre DENTRO do painel e come a lista.
   · PACK É A UNIDADE DE LICENÇA (DEC-CMP-03): `pack.json.license`, com
     override por documento. Licença não é enfeite: é o motivo do projeto ser
     clean-room. Ela tem que caber em 300px.
   · ÍNDICE LEVE (DEC-CMP-02): a lista mostra só `_id/name/img/type` +
     indexFields; documento completo só no preview (REQ-CMP-015).
   · IMPORTAR CLONA COM `_id` NOVO (REQ-CMP-021) e ator solto no canvas
     importa ANTES de virar presença no mapa (REQ-CMP-018).
   · PAINEL É DESMONTADO AO TROCAR DE ABA (REQ-GAV-017): busca digitada e
     pack aberto morrem, a menos que esta spec diga onde eles moram.

  ============================================================================
  AS TRÊS VARIANTES — cada uma aposta em uma coisa diferente
  ============================================================================
  A · ESTANTE  — o painel de hoje, feito para 300px. Grupos por tipo de
                 documento, packs colapsáveis com contagem e selo de licença;
                 entrar no pack dá busca + filtros + ordenação. Aposta: o
                 Mestre pensa por FONTE ("está no Monster Core"), e a fonte é
                 o que a licença obriga a mostrar.
                 Custo: para achar uma coisa você precisa saber onde ela mora.

  B · BUSCA    — a aba É um campo de busca que atravessa todos os packs. O
                 resultado vem agrupado por tipo, com facetas em chip (nível,
                 traço, raridade, fonte). Pack deixa de ser lugar e vira
                 filtro. Sem busca, a aba mostra fixados e recentes.
                 Aposta: ninguém navega um acervo de 12 mil documentos —
                 todo mundo digita.
                 Custo: exige busca cross-pack no servidor, que a 16 não tem
                 (REQ-CMP-013 é busca DENTRO do pack). É requisito novo.

  C · BALCÃO   — organiza por DESTINO, não por tipo: "Mapa" (o que você
                 arrasta para a cena), "Ficha" (o que você dá a alguém),
                 "Mesa" (o que você lê e mostra). Cada balcão traz o gesto
                 certo já engatilhado.
                 Aposta: durante o jogo o compêndio é almoxarifado, não
                 biblioteca — a pergunta é "para onde isso vai".
                 Custo: destino é opinião NOSSA; o sistema declara
                 `documentType`, não destino. E o balcão "Mapa" simplesmente
                 não existe para o jogador — o que resolve a Q2 de graça, ou
                 esconde a decisão debaixo do tapete.

  ============================================================================
  O QUE O PROTÓTIPO PÕE NA MESA DE PROPÓSITO (é aqui que quero seu feedback)
  ============================================================================
   Q1 — PREVIEW FORA DA GAVETA. Aqui o preview abre em JANELA sobre o mapa
        (DEC-GAV-04), e não como lâmina dentro do painel como é hoje. Ganha
        espaço para stat block e licença; perde o "olhar rápido sem sair da
        lista". Clique no ícone de olho de qualquer resultado.

   Q2 — O JOGADOR VÊ O BESTIÁRIO? Hoje o servidor libera listar/buscar/prever
        a QUALQUER papel; só importar é `isRolePrivileged`. Ou seja: o jogador
        pode abrir a ficha do dragão que ele vai enfrentar hoje à noite, com
        CA, resistências e reações. Ninguém decidiu isso — é o default de quem
        implementou. Ligue "papel: jogador" nas três variantes.
        Proposta do protótipo: packs têm PLATEIA (`audience: all | gm`), e
        bestiário/perigos nascem `gm`. É decisão de produto, não de código.

   Q3 — IMPORTAR VS. USAR. O jogador arrasta "Bola de Fogo" do pack para a
        própria ficha. Isso importa a magia para o mundo (REQ-CMP-021 clona)
        — e importar é privilégio de Mestre. Então o jogador pode ou não pode?
        Aqui ele PODE, e o servidor importa em nome dele (o alvo é a ficha
        dele, não o mundo). Se isso te incomodar, é o feedback que eu quero.

   Q4 — BUSCA CROSS-PACK. A variante B só existe se o servidor souber buscar
        em todos os packs de uma vez. Isso não está na 16. Vale o custo?
        (12.000+ documentos, REQ-CMP-049 dá 1,5s só para indexar UM pack.)

   Q5 — DOIS NOMES. O overlay pt-BR já existe em produção e não está em spec
        nenhuma. Aqui a lista mostra o nome pt-BR grande e o inglês pequeno,
        e a busca casa com os dois ("fireball" acha "Bola de Fogo").
        Formalizar isso é trabalho desta spec ou emenda na 16?

   Q6 — O QUE SOBREVIVE À TROCA DE ABA. REQ-GAV-017 desmonta o painel. Você
        digita "goblin", vai no Chat responder uma pergunta, volta — e perdeu.
        Aqui a busca e o pack aberto sobrevivem (moram fora do componente,
        no aparelho, como as categorias da DEC-CTT-08). Sobrevivem por
        sessão ou para sempre?

   Q7 — JÁ ESTÁ NO MUNDO. O selo "no mundo" marca o que já foi importado.
        Ele evita import duplicado — mas o documento importado NÃO acompanha
        o pack quando o pack é atualizado (Q-CMP-07 da 16). O selo mente com
        o tempo. Mostrar assim mesmo, ou não mostrar?

   Q8 — BADGE. Proposta: NENHUM em repouso — compêndio não tem "novidade".
        Ponto de estado só enquanto uma importação em lote está correndo
        (ligue "importando"). Concorda, ou nem isso?

  ATUALIZAÇÃO 22/10/2026: grupo como cabeçalho de seção (com contador de pacotes), pack como linha plana com
  divisor e nome inteiro, selo "só o Mestre", custo de ação com losangos SVG (cheio/contorno/seta de reação).
-->

:root {
  color-scheme: dark;

  /* Surfaces: warm charcoal, three flat steps. */
  --fusion-bg: #141311;
  --fusion-surface: #1c1b18;
  --fusion-surface-alt: #25231f;
  --fusion-input-bg: #11100e;
  --fusion-border: #3b3830;
  --fusion-border-strong: #575245;

  /* Text: off-white, never #fff. Muted and subtle stay AA on every surface. */
  --fusion-text: #ebe5d6;
  --fusion-text-muted: #b8b09e;
  --fusion-text-subtle: #9a927f;

  /* The one accent — brass. Interactive and "selected" only, never decoration. */
  --fusion-accent: #d6a24a;
  --fusion-accent-hover: #e4b765;
  --fusion-accent-dim: rgba(214, 162, 74, 0.16);
  --fusion-on-accent: #1a1408;

  /* Semantic */
  --fusion-success: #7cc395;
  --fusion-warning: #e8925a;
  --fusion-danger: #ec7468;
  --fusion-info: #7fb2dc;
  --fusion-magic: #b9a0ea;

  /* Semantic washes — subtle tinted fills for badges / states */
  --fusion-success-dim: rgba(124, 195, 149, 0.15);
  --fusion-warning-dim: rgba(232, 146, 90, 0.15);
  --fusion-danger-dim: rgba(236, 116, 104, 0.15);
  --fusion-info-dim: rgba(127, 178, 220, 0.15);
  --fusion-magic-dim: rgba(185, 160, 234, 0.15);

  /* Chat system card (A022, spec 38, DEC-ACH-02/03 + REQ-ACH-025): a card's left border is
     this fixed blue regardless of sender, so "this is a system card" reads apart from
     "this is <someone>'s message". Not derived from the accent/semantic tones on purpose —
     those already carry meaning in chat (crit, fumble, blind). */
  --fusion-chat-sys: #6fa6cc;

  /* Focus ring: its own colour, never the accent, so focus never reads as "selected". */
  --fusion-focus: #9ccaff;

  /* Elevation: one soft shadow, for floating windows, popovers and menus only. */
  --fusion-shadow-modal: 0 12px 32px rgba(0, 0, 0, 0.45);
  --fusion-shadow-popover: 0 6px 18px rgba(0, 0, 0, 0.35);

  /* Proficiency (TEML — Destreinado, Treinado, Expert, Mestre, Lendário). */
  --fusion-prof-u: var(--fusion-text-subtle);
  --fusion-prof-t: var(--fusion-info);
  --fusion-prof-e: var(--fusion-success);
  --fusion-prof-m: var(--fusion-accent);
  --fusion-prof-l: var(--fusion-magic);

  --fusion-prof-u-bg: rgba(154, 146, 127, 0.14);
  --fusion-prof-t-bg: var(--fusion-info-dim);
  --fusion-prof-e-bg: var(--fusion-success-dim);
  --fusion-prof-m-bg: var(--fusion-accent-dim);
  --fusion-prof-l-bg: var(--fusion-magic-dim);

  --fusion-prof-u-border: var(--fusion-border);
  --fusion-prof-t-border: rgba(127, 178, 220, 0.45);
  --fusion-prof-e-border: rgba(124, 195, 149, 0.45);
  --fusion-prof-m-border: rgba(214, 162, 74, 0.45);
  --fusion-prof-l-border: rgba(185, 160, 234, 0.45);

  /* Typography. rem sizes (the reader's browser zoom wins); nothing below xs. */
  --fusion-font:
    "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
    sans-serif;
  --fusion-font-mono:
    "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas,
    monospace;
  --fusion-text-xs: 0.8125rem; /* 13px — captions, badges: the floor */
  --fusion-text-sm: 0.875rem; /* 14px — dense lists, secondary text */
  --fusion-text-base: 0.9375rem; /* 15px — body */
  --fusion-text-md: 1rem; /* 16px — reading text (journal, descriptions) */
  --fusion-text-lg: 1.125rem; /* 18px — section titles */
  --fusion-text-xl: 1.375rem; /* 22px — window / sheet titles */
  --fusion-text-2xl: 1.75rem; /* 28px — the big number of a stat or a roll */
  --fusion-leading: 1.5;
  --fusion-leading-tight: 1.25;
  --fusion-tracking: 0.012em;
  --fusion-word-spacing: 0.06em;
  --fusion-weight-regular: 400;
  --fusion-weight-medium: 500;
  --fusion-weight-bold: 700;
  /* Readable line length for prose. */
  --fusion-measure: 68ch;

  /* Spacing (4px grid) */
  --fusion-space-1: 4px;
  --fusion-space-2: 8px;
  --fusion-space-3: 12px;
  --fusion-space-4: 16px;
  --fusion-space-5: 20px;
  --fusion-space-6: 24px;
  --fusion-space-8: 32px;

  /* Radii: small and few. Pills only for counters. */
  --fusion-radius-sm: 3px;
  --fusion-radius: 6px;
  --fusion-radius-lg: 8px;
  --fusion-radius-pill: 999px;

  /* Touch target floor (mouse and finger). */
  --fusion-target: 40px;

  /* Motion */
  --fusion-transition: 150ms ease;

  /* Layout.
     The side drawer is one fixed width for every tab (REQ-GAV-012, DEC-GAV-04):
     300px of panel plus a 44px rail, and no user resize — a tab that needs more
     room opens a floating window instead of stretching the drawer. */
  --fusion-sidebar-width: 300px;
  --fusion-sidebar-rail-width: 44px;
  --fusion-header-height: 48px;

  /* Layer scale (spec 11 REQ-UIF-008; spec 53 §2.7 — BAR-F1-03).
     The z-index of the shell's layers, declared in one place so nobody hard-codes a number:

       canvas
       < scene notice               60  literal in ScenePrepareNotice.svelte
       < action bar                 70  --fusion-z-actionbar
       < side drawer                90  literal in Sidebar.svelte
       < header                    100  literal in TableScreen.svelte
       < floating windows         101+  counted up by the window manager, inside the host
       < window host               200  --fusion-z-windows
       < tooltip, popover          400  --fusion-z-tooltip
       < context menu              410  --fusion-z-menu

     Tooltip, popover and menu are portaled to <body> (lib/ui/floatingLayer.ts), so these
     numbers are compared with the window host's own: the host is a stacking context at
     200, and a layer rendered *inside* a window could never rise above it.
     They also clear the in-page modals that still use literals (token dialogs 200/201, file
     picker 300/301), so a tooltip or menu opened from inside one stays visible. REQ-UIF-008
     wants modals above menus and tooltips; that is for the day modals get tokens of their own
     (above 410) — a native <dialog> is already above everything, in the top layer. */
  --fusion-z-actionbar: 70;
  --fusion-z-windows: 200;
  --fusion-z-tooltip: 400;
  --fusion-z-menu: 410;

  /* Combat turn head (spec 40, DEC-CBA-02 / REQ-CBA-021).
     The head of the turn is one fixed height for every participant — a new condition, a
     long name or a health bar must never move the advance control, which is anchored to
     the footer strip below (RNF-CBA-03). Mirrored in TS by TURN_HEAD_HEIGHT_REM /
     TURN_HEAD_FOOTER_HEIGHT_REM in lib/combat/turnHead.svelte.ts. */
  --fusion-combat-turn-head-height: 6.5rem;
  --fusion-combat-turn-head-footer-height: 2.25rem;

  /* Condition tone (DEC-CTT-11, REQ-SYS-043 / REQ-CTT-031).
     The colour of a condition chip says what the condition does to whoever carries it,
     never how grave it is: green helps, red hinders, purple is a situation (detection,
     attitude, control). Aliases rather than raw colours so the combat tab (REQ-CBA-050)
     and the contacts tab paint the same three tones. The `-dim` fills are the emphasis of
     a critical condition (REQ-CTT-032) — emphasis on the tone it already has, never a
     fourth colour. */
  --fusion-condition-benefit: var(--fusion-success);
  --fusion-condition-harm: var(--fusion-danger);
  --fusion-condition-special: var(--fusion-magic);
  --fusion-condition-benefit-dim: var(--fusion-success-dim);
  --fusion-condition-harm-dim: var(--fusion-danger-dim);
  --fusion-condition-special-dim: var(--fusion-magic-dim);

  /* The "no ar" head of the Cenas tab is one fixed height for every state
     (REQ-CEN-010/013): a long scene name, a missing background image or the
     environment row must never move the controls the GM presses all session. */
  --fusion-scene-head-height: 132px;

  /* Aliases for components written against names nobody had declared (they silently fell
     back to hard-coded colours and ignored the theme). New code uses the names above. */
  --fusion-radius-md: var(--fusion-radius);
  --fusion-surface-raised: var(--fusion-surface-alt);
  --fusion-text-on-accent: var(--fusion-on-accent);
  --fusion-accent-contrast: var(--fusion-on-accent);
  --fusion-accent-soft: var(--fusion-accent-dim);
  --fusion-warn: var(--fusion-warning);
  --fusion-color-accent: var(--fusion-accent);
  --fusion-color-accent-hover: var(--fusion-accent-hover);
  --fusion-color-on-accent: var(--fusion-on-accent);
  --fusion-color-border: var(--fusion-border);
  --fusion-color-focus: var(--fusion-focus);
  --fusion-color-hero: var(--fusion-accent);
  --fusion-color-info: var(--fusion-info);
  --fusion-color-magic: var(--fusion-magic);
  --fusion-color-success: var(--fusion-success);
  --fusion-color-warning: var(--fusion-warning);
  --fusion-color-input-bg: var(--fusion-input-bg);
  --fusion-color-surface: var(--fusion-surface);
  --fusion-color-surface-raised: var(--fusion-surface-alt);
  --fusion-color-text: var(--fusion-text);
  --fusion-color-text-primary: var(--fusion-text);
  --fusion-color-text-secondary: var(--fusion-text-muted);
  --fusion-color-text-muted: var(--fusion-text-muted);
  --fusion-color-text-subtle: var(--fusion-text-subtle);
}

.tabbtn .badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 var(--fusion-space-1);border-radius:var(--fusion-radius-pill);background:var(--fusion-danger);color:var(--fusion-bg);font-size:var(--fusion-text-xs);font-weight:var(--fusion-weight-bold);display:grid;place-items:center;line-height:1}
.tabbtn .badge.dot{min-width:10px;width:10px;height:10px;padding:0;background:var(--fusion-accent)}

.shell{position:absolute;top:var(--header);right:0;bottom:0;display:flex;z-index:90}
.tabs{width:var(--rail-w);display:flex;flex-direction:column;padding-top:10px;gap:var(--fusion-space-1);align-items:flex-end}
.tabs .tabbtn{width:44px;min-height:var(--fusion-target);height:44px;border:1px solid var(--fusion-border);border-right:0;border-radius:var(--fusion-radius) 0 0 var(--fusion-radius);background:var(--fusion-surface-alt)}
.tabs .tabbtn.is-active{background:var(--fusion-surface);color:var(--fusion-accent-hover);border-color:var(--fusion-accent);z-index:2}
.tabs .grp{display:flex;flex-direction:column;gap:var(--fusion-space-1);align-items:flex-end}
.tabs .grp.gm{margin-top:14px;position:relative}
.tabs .grp.gm::before{content:"";position:absolute;top:-8px;right:6px;width:28px;height:1px;background:var(--fusion-border)}
.tabs .grp.gm .tabbtn{border-color:var(--fusion-border-strong)}
.tabs .foot{margin-top:auto;margin-bottom:10px;position:relative;display:flex;flex-direction:column;gap:var(--fusion-space-1);align-items:flex-end}
.tabs .foot::before{content:"";position:absolute;top:-8px;right:6px;width:28px;height:1px;background:var(--fusion-border)}
.panel{width:var(--panel-w);background:var(--fusion-surface);border-left:1px solid var(--fusion-border-strong);display:none;flex-direction:column;overflow:hidden}
.is-open .panel{display:flex}

/* ---------- Painel ---------- */
.phead{display:flex;align-items:center;gap:var(--fusion-space-1);padding:0 var(--fusion-space-2) 0 var(--fusion-space-3);min-height:48px;border-bottom:1px solid var(--fusion-border);flex-shrink:0}
.phead .ttl{font-size:var(--fusion-text-md);font-weight:var(--fusion-weight-bold);color:var(--fusion-text)}
.pbody{flex:1;overflow:auto;padding-bottom:var(--fusion-space-3)}

.b{display:inline-flex;align-items:center;justify-content:center;gap:var(--fusion-space-1);min-height:var(--fusion-target);background:var(--fusion-surface-alt);color:var(--fusion-text);border:1px solid var(--fusion-border);border-radius:var(--fusion-radius-sm);padding:0 var(--fusion-space-3);font-size:var(--fusion-text-sm)}
.b:hover{border-color:var(--fusion-accent)}
.b.p{background:var(--fusion-accent);border-color:var(--fusion-accent);color:var(--fusion-on-accent);font-weight:var(--fusion-weight-bold)}
.b.g{background:transparent;color:var(--fusion-text-muted)}
.b:disabled{opacity:.5;cursor:not-allowed}
.ib{background:none;border:1px solid transparent;border-radius:var(--fusion-radius-sm);color:var(--fusion-text-muted);min-width:var(--fusion-target);min-height:var(--fusion-target);display:grid;place-items:center;padding:0;font-size:var(--fusion-text-lg)}
.ib:hover{background:var(--fusion-surface-alt);color:var(--fusion-text)}

/* ---------- Busca e filtros ---------- */
.srch{display:flex;align-items:center;gap:var(--fusion-space-2);padding:var(--fusion-space-2);border-bottom:1px solid var(--fusion-border);flex-shrink:0}
.srch input{flex:1;min-width:0;min-height:var(--fusion-target);background:var(--fusion-input-bg);border:1px solid var(--fusion-border);border-radius:var(--fusion-radius-sm);color:var(--fusion-text);font-size:var(--fusion-text-sm);padding:0 var(--fusion-space-2)}
.srch input:focus{border-color:var(--fusion-accent)}
.srch .scope{font-size:var(--fusion-text-xs);color:var(--fusion-text-subtle);max-width:90px}
.facets{display:flex;gap:var(--fusion-space-1);flex-wrap:wrap;padding:var(--fusion-space-2);border-bottom:1px solid var(--fusion-border);flex-shrink:0}
.fc{display:inline-flex;align-items:center;gap:var(--fusion-space-1);min-height:var(--fusion-target);font-size:var(--fusion-text-xs);border:1px solid var(--fusion-border);border-radius:var(--fusion-radius);padding:0 var(--fusion-space-3);color:var(--fusion-text-muted);background:var(--fusion-surface-alt)}
.fc:hover{border-color:var(--fusion-accent);color:var(--fusion-text)}
.fc.on{background:var(--fusion-accent-dim);border-color:var(--fusion-accent);color:var(--fusion-text);font-weight:var(--fusion-weight-bold)}
.counter{font-size:var(--fusion-text-xs);color:var(--fusion-text-subtle);padding:var(--fusion-space-1) var(--fusion-space-3);display:flex;align-items:center;gap:var(--fusion-space-1)}
.counter b{color:var(--fusion-text-muted)}

/* ---------- Seções: grupo é cabeçalho de seção ---------- */
.secl{display:flex;align-items:center;gap:var(--fusion-space-2);width:100%;min-height:var(--fusion-target);padding:var(--fusion-space-2) var(--fusion-space-3);background:none;border:0;border-bottom:1px solid var(--fusion-border);color:var(--fusion-text);font-size:var(--fusion-text-md);font-weight:var(--fusion-weight-bold);text-align:left}
button.secl:hover{background:var(--fusion-surface-alt)}
.secl .caret{color:var(--fusion-text-muted);font-size:var(--fusion-text-md);display:inline-flex}
.secl .cnt{margin-left:auto;font-size:var(--fusion-text-xs);font-weight:var(--fusion-weight-regular);color:var(--fusion-text-muted)}

/* ---------- Linha de pack (variante A): plana, com divisor ---------- */
.pk{display:flex;align-items:center;gap:var(--fusion-space-2);width:100%;min-height:56px;padding:var(--fusion-space-2) var(--fusion-space-2) var(--fusion-space-2) var(--fusion-space-3);background:none;border:0;border-bottom:1px solid var(--fusion-border);color:var(--fusion-text);text-align:left}
.pk:hover{background:var(--fusion-surface-alt)}
.pk .por,.en .por{width:32px;height:32px;flex:none;border-radius:var(--fusion-radius-sm);background:var(--fusion-surface-alt);display:grid;place-items:center;font-size:var(--fusion-text-lg);color:var(--fusion-text-muted)}
.pk .mid{flex:1;min-width:0;display:block}
.pk .nm{display:block;font-size:var(--fusion-text-sm);overflow-wrap:anywhere}
.pk .sub{display:block;font-size:var(--fusion-text-xs);color:var(--fusion-text-muted)}
.pk .aud{display:inline-flex;align-items:center;gap:var(--fusion-space-1);font-size:var(--fusion-text-xs);color:var(--fusion-warning)}
.pk .go{color:var(--fusion-text-subtle);font-size:var(--fusion-text-md);display:inline-flex}

/* ---------- Linha de entrada ---------- */
.en{display:flex;align-items:center;gap:var(--fusion-space-2);padding:var(--fusion-space-2) var(--fusion-space-3);border-left:3px solid transparent;border-bottom:1px solid var(--fusion-border);position:relative;cursor:grab;min-height:56px}
.en:hover{background:var(--fusion-surface-alt)}
.en.drag{opacity:.5}
.en .mid{flex:1;min-width:0}
.en .nm{font-size:var(--fusion-text-sm);color:var(--fusion-text);overflow-wrap:anywhere}
.en .nm mark,.mk{background:var(--fusion-accent-dim);color:var(--fusion-text);border-radius:var(--fusion-radius-sm)}
.en .en2,.win .en2{font-size:var(--fusion-text-xs);color:var(--fusion-text-subtle)}
.en .meta{font-size:var(--fusion-text-xs);color:var(--fusion-text-muted)}
.en .rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;font-size:var(--fusion-text-xs);color:var(--fusion-text-muted)}
.en .lv{font-family:var(--fusion-font-mono)}
.en .acts{position:absolute;right:var(--fusion-space-1);top:50%;transform:translateY(-50%);display:flex;background:var(--fusion-surface-alt);border-radius:var(--fusion-radius);opacity:0;transition:opacity var(--fusion-transition)}
.en:hover .acts,.en:focus-within .acts{opacity:1}
.en .acts .ib:hover{background:var(--fusion-border)}
.en.inworld{border-left-color:var(--fusion-success)}
.rar.rare{color:var(--fusion-accent-hover)}
.rar.uncommon{color:var(--fusion-warning)}
.inw{display:inline-flex;align-items:center;gap:var(--fusion-space-1);color:var(--fusion-success)}

/* custo de ação: losangos SVG */
.cost{display:inline-flex;align-items:center;gap:2px;color:var(--fusion-text-muted);font-size:var(--fusion-text-sm)}
.cost .ctx{margin-left:var(--fusion-space-1);font-size:var(--fusion-text-xs)}

@media (hover:none){
  .en{padding-right:calc(var(--fusion-target) * 3 + var(--fusion-space-3))}
  .en .acts{opacity:1}
}

/* ---------- Balcões (variante C) ---------- */
.seg{display:flex;padding:var(--fusion-space-2) var(--fusion-space-2) 0;flex-shrink:0}
.seg button{flex:1;min-height:var(--fusion-target);background:var(--fusion-surface-alt);border:1px solid var(--fusion-border);color:var(--fusion-text-muted);font-size:var(--fusion-text-sm)}
.seg button:first-child{border-radius:var(--fusion-radius-sm) 0 0 var(--fusion-radius-sm)}
.seg button:last-child{border-radius:0 var(--fusion-radius-sm) var(--fusion-radius-sm) 0}
.seg button+button{border-left:0}
.seg button.on{background:var(--fusion-accent-dim);border-color:var(--fusion-accent);color:var(--fusion-text);font-weight:var(--fusion-weight-bold)}
.gest{font-size:var(--fusion-text-xs);color:var(--fusion-text-muted);padding:var(--fusion-space-2) var(--fusion-space-3)}
.gest b{color:var(--fusion-text)}
.to{display:flex;align-items:center;gap:var(--fusion-space-2);padding:var(--fusion-space-1) var(--fusion-space-2);border-bottom:1px solid var(--fusion-border);font-size:var(--fusion-text-sm);color:var(--fusion-text-muted);flex-shrink:0}
.to select{min-height:var(--fusion-target);background:var(--fusion-input-bg);border:1px solid var(--fusion-border);color:var(--fusion-text);font-size:var(--fusion-text-sm);border-radius:var(--fusion-radius-sm);padding:0 var(--fusion-space-2)}

/* ---------- Estados ---------- */
.empty{text-align:center;padding:var(--fusion-space-6) var(--fusion-space-4) var(--fusion-space-3);color:var(--fusion-text-muted);font-size:var(--fusion-text-sm)}
.empty.tight{padding:var(--fusion-space-3)}
.empty .hint{font-size:var(--fusion-text-xs);color:var(--fusion-text-subtle);margin-top:var(--fusion-space-2)}
.crumb{display:flex;align-items:center;flex-wrap:wrap;gap:var(--fusion-space-1) var(--fusion-space-2);padding:0 var(--fusion-space-2);border-bottom:1px solid var(--fusion-border);font-size:var(--fusion-text-sm);color:var(--fusion-text-muted);flex-shrink:0}
.crumb .back{display:inline-flex;align-items:center;gap:var(--fusion-space-1);min-height:var(--fusion-target);background:none;border:0;color:var(--fusion-accent-hover);font-size:var(--fusion-text-sm);padding:0 var(--fusion-space-1)}
.crumb b{color:var(--fusion-text)}
.more{font-size:var(--fusion-text-xs);color:var(--fusion-text-subtle);text-align:center;padding:var(--fusion-space-3)}
.bar-imp{background:var(--fusion-accent-dim);border-bottom:1px solid var(--fusion-accent);color:var(--fusion-text);font-size:var(--fusion-text-xs);padding:var(--fusion-space-2) var(--fusion-space-3);display:flex;align-items:center;gap:var(--fusion-space-2);flex-shrink:0}
.bar-imp .prog{flex:1;height:4px;background:var(--fusion-surface-alt);border-radius:var(--fusion-radius-sm);overflow:hidden}
.bar-imp .prog i{display:block;height:100%;width:38%;background:var(--fusion-accent)}

/* ---------- Janela flutuante (preview) ---------- */
.win{position:fixed;z-index:var(--fusion-z-windows);background:var(--fusion-surface);border:1px solid var(--fusion-border-strong);border-radius:var(--fusion-radius);box-shadow:var(--fusion-shadow-modal);width:420px;max-width:calc(100vw - 32px);max-height:74vh;display:flex;flex-direction:column;overflow:hidden}
.win .wh{display:flex;align-items:center;gap:var(--fusion-space-1);padding:0 var(--fusion-space-1) 0 var(--fusion-space-3);background:var(--fusion-surface-alt);border-bottom:1px solid var(--fusion-border);cursor:move}
.win .wh .t{font-size:var(--fusion-text-base);font-weight:var(--fusion-weight-bold);flex:1;min-width:0;overflow-wrap:anywhere;padding:var(--fusion-space-2) 0}
.win .wb{padding:var(--fusion-space-3) var(--fusion-space-4);overflow:auto;font-size:var(--fusion-text-sm)}
.win .hero{display:flex;gap:var(--fusion-space-3);align-items:flex-start;margin-bottom:var(--fusion-space-2)}
.win .hero .por{width:56px;height:56px;border-radius:var(--fusion-radius);background:var(--fusion-surface-alt);display:grid;place-items:center;font-size:var(--fusion-text-2xl);color:var(--fusion-text-muted);flex-shrink:0}
.win .hero h3{font-size:var(--fusion-text-lg)}
.win .kv{display:grid;grid-template-columns:auto 1fr;gap:var(--fusion-space-1) var(--fusion-space-3);font-size:var(--fusion-text-sm);margin:var(--fusion-space-2) 0}
.win .kv dt{color:var(--fusion-text-subtle)}
.win .kv dd{margin:0}
.win .txt{color:var(--fusion-text-muted);font-size:var(--fusion-text-sm);border-top:1px solid var(--fusion-border);padding-top:var(--fusion-space-2);margin-top:var(--fusion-space-2)}
.win .foot{display:flex;gap:var(--fusion-space-2);padding:var(--fusion-space-2) var(--fusion-space-3);border-top:1px solid var(--fusion-border);background:var(--fusion-surface-alt);flex-wrap:wrap;align-items:center}
.win .licbox{font-size:var(--fusion-text-xs);color:var(--fusion-text-subtle);border-top:1px solid var(--fusion-border);padding-top:var(--fusion-space-2);margin-top:var(--fusion-space-3)}
.win .licbox b{color:var(--fusion-text-muted)}

/* ---------- Alternador + legenda (fora do design) ---------- */
.switcher{position:fixed;left:var(--fusion-space-4);top:calc(var(--header) + var(--fusion-space-2));z-index:9999;display:flex;flex-wrap:wrap;align-items:center;gap:var(--fusion-space-2);background:var(--fusion-surface-alt);border:1px solid var(--fusion-border-strong);border-radius:var(--fusion-radius-lg);padding:var(--fusion-space-2);box-shadow:var(--fusion-shadow-popover);max-width:calc(100vw - 400px)}
.switcher button{min-height:var(--fusion-target);padding:0 var(--fusion-space-3);background:var(--fusion-surface);color:var(--fusion-text);border:1px solid var(--fusion-border);border-radius:var(--fusion-radius);font-size:var(--fusion-text-sm)}
.switcher button:hover{border-color:var(--fusion-accent)}
.legend{position:fixed;left:var(--fusion-space-4);bottom:var(--fusion-space-4);z-index:9999;background:var(--fusion-surface-alt);color:var(--fusion-text);border:1px solid var(--fusion-border-strong);border-radius:var(--fusion-radius-lg);padding:var(--fusion-space-3);box-shadow:var(--fusion-shadow-popover);font-size:var(--fusion-text-xs);max-width:430px;max-height:calc(100vh - 220px);overflow:auto}
.legend h4{margin:0 0 var(--fusion-space-2);font-size:var(--fusion-text-sm)}
.legend table{border-collapse:collapse}
.legend td{padding:2px var(--fusion-space-1);vertical-align:top}
.legend td:first-child{color:var(--fusion-text-muted);white-space:nowrap}
.legend .q{margin-top:var(--fusion-space-2);padding-top:var(--fusion-space-2);border-top:1px solid var(--fusion-border);color:var(--fusion-text-muted)}
.legend .q.dec{color:var(--fusion-text)}
</style>

<body>
<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Alternar tema">Tema: escuro</button>
<script>
  (function () {
    var b = document.getElementById("theme-toggle");
    function paint() { b.textContent = "Tema: " + (document.documentElement.dataset.theme === "light" ? "claro" : "escuro"); }
    b.addEventListener("click", function () {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      paint();
    });
    paint();
  })();
</script>

  {id:'e16',nm:'Espada Longa +1',   en:'+1 Longsword',     pk:'equipment',    lv:2,  ic:'sword', tr:['mágico'], w:true},

  {id:'e22',nm:'Fogo persistente',  en:'Persistent Fire',  pk:'glossary',     lv:null,ic:'book-open',tr:['dano']},
  {id:'e23',nm:'Tesouro do Covil',  en:'Lair Treasure',    pk:'tables',       lv:null,ic:'dices',tr:['tabela']},

const TXT = {
  e1:'Goblins guerreiros são a espinha dorsal de qualquer bando: barulhentos, rápidos e mais perigosos em grupo do que sozinhos.',

};

/* ===================== estado ===================== */
const url = new URL(location);
let variant = (url.searchParams.get('v')||'A').toUpperCase();
let role    = url.searchParams.get('role')==='player' ? 'player' : 'gm';
let big     = url.searchParams.get('big')!=='0';      /* acervo PF2e completo */
let importing = url.searchParams.get('imp')==='1';
let active='compendium', open=true;
let q='';                       /* busca (sobrevive à troca de aba — Q6) */
let openPack=null;              /* variante A: pack aberto */
let collapsed={};               /* variante A: grupos recolhidos */
let facet={type:null, lvl:null, rar:null, src:null};
let counter='map';              /* variante C: balcão */
let win=null;                   /* janela de preview (Q1) */
let winPos={x:null,y:null};
let target='Fofurinha';         /* variante C: para quem vai o item */

const isGm = ()=> role==='gm';
/* Q2: pack com plateia `gm` não existe para o jogador */
const packs = ()=> PACKS.filter(p=> (isGm()||p.aud==='all') && (big || p.lic==='mundo'));
const packOk = (id)=> packs().some(p=>p.id===id);

const norm = (s)=> (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hits(){
  const t = norm(q);
  let list = ENTRIES.filter(e=>packOk(e.pk));
  if(t) list = list.filter(e=> norm(e.nm).includes(t) || norm(e.en).includes(t) || e.tr.some(x=>norm(x).includes(t)));
  if(facet.type) list = list.filter(e=> P(e.pk).type===facet.type);
  if(facet.src)  list = list.filter(e=> e.pk===facet.src);
  if(facet.rar)  list = list.filter(e=> e.rar===facet.rar);
  if(facet.lvl==='low')  list = list.filter(e=> e.lv!==null && e.lv<=3);
  if(facet.lvl==='high') list = list.filter(e=> e.lv!==null && e.lv>3);
  return list;
}
/* o mock tem poucas linhas; o acervo tem 12 mil. O contador mente a verdade. */
const REAL = ()=> packs().reduce((a,p)=>a+p.n,0);
function scaled(shown){
  if(!q && !facet.type && !facet.src) return REAL();
  return Math.max(shown, Math.round(shown * (big?37:1)));
}

/* ===================== peças ===================== */
function tabButton(t){
  const gm = t.group==='gm';
  let badge='';
  if(t.id==='chat') badge='<span class="badge" aria-label="3 mensagens novas">3</span>';
  if(t.id==='compendium' && importing) badge='<span class="badge dot" aria-label="importação em andamento"></span>';
  const lb = t.label+(gm?' (só o Mestre)':'');
  return '<button class="tabbtn '+(active===t.id&&open?'is-active':'')+'" data-tab="'+t.id+'" aria-label="'+lb+'" title="'+lb+'">'
    + ic(t.icon) + badge + '</button>';
}
function mark(s){
  if(!q) return s;
  const i = norm(s).indexOf(norm(q));
  if(i<0) return s;
  return s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length);
}
function lvlOf(e){ return e.lv===null? '' : (e.lv<0? 'Nv −1' : 'Nv '+e.lv); }

/* custo de ação desenhado: losango cheio por ação; contorno = ação livre; rotate-ccw = reação */
function costHtml(e, withText){
  if(!e.ac) return '';
  const D = (id)=> '<svg class="svg-i" aria-hidden="true"><use href="#'+id+'"/></svg>';
  let g, txt, vis='';
  if(e.ac==='free'){ g=D('i-action-free'); txt='ação livre'; }
  else if(e.ac==='react'){ g=ic('rotate-ccw'); txt='reação'; }
  else if(e.ac==='var'){ g=D('i-action-filled'); txt='1 a 3 ações'; vis=withText?txt:'1 a 3'; }
  else { g=D('i-action-filled').repeat(e.ac); txt=e.ac+(e.ac===1?' ação':' ações'); }
  if(!vis && withText) vis=txt;
  return '<span class="cost" role="img" aria-label="'+txt+'" title="'+txt+'">'+g+(vis?'<span class="ctx">'+vis+'</span>':'')+'</span>';
}

function entryRow(e, opts){
  opts = opts||{};
  const p = P(e.pk);
  const canImport = isGm();
  const acts = '<div class="acts">'
    + '<button class="ib" data-prev="'+e.id+'" title="Pré-visualizar (abre janela)" aria-label="Pré-visualizar '+e.nm+' em janela">'+ic('eye')+'</button>'
    + (canImport ? '<button class="ib" data-imp="'+e.id+'" title="Importar para o mundo" aria-label="Importar '+e.nm+' para o mundo">'+ic('download')+'</button>' : '')
    + (p.dest==='sheet' ? '<button class="ib" data-sheet="'+e.id+'" title="Mandar para uma ficha" aria-label="Mandar '+e.nm+' para uma ficha">'+ic('clipboard-list')+'</button>' : '')
    + '</div>';
  const parts=[];
  if(e.w) parts.push('<span class="inw" title="já importado neste mundo">'+ic('check')+'no mundo</span>');
  if(opts.src) parts.push(p.label);
  if(e.rar) parts.push('<span class="rar '+e.rar+'">'+(e.rar==='rare'?'raro':'incomum')+'</span>');
  parts.push(e.tr.slice(0,2).join(', '));
  return '<div class="en'+(e.w?' inworld':'')+'" draggable="true" data-en="'+e.id+'">'
    + '<div class="por">'+ic(e.ic)+'</div>'
    + '<div class="mid">'
    +   '<div class="nm">'+mark(e.nm)+'</div>'
    +   (e.en?'<div class="en2">'+mark(e.en)+'</div>':'')
    +   '<div class="meta">'+parts.join(' · ')+'</div>'
    + '</div>'
    + '<div class="rt">'+(e.lv!==null?'<span class="lv">'+lvlOf(e)+'</span>':'')+costHtml(e,false)+'</div>'
    + acts + '</div>';
}

function searchBar(scope){
  return '<div class="srch">'
    + '<input id="q" type="search" placeholder="Buscar…" aria-label="Buscar" value="'+q.replace(/"/g,'&quot;')+'" />'
    + '<span class="scope">'+scope+'</span></div>';
}
function facetBar(){
  const f=[];
  const chip=(k,v,lb)=>'<button class="fc'+(facet[k]===v?' on':'')+'" data-f="'+k+'" data-v="'+v+'" aria-pressed="'+(facet[k]===v)+'">'+lb+(facet[k]===v?ic('x'):'')+'</button>';
  f.push(chip('type','Criaturas','Criaturas'));
  f.push(chip('type','Itens','Itens'));
  f.push(chip('type','Regras','Regras'));
  f.push(chip('lvl','low','Nível 3 ou menos'));
  f.push(chip('lvl','high','Nível acima de 3'));
  f.push(chip('rar','rare','Raro'));
  if(facet.src) f.push('<button class="fc on" data-f="src" data-v="'+facet.src+'" aria-pressed="true">Fonte: '+P(facet.src).label+ic('x')+'</button>');
  return '<div class="facets">'+f.join('')+'</div>';
}
function impBar(){
  return importing ? '<div class="bar-imp">'+ic('download')+'Importando 38/100<span class="prog"><i></i></span></div>' : '';
}

/* ================= variante A — estante ================= */
function bodyA(){
  if(openPack){
    const p = P(openPack);
    const list = hits().filter(e=>e.pk===openPack);
    return '<div class="crumb"><button class="back" data-back="1">'+ic('chevron-left')+'Compêndios</button> <b>'+p.label+'</b>'
      +   ' <span>'+licLabel(p)+'</span></div>'
      + searchBar('neste pack')
      + facetBar()
      + '<div class="counter"><b>'+fmt(scaled(list.length))+'</b> de '+fmt(p.n)+'<span class="grow"></span>'
      +   '<button class="b g" data-sort="1" title="Ordenar por nome, de A a Z" aria-label="Ordenar por nome, de A a Z">'+ic('arrow-up')+'Nome</button></div>'
      + '<div>'+ (list.length? list.map(e=>entryRow(e,{})).join('') : '<div class="empty">Nenhum resultado.<div class="hint">A busca vale só dentro deste pack — é assim que a REQ-CMP-013 é hoje.</div></div>')
      + (list.length&&big?'<div class="more">rolando: mais '+fmt(p.n-list.length)+' entradas</div>':'') + '</div>';
  }
  const groups = ['Criaturas','Itens','Regras'];
  let out = searchBar('nomes de pack');
  out += groups.map(function(g){
    const ps = packs().filter(p=>p.type===g && (!q || norm(p.label).includes(norm(q))));
    if(!ps.length) return '';
    const col = collapsed[g];
    return '<button class="secl" data-col="'+g+'" aria-expanded="'+(!col)+'"><span class="caret">'+ic(col?'chevron-right':'chevron-down')+'</span>'+g
      + '<span class="cnt">'+plural(ps.length,'pacote','pacotes')+'</span></button>'
      + (col?'':ps.map(function(p){
          return '<button class="pk" data-pk="'+p.id+'"><span class="por">'+ic(p.ic)+'</span>'
            + '<span class="mid"><span class="nm">'+p.label+'</span>'
            + '<span class="sub">'+plural(p.n,'documento','documentos').replace(/^\d+/,fmt(p.n))+' · '+licLabel(p)+'</span>'
            + (p.aud==='gm'?'<span class="aud">'+ic('lock')+'só o Mestre</span>':'')+'</span>'
            + '<span class="go">'+ic('chevron-right')+'</span></button>';
        }).join(''));
  }).join('');
  return out;
}

/* ================= variante B — busca ================= */
function bodyB(){
  const list = hits();
  let out = searchBar('todo o acervo') + facetBar();
  if(!q && !facet.type && !facet.src && !facet.rar && !facet.lvl){
    const fav = ENTRIES.filter(e=>['e11','e1','e17'].includes(e.id) && packOk(e.pk));
    const rec = ENTRIES.filter(e=>['e5','e15','e21'].includes(e.id) && packOk(e.pk));
    out += '<div class="counter"><b>'+fmt(REAL())+'</b> documentos em '+plural(packs().length,'compêndio','compêndios')+'</div>'
      + '<div class="secl">Fixados<span class="cnt">'+fav.length+'</span></div>'
      + (fav.length?fav.map(e=>entryRow(e,{src:true})).join(''):'<div class="empty tight">nada fixado ainda</div>')
      + '<div class="secl">Recentes<span class="cnt">'+rec.length+'</span></div>'
      + rec.map(e=>entryRow(e,{src:true})).join('')
      + '<div class="more">a aba abre em branco de propósito: <b>digite</b>. Pack aqui é filtro, não lugar.</div>';
    return out;
  }
  const byType = {};
  list.forEach(function(e){ const t=P(e.pk).type; (byType[t]=byType[t]||[]).push(e); });
  const keys = Object.keys(byType);
  out += '<div class="counter"><b>'+fmt(scaled(list.length))+'</b> resultados<span class="grow"></span>'
    + (q?'<span>busca casa pt-BR e original</span>':'')+'</div>';
  if(!keys.length) return out + '<div class="empty">Nada encontrado.<div class="hint">A busca varre todos os compêndios que você pode ver'
    + (isGm()?'':' — o bestiário não está entre eles (Q2)')+'.</div></div>';
  out += keys.map(function(t){
    return '<div class="secl">'+t+'<span class="cnt">'+byType[t].length+'</span></div>'
      + byType[t].map(e=>entryRow(e,{src:true})).join('');
  }).join('');
  return out;
}

/* ================= variante C — balcão ================= */
const COUNTERS = {
  map:  {lb:'Mapa',  dest:'map',   gest:'<b>Arraste para a cena.</b> Ator de pack é importado antes de virar presença (REQ-CMP-018).'},
  sheet:{lb:'Ficha', dest:'sheet', gest:'<b>Escolha para quem</b> e solte na ficha, ou use o ícone de prancheta.'},
  table:{lb:'Mesa',  dest:'table', gest:'<b>Abrir</b> mostra o texto; <b>mostrar</b> joga o verbete no chat para todos.'},
};
function bodyC(){
  const avail = Object.keys(COUNTERS).filter(k=> k!=='map' || isGm());
  if(!avail.includes(counter)) counter = avail[0];
  const c = COUNTERS[counter];
  const list = hits().filter(e=>P(e.pk).dest===c.dest);
  let out = '<div class="seg">'+avail.map(k=>'<button class="'+(counter===k?'on':'')+'" data-cnt="'+k+'">'+COUNTERS[k].lb+'</button>').join('')+'</div>'
    + searchBar('neste balcão');
  if(counter==='sheet') out += '<div class="to">para <select id="tgt" aria-label="Destino do item"><option>Fofurinha</option><option>Tobias</option>'
    + (isGm()?'<option>Goblin Guerreiro (cena)</option>':'')+'</select></div>';
  out += '<div class="gest">'+c.gest+'</div>';
  out += '<div class="counter"><b>'+fmt(scaled(list.length))+'</b> disponíveis<span class="grow"></span>'
    + '<span>'+plural(packs().filter(p=>p.dest===c.dest).length,'compêndio','compêndios')+'</span></div>';
  out += list.length? list.map(e=>entryRow(e,{src:true})).join('')
    : '<div class="empty">Nada neste balcão.<div class="hint">Balcão é opinião nossa: o sistema declara <b>documentType</b>, não destino (Q da variante C).</div></div>';
  return out;
}

/* ================= janela de preview (Q1) ================= */
function winHtml(){
  if(!win) return '';
  const e = ENTRIES.find(x=>x.id===win); if(!e) return '';
  const p = P(e.pk);
  const x = winPos.x!==null?winPos.x:(window.innerWidth-420-380);
  const y = winPos.y!==null?winPos.y:120;
  const kv = [];
  if(e.lv!==null) kv.push(['Nível', e.lv<0?'−1':e.lv]);
  if(e.ac) kv.push(['Custo', costHtml(e,true)]);
  kv.push(['Tipo', p.type]);
  kv.push(['Traços', e.tr.join(', ')+(e.rar?' · '+(e.rar==='rare'?'raro':'incomum'):'')]);
  kv.push(['Fonte', p.label]);
  return '<div class="win" role="dialog" aria-label="Pré-visualização de '+e.nm+'" style="left:'+x+'px;top:'+y+'px">'
    + '<div class="wh" data-drag="1"><span class="t">'+e.nm+'</span>'
    +   '<button class="ib" data-pin="1" title="Fixar janela" aria-label="Fixar janela">'+ic('pin')+'</button>'
    +   '<button class="ib" data-close="1" title="Fechar" aria-label="Fechar">'+ic('x')+'</button></div>'
    + '<div class="wb">'
    +   '<div class="hero"><div class="por">'+ic(e.ic)+'</div><div><h3>'+e.nm+'</h3>'
    +     (e.en?'<div class="en2">'+e.en+'</div>':'')+'</div></div>'
    +   '<dl class="kv">'+kv.map(k=>'<dt>'+k[0]+'</dt><dd>'+k[1]+'</dd>').join('')+'</dl>'
    +   '<div class="txt">'+(TXT[e.id]||'Resumo do documento carregado sob demanda (REQ-CMP-015): o índice não traz isto.')+'</div>'
    +   '<div class="licbox"><b>'+licLabel(p)+'</b> — licença do pack (DEC-CMP-03). '
    +     (p.lic==='OGL'?'Conteúdo legado sob OGL 1.0a; ':'')
    +     'nomes de produto e arte da editora não são redistribuídos (regra clean-room do projeto).</div>'
    + '</div>'
    + '<div class="foot">'
    +   (isGm()?'<button class="b p" data-imp="'+e.id+'">Importar para o mundo</button>':'')
    +   (p.dest==='sheet'?'<button class="b" data-sheet="'+e.id+'">Mandar para a ficha de '+target+'</button>':'')
    +   (p.dest==='table'?'<button class="b">Mostrar no chat</button>':'')
    +   '<span class="grow"></span>'
    +   (e.w?'<span class="inw">'+ic('check')+'já no mundo</span>':'')
    + '</div></div>';
}

/* ================= painel ================= */
function panelCompendium(){
  const head = '<div class="phead"><span class="ttl">Compêndio</span><span class="grow"></span>'
    + (variant==='A'&&openPack?'<button class="ib" data-back="1" title="Voltar aos compêndios" aria-label="Voltar aos compêndios">'+ic('undo-2')+'</button>':'')
    + (isGm()?'<button class="ib" title="Importar em lote [V2]" aria-label="Importar em lote">'+ic('download')+'</button>':'')
    + '<button class="ib" title="Ordenar e opções" aria-label="Ordenar e opções">'+ic('ellipsis')+'</button></div>';
  const body = variant==='A'?bodyA():variant==='B'?bodyB():bodyC();
  return head + impBar() + '<div class="pbody">'+body+'</div>';
}
function panel(){
  const inner = active==='compendium'
    ? panelCompendium()
    : '<div class="phead"><span class="ttl">'+TITLE[active]+'</span></div><div class="pbody">'+OTHER[active]+'</div>';
  return '<div class="panel">'+inner+'</div>';
}

/* ===================== render ===================== */
function render(){
  const all = TABS.filter(t=>t.group==='all'&&!t.foot);
  const gms = TABS.filter(t=>t.group==='gm'&&isGm());
  const foot= TABS.filter(t=>t.foot);
  document.getElementById('root').innerHTML =
    '<div class="'+(open?'is-open':'')+'"><aside class="shell">'
    + '<nav class="tabs"><div class="grp">'+all.map(tabButton).join('')+'</div>'
    + '<div class="grp gm">'+gms.map(tabButton).join('')+'</div>'
    + '<div class="foot">'+foot.map(tabButton).join('')+'</div></nav>'
    + panel() + '</aside></div>';
  document.getElementById('float').innerHTML = winHtml();

  const who = document.getElementById('who');
  who.className = 'who '+(isGm()?'':'player');
  who.innerHTML = isGm() ? '<span class="dot pt"></span>Gamemaster · <span class="muted">Mestre</span>'
                         : '<span class="dot pt"></span>Alexandre · <span class="muted">Jogador (Fofurinha)</span>';
  wire(); chrome();
  const u = new URL(location);
  u.searchParams.set('v',variant); u.searchParams.set('role',role);
  u.searchParams.set('big',big?'1':'0'); u.searchParams.set('imp',importing?'1':'0');
  history.replaceState(null,'',u);
}

function wire(){
  const root = document.getElementById('root'), float = document.getElementById('float');
  const on = (scope,sel,fn)=> scope.querySelectorAll(sel).forEach(el=>{ el.onclick=(ev)=>{ ev.stopPropagation(); fn(el,ev); }; });

  on(root,'[data-tab]', el=>{ const id=el.dataset.tab; if(open&&active===id){open=false;} else {active=id;open=true;} render(); });
  on(root,'[data-pk]',  el=>{ openPack=el.dataset.pk; q=''; render(); });
  on(root,'[data-back]',()=>{ openPack=null; q=''; render(); });
  on(root,'[data-col]', el=>{ const g=el.dataset.col; collapsed[g]=!collapsed[g]; render(); });
  on(root,'[data-cnt]', el=>{ counter=el.dataset.cnt; render(); });
  on(root,'[data-f]',   el=>{ const k=el.dataset.f, v=el.dataset.v; facet[k] = facet[k]===v?null:v; render(); });
  [root,float].forEach(s=>{
    on(s,'[data-prev]', el=>{ win=el.dataset.prev; render(); });
    on(s,'[data-imp]',  el=>{ const e=ENTRIES.find(x=>x.id===el.dataset.imp); if(e){ e.w=true; } render(); });
    on(s,'[data-sheet]',el=>{ const e=ENTRIES.find(x=>x.id===el.dataset.sheet); if(e){ e.w=true; } flash('Enviado à ficha de '+target+': '+e.nm+(isGm()?'':' (importado em nome do jogador — Q3)')); render(); });
  });
  on(float,'[data-close]',()=>{ win=null; render(); });

  const qi = root.querySelector('#q');
  if(qi){ qi.oninput = (e)=>{ q=e.target.value; const pos=e.target.selectionStart; render();
      const n=document.getElementById('q'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }; }
  const tg = root.querySelector('#tgt');
  if(tg){ tg.onchange = (e)=>{ target=e.target.value; render(); }; }

  /* arrastar para o mapa */
  const dz = document.getElementById('dropzone');
  root.querySelectorAll('[data-en]').forEach(el=>{
    el.ondragstart = (ev)=>{ const e=ENTRIES.find(x=>x.id===el.dataset.en); ev.dataTransfer.setData('text/plain', e.id);
      el.classList.add('drag'); dz.classList.add('hot');
      document.getElementById('droplbl').textContent = P(e.pk).dest==='map'
        ? e.nm+': importa e vira presença na cena (REQ-CMP-018)'
        : e.nm+': solte numa ficha — no mapa isso não é presença'; };
    el.ondragend = ()=>{ el.classList.remove('drag'); dz.classList.remove('hot'); };
  });
  dz.ondragover = (ev)=>ev.preventDefault();
  dz.ondrop = (ev)=>{ ev.preventDefault(); const e=ENTRIES.find(x=>x.id===ev.dataTransfer.getData('text/plain'));
    if(e){ e.w=true; flash(P(e.pk).dest==='map' ? e.nm+' importado e posto na cena' : e.nm+' não vira presença: é item'); }
    dz.classList.remove('hot'); render(); };

  /* arrastar a janela */
  const wh = float.querySelector('[data-drag]');
  if(wh) wh.onmousedown = (ev)=>{
    if(ev.target.closest('button')) return;
    const w = float.querySelector('.win'), r = w.getBoundingClientRect();
    const dx = ev.clientX-r.left, dy = ev.clientY-r.top;
    const mv = (e2)=>{ winPos.x = e2.clientX-dx; winPos.y = e2.clientY-dy; w.style.left=winPos.x+'px'; w.style.top=winPos.y+'px'; };
    const up = ()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  };
}
function flash(msg){
  const lbl = document.getElementById('droplbl');
  lbl.textContent = msg;
  setTimeout(()=>{ const l=document.getElementById('droplbl'); if(l) l.textContent='ator de pack: importa primeiro, depois vira presença (REQ-CMP-018)'; }, 2600);
}

document.addEventListener('keydown', (e)=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  if(e.key==='1'){variant='A';openPack=null;win=null;render();}
  else if(e.key==='2'){variant='B';win=null;render();}
  else if(e.key==='3'){variant='C';win=null;render();}
  else if(e.key==='p') document.getElementById('role').click();
  else if(e.key==='a') document.getElementById('big').click();
  else if(e.key==='i') document.getElementById('imp').click();
  else if(e.key==='Escape'&&win){ win=null; render(); }
});
render();
</script>
</body>
</html>
